},{"id":"25n3b-1.c.ii","l":"(c)(ii)","m":2,"y":702,"h":20,"a":"Similarity: in every period the first IE generally **decreases as the atomic radius increases** (left to right in each period the radius falls and the IE rises).\nDifferences:\n- Period 2 atoms have the **smallest radii and highest IE values** and cover the widest range of IE (the steepest trend); period 3 lies in between; period 4 atoms are larger and mostly have lower IEs.\n- The trends are **not perfectly smooth**: some points fall below the trend (e.g. the group 13 and group 16 elements in each period), and the periods overlap.","g":"(c)"}],"c":{"y":0,"h":599},"ps":{"(c)":{"y":662,"h":20}},"split":false},{"id":"22m1p2-1-3.2","t":"May 2022 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m1p2-1.webp","W":973,"H":1876,"p":[{"id":"22m1p2-1.a.iii","l":"(a)(iii)","m":1,"y":60,"h":42,"a":"**Aluminium (Al)**: its oxide Al_{2}O_{3} is amphoteric, not basic."},{"id":"22m1p2-1.e.iii","l":"(e)(iii)","m":1,"y":1482,"h":67,"a":"**N^{3−} is larger.** Both have 10 electrons, but N has only 7 protons while Mg has 12, so the nucleus of N^{3−} attracts the same electrons less strongly.","g":"(e)"}],"c":{"y":0,"h":20},"ps":{"(e)":{"y":1204,"h":23}},"split":true},{"id":"22m2p2-2-3.2","t":"May 2022 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m2p2-2.webp","W":973,"H":715,"p":[{"id":"22m2p2-2.a","l":"(a)","m":2,"y":20,"h":20,"a":"Calcium has **more protons** (20 vs 19), so a greater nuclear charge.\nThe electron removed is from the same 4s sub level in both, with similar shielding, so the outer electron in Ca is **more strongly attracted** to the nucleus (and Ca is also slightly smaller)."}],"c":{"y":0,"h":20},"split":true},{"id":"22np2-2-3.2","t":"Nov 2022 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22np2-2.webp","W":973,"H":1733,"p":[{"id":"22np2-2.d","l":"(d)","m":1,"y":459,"h":20,"a":"**Nitrogen** is more electronegative. N has a greater nuclear charge (7 vs 6 protons) in the same period and a smaller atomic radius, so it attracts the bonding pair of electrons more strongly."}],"c":{"y":0,"h":375},"split":true},{"id":"23m1p2-2-3.2","t":"May 2023 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m1p2-2.webp","W":973,"H":2486,"p":[{"id":"23m1p2-2.b","l":"(b)","m":2,"y":991,"h":20,"a":"Down group 1 the outer electron is in a **higher energy level**, further from the nucleus, and is **more shielded** by inner electrons.\nAlthough the nuclear charge increases, the attraction for the outer electron is weaker, so less energy is needed to remove it."}],"c":{"y":0,"h":20},"split":true},{"id":"23np2-5-3.2","t":"Nov 2023 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/23np2-5.webp","W":973,"H":750,"p":[{"id":"23np2-5.b","l":"(b)","m":4,"y":664,"h":86,"a":"Li to Be: Be has a **greater nuclear charge** (4 vs 3 protons), while the electron is removed from the **same 2s sub level** with the same shielding (by the 1s² electrons), so it is held more strongly: IE increases.\nBe to B: although B has a greater nuclear charge, its outer electron is in the **2p sub level**, which is **higher in energy** (further from the nucleus) and is also **shielded by the filled 2s sub level**, so it is easier to remove: IE decreases."}],"c":{"y":0,"h":20},"split":true},{"id":"24m2p2-3-3.2","t":"May 2024 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24m2p2-3.webp","W":973,"H":378,"p":[{"id":"24m2p2-3.b.i","l":"(b)(i)","m":1,"y":127,"h":20,"a":"**Na_{2}O(s) + H_{2}O(l) → 2NaOH(aq)**","g":"(b)"},{"id":"24m2p2-3.d","l":"(d)","m":1,"y":332,"h":46,"a":"P^{3−} and S^{2−} are **isoelectronic** (both have 18 electrons), but P has **fewer protons** (15 vs 16). The smaller nuclear charge attracts the same number of electrons less strongly, so P^{3−} is larger."}],"c":{"y":0,"h":19},"ps":{"(b)":{"y":83,"h":44}},"split":true},{"id":"24np2-2-3.2","t":"Nov 2024 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24np2-2.webp","W":973,"H":666,"p":[{"id":"24np2-2.d.ii","l":"(d)(ii)","m":1,"y":626,"h":20,"a":"Potassium reacts **more vigorously** than sodium (faster fizzing; the heat released ignites the hydrogen, giving a lilac flame), because K loses its outer electron more easily.","g":"(d)"},{"id":"24np2-2.d.iii","l":"(d)(iii)","m":1,"y":646,"h":20,"a":"K_{2}O is a **basic** oxide: **K_{2}O(s) + H_{2}O(l) → 2KOH(aq)** (forms an alkaline solution).\n(or K_{2}O + 2HCl → 2KCl + H_{2}O, reacting with an acid)","g":"(d)"}],"c":{"y":0,"h":19},"ps":{"(d)":{"y":521,"h":58}},"split":true},{"id":"25m2p2-2-3.2","t":"May 2025 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m2p2-2.webp","W":973,"H":745,"p":[{"id":"25m2p2-2.a.iii","l":"(a)(iii)","m":2,"y":260,"h":82,"a":"Lead has **one more proton** (greater nuclear charge), while the electron removed comes from the **same 6p sub level** with essentially the **same shielding** by inner electrons. So Pb's outer electron is held more strongly, and thallium's first ionization energy is lower.","g":"(a)"},{"id":"25m2p2-2.b.v","l":"(b)(v)","m":1,"y":658,"h":43,"a":"**Not amphoteric**: thallium is a metal far down group 13 (period 6), so its hydroxide is **basic** (metallic character increases down a group; only lighter members such as Al give amphoteric hydroxides).","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":20},"(b)":{"y":342,"h":20}},"split":true},{"id":"25n1p2-1-3.2","t":"Nov 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25n1p2-1.webp","W":973,"H":1792,"p":[{"id":"25n1p2-1.a.iii","l":"(a)(iii)","m":2,"y":992,"h":44,"a":"Down group 15 the outer electrons are in **higher energy levels**, further from the nucleus, and are **more shielded** by inner electrons. The increase in nuclear charge is outweighed, so the attraction for the outer electron is weaker and less energy is needed to remove it."}],"c":{"y":0,"h":44},"split":true},{"id":"25n3p2-5-3.2","t":"Nov 2025 TZ3 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/25n3p2-5.webp","W":973,"H":1014,"p":[{"id":"25n3p2-5.c.iv","l":"(c)(iv)","m":2,"y":277,"h":114,"a":"Equation: **Br_{2}(aq) + 2I^{−}(aq) → 2Br^{−}(aq) + I_{2}(aq)**\nColour change: from **yellow/orange** (bromine water) to **brown** (iodine)."},{"id":"25n3p2-5.c.v","l":"(c)(v)","m":1,"y":391,"h":20,"a":"Bromine is **less reactive** (a weaker oxidizing agent) than chlorine, because Br atoms are larger and attract an extra electron less strongly. So bromine cannot remove electrons from chloride ions (cannot displace chlorine)."}],"c":{"y":0,"h":94},"split":true}]}]},{"k":"4","n":"Chemical bonding and structure","units":[{"k":"4.1","n":"Ionic bonding and structure","q":[{"id":"22m1-9","t":"May 2022 TZ1 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u4-1.webp","W":973,"H":448,"p":[{"id":"22m1-9","l":"","m":1,"y":0,"h":264,"a":"**D**\nPO_{4}^{3−} is the phosphate ion. Balance the charges: 3 Ca^{2+} (+6) and 2 PO_{4}^{3−} (−6).\n**Calcium phosphate, Ca_{3}(PO_{4})_{2}**"}]},{"id":"22m1-10","t":"May 2022 TZ1 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u4-1.webp","W":973,"H":448,"p":[{"id":"22m1-10","l":"","m":1,"y":276,"h":172,"a":"**B**\nNaCl is an ionic lattice. Melting needs a lot of energy to overcome the strong electrostatic attraction between oppositely charged Na^{+} and Cl^{−} ions throughout the lattice. There are no molecules, covalent bonds or delocalized electrons."}]},{"id":"22m2-11","t":"May 2022 TZ2 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u4-1.webp","W":973,"H":172,"p":[{"id":"22m2-11","l":"","m":1,"y":0,"h":172,"a":"**B**\n2 PO_{4}^{3−} carry a total charge of −6, so 3 Ti carry +6 and each Ti is +2: **titanium(II) phosphate**."}]},{"id":"23m1-9","t":"May 2023 TZ1 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u4-1.webp","W":973,"H":439,"p":[{"id":"23m1-9","l":"","m":1,"y":0,"h":187,"a":"**D**\n1s² 2s² 2p³ is nitrogen with 5 valence electrons. It gains **3 electrons** to reach a full octet, forming N^{3−} (nitride)."}]},{"id":"23m1-10","t":"May 2023 TZ1 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u4-1.webp","W":973,"H":439,"p":[{"id":"23m1-10","l":"","m":1,"y":199,"h":240,"a":"**D**\nIonic lattices have **high melting points** (strong electrostatic attraction between ions) and **conduct when liquid** (the ions are free to move). They do not conduct as solids."}]},{"id":"23n-10","t":"Nov 2023 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u4-1.webp","W":973,"H":169,"p":[{"id":"23n-10","l":"","m":1,"y":0,"h":169,"a":"**C**\nPO_{4}^{3−} has a 3− charge, so in PrPO_{4} praseodymium is Pr^{3+}.\nWith O^{2−}: 2 Pr^{3+} (+6) and 3 O^{2−} (−6), so **Pr_{2}O_{3}**."}]},{"id":"24m1-9","t":"May 2024 TZ1 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u4-1.webp","W":973,"H":174,"p":[{"id":"24m1-9","l":"","m":1,"y":0,"h":174,"a":"**C**\nAmmonium is NH_{4}^{+} and phosphate is PO_{4}^{3−}. Three NH_{4}^{+} balance one PO_{4}^{3−}: **(NH_{4})_{3}PO_{4}**."}]},{"id":"25m1a-7","t":"May 2025 TZ1 Paper 1A · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u4-1.webp","W":973,"H":462,"p":[{"id":"25m1a-7","l":"","m":1,"y":0,"h":287,"a":"**D**\nCa forms Ca^{2+} and N forms N^{3−}. Balance the charges: 3 Ca^{2+} (+6) and 2 N^{3−} (−6), so **Ca_{3}N_{2}**.\nCa^{2+} has lost its two 4s electrons: **[Ar]**. N^{3−} has gained three electrons: 1s² 2s² 2p⁶ = **[Ne]**."}]},{"id":"25m1a-10","t":"May 2025 TZ1 Paper 1A · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u4-1.webp","W":973,"H":462,"p":[{"id":"25m1a-10","l":"","m":1,"y":299,"h":163,"a":"**D**\nAll four have 2+ and 2− ions, so the bond strength depends on ion size. Larger ions have their charges further apart, giving weaker attraction.\nCa^{2+} is larger than Mg^{2+} and S^{2−} is larger than O^{2−}, so **CaS** has the weakest ionic bond."}]},{"id":"25m2a-6","t":"May 2025 TZ2 Paper 1A · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u4-1.webp","W":973,"H":219,"p":[{"id":"25m2a-6","l":"","m":1,"y":0,"h":219,"a":"**A**\n[He] 2s² 2p³ is nitrogen with 5 valence electrons. It gains 3 electrons to complete its octet, forming **N^{3−}**."}]},{"id":"25m3a-6","t":"May 2025 TZ3 Paper 1A · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u4-1.webp","W":973,"H":542,"p":[{"id":"25m3a-6","l":"","m":1,"y":0,"h":176,"a":"**D**\nAl^{3+} and SO_{4}^{2−}: the lowest common multiple of 3 and 2 is 6, so 2 Al^{3+} (+6) and 3 SO_{4}^{2−} (−6): **Al_{2}(SO_{4})_{3}**."}]},{"id":"25m3a-7","t":"May 2025 TZ3 Paper 1A · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u4-1.webp","W":973,"H":542,"p":[{"id":"25m3a-7","l":"","m":1,"y":188,"h":354,"a":"**B**\nA high melting point, no conduction as a solid but good conduction when molten is typical of an **ionic lattice**: the ions are fixed in the solid but free to move in the liquid.\nMetals conduct as solids; covalent networks and simple molecules do not conduct when molten."}]},{"id":"25n1a-6","t":"Nov 2025 TZ1 Paper 1A · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u4-1.webp","W":973,"H":563,"p":[{"id":"25n1a-6","l":"","m":1,"y":0,"h":563,"a":"**D**\nNaCl dissolves in water: the polar water molecules surround the ions and pull the lattice apart.\nThe ions are held by strong ionic (electrostatic) attraction, not covalent bonds, and each Na^{+} is surrounded by **six** Cl^{−} ions."}]},{"id":"25n3a-12","t":"Nov 2025 TZ3 Paper 1A · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-1.webp","W":973,"H":156,"p":[{"id":"25n3a-12","l":"","m":1,"y":0,"h":156,"a":"**A**\nIonic attraction is strongest for **small** ions with **high** charges. All options have 1+ and 2− ions, so pick the smallest: Li^{+} (smaller than K^{+}) and O^{2−} (smaller than Se^{2−})."}]},{"id":"22m1p2-1-4.1","t":"May 2022 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m1p2-1.webp","W":973,"H":1876,"p":[{"id":"22m1p2-1.g","l":"(g)","m":4,"y":1569,"h":307,"a":"Magnesium: **metallic** bonding: the valence electrons are **delocalized** and the attraction between the Mg^{2+} ions (cations) and the sea of delocalized electrons holds the lattice together.\nOxygen: **covalent** bonding: the two O atoms **share** two pairs of valence electrons (O=O double bond); the shared electrons are attracted to both nuclei.\nMagnesium oxide: **ionic** bonding: each Mg atom **transfers** two electrons to an O atom, forming Mg^{2+} and O^{2−} ions, which are held by electrostatic attraction."}],"c":{"y":0,"h":20},"split":true},{"id":"24m1p2-6-4.1","t":"May 2024 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/24m1p2-6.webp","W":973,"H":790,"p":[{"id":"24m1p2-6.b.iii","l":"(b)(iii)","m":2,"y":747,"h":43,"a":"NiCl_{2} is ionic: a lattice of Ni^{2+} and Cl^{−} ions held together by strong **electrostatic attraction** between oppositely charged ions.\nIn the solid the ions are **fixed** in place; when molten the ions are **free to move** and carry charge, so it conducts."}],"split":true},{"id":"24np2-2-4.1","t":"Nov 2024 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24np2-2.webp","W":973,"H":666,"p":[{"id":"24np2-2.a","l":"(a)","m":2,"y":19,"h":159,"a":"K(s): **conducts**: it has **delocalized electrons** that are free to move through the metallic lattice.\nKCl(s): **does not conduct**: its ions are held in fixed positions in the lattice and cannot move (there are no free electrons)."}],"c":{"y":0,"h":19},"split":true},{"id":"25m1p2-4-4.1","t":"May 2025 TZ1 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m1p2-4.webp","W":973,"H":921,"p":[{"id":"25m1p2-4.b.i","l":"(b)(i)","m":2,"y":374,"h":156,"a":"Ionic bonding: **electrostatic attraction between oppositely charged ions**, the Fe^{3+} cations and NO_{3}^{−} anions in the lattice.\nCovalent bonding: **shared pairs of electrons** between the N and O atoms **within each nitrate ion**.","g":"(b)"}],"c":{"y":0,"h":44},"ps":{"(b)":{"y":354,"h":20}},"split":true},{"id":"25m2p2-2-4.1","t":"May 2025 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m2p2-2.webp","W":973,"H":745,"p":[{"id":"25m2p2-2.b.i","l":"(b)(i)","m":2,"y":362,"h":185,"a":"Covalent bond between: **S and O atoms** (within the sulfate ion)\nIonic bond between: **Tl^{+} ions and SO_{4}^{2−} ions**","g":"(b)"},{"id":"25m2p2-2.b.ii","l":"(b)(ii)","m":1,"y":547,"h":20,"a":"In a covalent bond valence electrons are **shared** between atoms (a shared pair attracted to both nuclei); in an ionic bond valence electrons are **transferred** from one atom to another, forming ions held by electrostatic attraction.","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":342,"h":20}},"split":true},{"id":"25n3p2-2-4.1","t":"Nov 2025 TZ3 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n3p2-2.webp","W":973,"H":542,"p":[{"id":"25n3p2-2.b.ii","l":"(b)(ii)","m":1,"y":522,"h":20,"a":"**Ni(NO_{3})_{2}**"}],"c":{"y":0,"h":21},"split":true}]},{"k":"4.2","n":"Covalent bonding","q":[{"id":"22m2-9","t":"May 2022 TZ2 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u4-2.webp","W":973,"H":169,"p":[{"id":"22m2-9","l":"","m":1,"y":0,"h":169,"a":"**D**\nIntramolecular means the bonds within the molecule. HCN is covalent: a covalent bond is the electrostatic attraction between a shared pair of electrons and the positively charged nuclei.\nB and C describe forces between molecules, and HCN is not ionic."}]},{"id":"22n-13","t":"Nov 2022 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u4-2.webp","W":973,"H":309,"p":[{"id":"22n-13","l":"","m":1,"y":0,"h":309,"a":"**C**\nFor similar bonds, the shorter the bond the stronger it is.\nLongest to shortest: C–Cl (1.77) > C–C (1.54) > C–F (1.38)\nSo strength increases **C–Cl < C–C < C–F**."}]},{"id":"23m1-12","t":"May 2023 TZ1 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u4-2.webp","W":973,"H":173,"p":[{"id":"23m1-12","l":"","m":1,"y":0,"h":173,"a":"**D**\nB has 3 valence electrons and forms three bonds in BF_{3}, so it has only **6 electrons** around it (incomplete octet).\nIn H_{2}Se, PH_{3} and OF_{2} the central atom has a full octet (bonding pairs plus lone pairs)."}]},{"id":"23m2-10","t":"May 2023 TZ2 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u4-2.webp","W":973,"H":265,"p":[{"id":"23m2-10","l":"","m":1,"y":0,"h":265,"a":"**C**\nMore shared electron pairs between the two C atoms means a stronger, shorter bond.\nStrength: C–C < C=C < C≡C\nLength: C≡C < C=C < C–C"}]},{"id":"24m1-10","t":"May 2024 TZ1 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u4-2.webp","W":973,"H":153,"p":[{"id":"24m1-10","l":"","m":1,"y":0,"h":153,"a":"**D**\nPolarity depends on the electronegativity difference. F is the most electronegative element, so **F–H** has the largest difference (about 1.8)."}]},{"id":"24m2-10","t":"May 2024 TZ2 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u4-2.webp","W":973,"H":155,"p":[{"id":"24m2-10","l":"","m":1,"y":0,"h":155,"a":"**C**\nStructure: HO–C(=O)–C(=O)–OH\nCount bonding pairs: C–C 1; two C=O double bonds 2 × 2 = 4; two C–O single 2; two O–H 2.\nTotal = 1 + 4 + 2 + 2 = **9**"}]},{"id":"24n-9","t":"Nov 2024 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u4-2.webp","W":973,"H":200,"p":[{"id":"24n-9","l":"","m":1,"y":0,"h":200,"a":"**C**\nThe lone pair on N in NH_{3} is donated to an H^{+} from water, forming NH_{4}^{+.} A covalent bond where **both electrons come from one atom** is a **coordinate (dative) covalent** bond."}]},{"id":"25m1a-9","t":"May 2025 TZ1 Paper 1A · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u4-2.webp","W":973,"H":506,"p":[{"id":"25m1a-9","l":"","m":1,"y":0,"h":280,"a":"**B**\nNF_{3}: N has 3 bonding pairs + 1 lone pair = 8 electrons. PCl_{3}: P also has 3 bonding pairs + 1 lone pair = 8. All F and Cl atoms have 8.\nBF_{3}: B only has 3 bonding pairs = 6 electrons (incomplete octet)."}]},{"id":"25m1a-13","t":"May 2025 TZ1 Paper 1A · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u4-2.webp","W":973,"H":506,"p":[{"id":"25m1a-13","l":"","m":1,"y":292,"h":214,"a":"**C**\nIn AlCl_{3} (g) the Al has only 6 electrons around it and in BeCl_{2} (g) the Be has only 4. Neither fits the octet rule, so the model had to allow **exceptions to the octet rule** (incomplete octets)."}]},{"id":"25m3a-22","t":"May 2025 TZ3 Paper 1A · Q22","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u4-2.webp","W":973,"H":170,"p":[{"id":"25m3a-22","l":"","m":1,"y":0,"h":170,"a":"**C**\nMore shared electron pairs make a shorter bond.\nCO has a C≡O triple bond (shortest). CO_{2} and H_{2}CO have C=O double bonds; CH_{3}OH has a C–O single bond (longest)."}]},{"id":"22m1p2-2-4.2","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.b","l":"(b)","m":1,"y":368,"h":306,"a":"N in the centre joined to three H atoms by single bonds (shared pairs), with **one lone pair** on N:\nH–N(:)–H with the third H on N. Total 8 electrons around N."}],"c":{"y":0,"h":21},"split":true},{"id":"22m1p2-3-4.2","t":"May 2022 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m1p2-3.webp","W":973,"H":1211,"p":[{"id":"22m1p2-3.f.iii","l":"(f)(iii)","m":1,"y":1147,"h":64,"a":"The bond polarity **decreases** down group 17, because the **electronegativity of the halogen decreases** (F > Cl > Br > I), so the electronegativity difference between C and X gets smaller.","g":"(f)"}],"c":{"y":0,"h":20},"ps":{"(f)":{"y":1047,"h":60}},"split":true},{"id":"22np2-2-4.2","t":"Nov 2022 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22np2-2.webp","W":973,"H":1733,"p":[{"id":"22np2-2.c","l":"(c)","m":1,"y":415,"h":44,"a":"The C–N bond **in the ring is shorter**. In the aromatic ring the electrons are delocalized, so the ring C–N bond has partial **double bond character** (bond order between 1 and 2), whereas the C–N1 bond is a **single** bond."}],"c":{"y":0,"h":375},"split":true},{"id":"23m1p2-6-4.2","t":"May 2023 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m1p2-6.webp","W":973,"H":1377,"p":[{"id":"23m1p2-6.a.iii","l":"(a)(iii)","m":2,"y":361,"h":58,"a":"O (3.4) is more electronegative than S (2.6), a difference of 0.8, so the shared electrons are pulled towards O: the bond is **polar**, with **O δ−** and **S δ+**."}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-2-4.2","t":"May 2023 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m2p2-2.webp","W":973,"H":1011,"p":[{"id":"23m2p2-2.b","l":"(b)","m":1,"y":405,"h":499,"a":"O_{2}N–NO_{2}: the two N atoms are joined by a single bond. Each N is bonded to two O atoms, one by a **double bond** and one by a **single bond**, and has no lone pair. The double bonded O atoms carry 2 lone pairs and the single bonded O atoms carry 3 lone pairs (34 valence electrons in total)."}],"c":{"y":0,"h":44},"split":true},{"id":"23np2-1-4.2","t":"Nov 2023 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23np2-1.webp","W":973,"H":597,"p":[{"id":"23np2-1.b","l":"(b)","m":1,"y":40,"h":243,"a":"H–C(=O)–O–H: the C forms a single bond to H, a **double bond to one O** and a single bond to the other O, which is bonded to H. Each O has **2 lone pairs**. (All four bonds around C; 18 valence electrons in total.)"}],"c":{"y":0,"h":20},"split":true},{"id":"24m1p2-4-4.2","t":"May 2024 TZ1 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m1p2-4.webp","W":973,"H":877,"p":[{"id":"24m1p2-4.b.i","l":"(b)(i)","m":1,"y":394,"h":20,"a":"**O=C=O** with two double bonds; each O has **2 lone pairs**; C has no lone pairs."},{"id":"24m1p2-4.b.ii","l":"(b)(ii)","m":1,"y":414,"h":44,"a":"**δ−** on each O atom and **δ+** on the C atom (O is more electronegative)."}],"c":{"y":0,"h":61},"split":true},{"id":"25m1p2-1-4.2","t":"May 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m1p2-1.webp","W":973,"H":728,"p":[{"id":"25m1p2-1.b","l":"(b)","m":1,"y":40,"h":43,"a":"The electronegativity difference between Fe (1.8) and S (2.6) is only about **0.8**, too small for ionic bonding (which needs a large difference, about 1.8 or more), but large enough for the shared electrons to be pulled towards S: **polar covalent**."}],"c":{"y":0,"h":20},"split":true},{"id":"25m2p2-1-4.2","t":"May 2025 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m2p2-1.webp","W":973,"H":1065,"p":[{"id":"25m2p2-1.a.i","l":"(a)(i)","m":1,"y":40,"h":294,"a":"**H–C≡N:** a single bond between H and C, a **triple bond** between C and N, and **one lone pair** on N.","g":"(a)"},{"id":"25m2p2-1.a.iii","l":"(a)(iii)","m":1,"y":463,"h":175,"a":"Partial positive: **H** (and the C next to it relative to N).\nPartial negative: **N** (the most electronegative atom).","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":20}},"split":true},{"id":"25n1p2-1-4.2","t":"Nov 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25n1p2-1.webp","W":973,"H":1792,"p":[{"id":"25n1p2-1.b.v","l":"(b)(v)","m":2,"y":1328,"h":43,"a":"The electronegativity difference between P (2.2) and O (3.4) is **1.2**, so the bond is **polar covalent**: the electrons are shared, but pulled more towards O (O is δ−, P is δ+).","g":"(b)"},{"id":"25n1p2-1.c","l":"(c)","m":2,"y":1371,"h":84,"a":"PH_{4}^{+} contains **covalent** P–H bonds: three are ordinary covalent bonds (each atom provides one electron of the shared pair), and one is a **coordinate (dative) covalent** bond, formed when the **lone pair on P in PH_{3} is donated to an H^{+} ion**. Once formed, all four bonds are identical."},{"id":"25n1p2-1.d","l":"(d)","m":1,"y":1455,"h":337,"a":"P in the centre with **three single bonds** to Cl atoms and **one lone pair** on P; each Cl has **three lone pairs** (26 valence electrons in total)."}],"c":{"y":0,"h":44},"ps":{"(b)":{"y":1036,"h":44}},"split":true},{"id":"25n3p2-2-4.2","t":"Nov 2025 TZ3 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n3p2-2.webp","W":973,"H":542,"p":[{"id":"25n3p2-2.a.i","l":"(a)(i)","m":1,"y":21,"h":220,"a":"The coordination (dative) bond is the **N→O single bond to the oxygen that is not bonded to H**: both electrons of this bond come from the nitrogen's lone pair. Draw an arrow from N to that O."}],"c":{"y":0,"h":21},"split":true},{"id":"25n3p2-5-4.2","t":"Nov 2025 TZ3 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/25n3p2-5.webp","W":973,"H":1014,"p":[{"id":"25n3p2-5.c.ii","l":"(c)(ii)","m":1,"y":214,"h":20,"a":"Each Br atom has 7 valence electrons and **shares one** with the other atom, forming a **single covalent bond** (one shared pair). Each Br then has an octet: one bonding pair and **three lone pairs**."}],"c":{"y":0,"h":94},"split":true}]},{"k":"4.3","n":"Covalent structures","q":[{"id":"22m1-11","t":"May 2022 TZ1 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u4-3.webp","W":973,"H":351,"p":[{"id":"22m1-11","l":"","m":1,"y":0,"h":174,"a":"**C**\nCF_{4} and CCl_{4} are symmetrical tetrahedra, so the bond dipoles cancel (non polar).\nIn CHF_{3} the three C–F dipoles all point away from the C–H, giving a large net dipole.\nIn CClF_{3} the C–Cl dipole also points away from carbon, partly cancelling the C–F dipoles.\nSo **CHF_{3}** is the most polar."}]},{"id":"22m1-12","t":"May 2022 TZ1 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u4-3.webp","W":973,"H":351,"p":[{"id":"22m1-12","l":"","m":1,"y":186,"h":165,"a":"**B**\nIn HCOO^{−} the negative charge is shared between the two O atoms: the C=O double bond can be drawn to either oxygen, so two equivalent resonance structures exist (both C–O bonds are identical).\nHCOOH, CH_{3}OH and H_{2}CO_{3} have fixed single and double bonds."}]},{"id":"22m2-10","t":"May 2022 TZ2 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u4-3.webp","W":973,"H":179,"p":[{"id":"22m2-10","l":"","m":1,"y":0,"h":179,"a":"**D**\nGiant covalent structures (diamond, SiO_{2}) have very high melting and boiling points (many strong covalent bonds), no mobile charged particles (poor conductors) and are insoluble in water.\nIonic compounds usually dissolve in water and conduct when molten; metals conduct."}]},{"id":"22n-9","t":"Nov 2022 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u4-3.webp","W":973,"H":970,"p":[{"id":"22n-9","l":"","m":1,"y":0,"h":169,"a":"**B**\nIn HNO_{3} the N=O double bond can be drawn to either of the two oxygens not bonded to H, giving two resonance structures. H_{2}S, H_{2}O_{2} and HClO only have single bonds."}]},{"id":"22n-10","t":"Nov 2022 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u4-3.webp","W":973,"H":970,"p":[{"id":"22n-10","l":"","m":1,"y":181,"h":174,"a":"**C**\nPH_{3} has 3 bonding pairs and 1 lone pair: trigonal pyramidal, so the P–H dipoles do not cancel and it is **polar**.\nBeH_{2} (linear), AlH_{3} (trigonal planar) and SiH_{4} (tetrahedral) are symmetrical and non polar."}]},{"id":"22n-11","t":"Nov 2022 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u4-3.webp","W":973,"H":970,"p":[{"id":"22n-11","l":"","m":1,"y":367,"h":603,"a":"**D**\nF and Cl are both more electronegative than C, so C is δ+ and both halogens are δ−.\nF is more electronegative than Cl, so the C–F dipoles are larger and the overall dipole points towards the F side of the molecule.\nThe dipole arrow points to the δ− end with the crossed tail at the δ+ end: only D shows this."}]},{"id":"23m1-13","t":"May 2023 TZ1 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u4-3.webp","W":973,"H":263,"p":[{"id":"23m1-13","l":"","m":1,"y":0,"h":263,"a":"**C**\nO_{2} has a double bond (bond order 2). In O_{3} the two O–O bonds are equal resonance hybrids, each between a single and a double bond (bond order 1.5).\nSo **oxygen has the stronger bond**, and breaking it needs more energy, which means **higher frequency** UV radiation (E = hf)."}]},{"id":"23m2-11","t":"May 2023 TZ2 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u4-3.webp","W":973,"H":357,"p":[{"id":"23m2-11","l":"","m":1,"y":0,"h":160,"a":"**D**\nS in SO_{2} has 3 electron domains (two bonding domains and one lone pair), so the **electron domain geometry is trigonal planar**. The molecular geometry is bent."}]},{"id":"23m2-12","t":"May 2023 TZ2 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u4-3.webp","W":973,"H":357,"p":[{"id":"23m2-12","l":"","m":1,"y":172,"h":185,"a":"**A**\nAll three have 4 electron domains, but lone pairs repel more strongly than bonding pairs and squeeze the bond angles.\nNH_{2}^{−}: 2 lone pairs, about 105°\nNH_{3}: 1 lone pair, about 107°\nNH_{4}^{+}: no lone pairs, 109.5°\nSo **NH_{2}^{−} < NH_{3} < NH_{4}^{+}**"}]},{"id":"23n-11","t":"Nov 2023 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u4-3.webp","W":973,"H":423,"p":[{"id":"23n-11","l":"","m":1,"y":0,"h":170,"a":"**D**\nIn SO_{2} the double bond can be drawn to either oxygen, giving two equivalent resonance structures (both S–O bonds are the same length).\nHCN, H_{2}CO_{3} and PCl_{3} each have only one Lewis structure."}]},{"id":"23n-12","t":"Nov 2023 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u4-3.webp","W":973,"H":423,"p":[{"id":"23n-12","l":"","m":1,"y":182,"h":241,"a":"**A**\nS in SO_{3} has three bonding domains and no lone pairs: 3 electron domains, so both the electron domain and the molecular geometry are **trigonal planar** (120°)."}]},{"id":"24m1-11","t":"May 2024 TZ1 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u4-3.webp","W":973,"H":554,"p":[{"id":"24m1-11","l":"","m":1,"y":0,"h":279,"a":"**C**\nO_{3}: the double bond can be drawn on either side (2 resonance structures).\nNO_{3}^{−}: the double bond can go to any of the three O atoms (3 resonance structures).\nPropene has a fixed C=C double bond, so no resonance."}]},{"id":"24m1-12","t":"May 2024 TZ1 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u4-3.webp","W":973,"H":554,"p":[{"id":"24m1-12","l":"","m":1,"y":291,"h":263,"a":"**C**\nN in NO_{2}^{−} has one single bond, one double bond and one lone pair: **3 electron domains** (trigonal planar electron domain geometry).\nWith one lone pair the shape is **bent**. The lone pair squeezes the angle slightly below 120°, to about **117°** (not as small as 105°, which needs two lone pairs and 4 domains)."}]},{"id":"24m2-9","t":"May 2024 TZ2 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u4-3.webp","W":973,"H":168,"p":[{"id":"24m2-9","l":"","m":1,"y":0,"h":168,"a":"**D**\nIn graphene (a single layer of graphite) each carbon is covalently bonded to **three** others at 120°, so the geometry around each C is **trigonal planar**. The rings are hexagonal but that is not the geometry of one atom."}]},{"id":"24n-11","t":"Nov 2024 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u4-3.webp","W":973,"H":528,"p":[{"id":"24n-11","l":"","m":1,"y":0,"h":528,"a":"**A**\nN(1): two bonding domains (one is a double bond) and one lone pair: 3 domains, so **bent**.\nC(2): three bonding domains, no lone pairs: **trigonal planar**.\nC(3): two bonding domains (single bond and triple bond): **linear**."}]},{"id":"25m1a-8","t":"May 2025 TZ1 Paper 1A · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u4-3.webp","W":973,"H":696,"p":[{"id":"25m1a-8","l":"","m":1,"y":0,"h":507,"a":"**A**\nW: each C bonded tetrahedrally to 4 others in a 3D network: **diamond**.\nX: stacked layers of hexagons: **graphite**.\nY: a closed cage of hexagons and pentagons: **fullerene** (C_{60}).\nZ: a single flat layer of hexagons: **graphene**."}]},{"id":"25m1a-11","t":"May 2025 TZ1 Paper 1A · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u4-3.webp","W":973,"H":696,"p":[{"id":"25m1a-11","l":"","m":1,"y":519,"h":177,"a":"**C**\nC_{2}H_{4}: trigonal planar about each C, about 120°\nCH_{4}: tetrahedral, 109.5°\nNH_{3}: 1 lone pair, about 107°\nH_{2}O: 2 lone pairs, about 104.5°\nDecreasing: **C_{2}H_{4}, CH_{4}, NH_{3}, H_{2}O**"}]},{"id":"25m2a-7","t":"May 2025 TZ2 Paper 1A · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u4-3.webp","W":973,"H":172,"p":[{"id":"25m2a-7","l":"","m":1,"y":0,"h":172,"a":"**C**\nSO_{2} has 3 electron domains on S (one lone pair), so it is **bent** and the S–O dipoles do not cancel: polar.\nCH_{4} (tetrahedral), C_{6}H_{6} (planar hexagon) and CO_{2} (linear) are symmetrical, so non polar."}]},{"id":"25m3a-23","t":"May 2025 TZ3 Paper 1A · Q23","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u4-3.webp","W":973,"H":264,"p":[{"id":"25m3a-23","l":"","m":1,"y":0,"h":264,"a":"**A**\nThe C (in CH_{2}) has four single bonds: 4 electron domains, **tetrahedral**.\nThe N (in NH_{2}) has three bonds and one lone pair: 4 electron domains, so its **electron domain geometry is also tetrahedral** (its molecular shape is trigonal pyramidal)."}]},{"id":"25n1a-7","t":"Nov 2025 TZ1 Paper 1A · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u4-3.webp","W":973,"H":435,"p":[{"id":"25n1a-7","l":"","m":1,"y":0,"h":264,"a":"**A**\nN in NO_{3}^{−} has 3 bonding domains (one double, two single bonds in any resonance structure) and no lone pair.\nElectron domain geometry and molecular geometry are both **trigonal planar**."}]},{"id":"25n1a-10","t":"Nov 2025 TZ1 Paper 1A · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u4-3.webp","W":973,"H":435,"p":[{"id":"25n1a-10","l":"","m":1,"y":276,"h":159,"a":"**B**\nIn graphite each C uses three electrons for bonding; the fourth is **delocalized** between the layers, so graphite conducts.\nDiamond has all electrons in localized bonds; fullerene is a poor conductor; silicon is a semiconductor."}]},{"id":"25n3a-6","t":"Nov 2025 TZ3 Paper 1A · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-3.webp","W":973,"H":713,"p":[{"id":"25n3a-6","l":"","m":1,"y":0,"h":240,"a":"**B**\nS in SCl_{2} has 2 bonding pairs and 2 lone pairs: 4 electron domains, so the electron domain geometry is **tetrahedral** and the molecular geometry is **bent**."}]},{"id":"25n3a-7","t":"Nov 2025 TZ3 Paper 1A · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-3.webp","W":973,"H":713,"p":[{"id":"25n3a-7","l":"","m":1,"y":252,"h":173,"a":"**D**\nCF_{4} and CO_{2} are symmetrical, so non polar.\nNH_{3} and NBr_{3} are both trigonal pyramidal. The N–H bond is much more polar than N–Br (N and Br have similar electronegativity), so **NH_{3}** is the most polar."}]},{"id":"25n3a-8","t":"Nov 2025 TZ3 Paper 1A · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-3.webp","W":973,"H":713,"p":[{"id":"25n3a-8","l":"","m":1,"y":437,"h":276,"a":"**B**\nGraphite and graphene each have one **delocalized electron** per carbon (each C bonds to only three others), so they conduct.\nIn diamond all four valence electrons are in localized covalent bonds, so it does not conduct."}]},{"id":"22m2p2-3-4.3","t":"May 2022 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m2p2-3.webp","W":973,"H":992,"p":[{"id":"22m2p2-3.d.i","l":"(d)(i)","m":1,"y":747,"h":224,"a":"N in the centre bonded to three O atoms: one **N=O double bond** and two **N–O single bonds**. The double bonded O has 2 lone pairs, each single bonded O has 3 lone pairs; N has no lone pairs. Draw square brackets around it with a **−** charge outside. (Any one resonance structure is accepted.)","g":"(d)"},{"id":"22m2p2-3.d.ii","l":"(d)(ii)","m":2,"y":971,"h":21,"a":"N has **three electron domains** (bonding domains) and **no lone pairs**. The domains repel each other and get as far apart as possible, giving a **trigonal planar** electron domain geometry with 120° bond angles.","g":"(d)"}],"c":{"y":0,"h":62},"ps":{"(d)":{"y":700,"h":47}},"split":true},{"id":"22m2p2-4-4.3","t":"May 2022 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22m2p2-4.webp","W":973,"H":1461,"p":[{"id":"22m2p2-4.a.i","l":"(a)(i)","m":1,"y":41,"h":21,"a":"In C_{60} each carbon is bonded to **three** other carbons (with some delocalized electrons); in diamond each carbon is bonded to **four** others in a tetrahedral arrangement.","g":"(a)"},{"id":"22m2p2-4.a.ii","l":"(a)(ii)","m":2,"y":62,"h":21,"a":"C_{60} is a **molecular** solid: subliming it only overcomes the weak **London (dispersion) forces between molecules**, so it sublimes at a relatively low temperature.\nDiamond is a **giant covalent** network: subliming it means breaking many **strong covalent bonds**, which needs a very high temperature.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":21}},"split":true},{"id":"22np2-1-4.3","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.c","l":"(c)","m":1,"y":83,"h":320,"a":"N in the centre bonded to three O atoms: one **N=O** and two **N–O** single bonds. The double bonded O has 2 lone pairs, each single bonded O has 3 lone pairs, N has none. Enclose in square brackets with a **−** charge."},{"id":"22np2-1.f.iv","l":"(f)(iv)","m":2,"y":1209,"h":496,"a":"Lewis structure: N=N=O with N in the centre (two double bonds), 2 lone pairs on the end N and 2 lone pairs on O, no lone pair on the central N. (N≡N–O with 3 lone pairs on O is also a valid resonance form.)\nShape: **linear** (two electron domains around the central N, 180°).","g":"(f)"}],"c":{"y":0,"h":21},"ps":{"(f)":{"y":962,"h":20}},"split":true},{"id":"23m1p2-2-4.3","t":"May 2023 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m1p2-2.webp","W":973,"H":2486,"p":[{"id":"23m1p2-2.c.i","l":"(c)(i)","m":1,"y":1011,"h":20,"a":"**Tetrahedral** (4 electron domains: 3 bonding pairs and 1 lone pair)."},{"id":"23m1p2-2.c.ii","l":"(c)(ii)","m":2,"y":1031,"h":589,"a":"Lewis structure: N with three single bonds to H atoms and **one lone pair**.\n3D shape: **trigonal pyramidal**: N at the top, three H below, bond angle about 107° (show the lone pair above N and use wedge / dash bonds)."}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-2-4.3","t":"May 2023 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m2p2-2.webp","W":973,"H":1011,"p":[{"id":"23m2p2-2.c.i","l":"(c)(i)","m":1,"y":927,"h":20,"a":"All N–O bonds are the same length, so they are **intermediate between single and double bonds**: N_{2}O_{4} shows **resonance** (the electrons are delocalized), rather than having separate fixed single and double bonds.","g":"(c)"},{"id":"23m2p2-2.c.ii","l":"(c)(ii)","m":1,"y":947,"h":20,"a":"About **120°** (each N has three electron domains and no lone pair: trigonal planar).","g":"(c)"}],"c":{"y":0,"h":44},"ps":{"(c)":{"y":904,"h":23}},"split":true},{"id":"23m2p2-3-4.3","t":"May 2023 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/23m2p2-3.webp","W":973,"H":996,"p":[{"id":"23m2p2-3.a.iii","l":"(a)(iii)","m":2,"y":597,"h":44,"a":"Structure: **layers** of carbon atoms arranged in **hexagonal rings**; each C is covalently bonded to **three** other C atoms, and the layers are held together by weak London (dispersion) forces.\nConduction: each C has one **delocalized electron** (the fourth valence electron), and these electrons can move along the layers, so graphite conducts electricity.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":537}},"split":true},{"id":"23np2-4-4.3","t":"Nov 2023 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/23np2-4.webp","W":973,"H":872,"p":[{"id":"23np2-4.b","l":"(b)","m":2,"y":222,"h":228,"a":"CS_{2}: **linear**. H_{2}S: **bent** (V shaped).\nReason: C in CS_{2} has only **two electron domains** (two double bonds, no lone pairs), which repel to 180°. S in H_{2}S has **four electron domains**, two of them **lone pairs**, which repel the bonding pairs into a bent shape (about 104.5° or less)."}],"c":{"y":0,"h":58},"split":true},{"id":"24m1p2-4-4.3","t":"May 2024 TZ1 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m1p2-4.webp","W":973,"H":877,"p":[{"id":"24m1p2-4.b.iii","l":"(b)(iii)","m":2,"y":458,"h":20,"a":"C has **two electron domains** (the two double bonds) and no lone pairs; they repel as far apart as possible, so the molecule is **linear** (180°).\nEach C=O bond is polar, but the two dipoles are equal and point in opposite directions, so they **cancel**: CO_{2} is **non polar**."}],"c":{"y":0,"h":61},"split":true},{"id":"24m1p2-7-4.3","t":"May 2024 TZ1 Paper 2 · Q7","s":"Structured questions (Paper 2)","img":"q/24m1p2-7.webp","W":973,"H":219,"p":[{"id":"24m1p2-7.a","l":"(a)","m":1,"y":0,"h":180,"a":"Bond length: the C–C bonds in benzene (140 pm) are all the same length, **between** the C–C single bond (154 pm) and C=C double bond (134 pm) in cyclohexene.\nBond strength: benzene's C–C bonds (507 kJ mol^{−1}) are **stronger than C–C single** (346) but **weaker than C=C double** (614) bonds. This is because of the delocalized (resonance) electrons in benzene."}],"split":true},{"id":"24m2p2-2-4.3","t":"May 2024 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24m2p2-2.webp","W":973,"H":1359,"p":[{"id":"24m2p2-2.b.i","l":"(b)(i)","m":1,"y":233,"h":298,"a":"Three O atoms in a bent chain: O=O–O. The central O has **one lone pair**; the double bonded end O has 2 lone pairs, the single bonded end O has 3 lone pairs. (Either resonance structure is fine.)"},{"id":"24m2p2-2.b.ii","l":"(b)(ii)","m":2,"y":531,"h":20,"a":"Shape: **bent** (V shaped): the central O has 3 electron domains including one lone pair.\nBond angle: about **117°** (slightly less than 120°, because the lone pair repels more)."},{"id":"24m2p2-2.c","l":"(c)","m":2,"y":551,"h":43,"a":"About **128 pm** (any value between 121 and 148 pm).\nOzone has **resonance**: each O–O bond is intermediate between a single bond (148 pm) and a double bond (121 pm), with a bond order of 1.5, so its length lies between the two."}],"c":{"y":0,"h":59},"split":true},{"id":"24np2-3-4.3","t":"Nov 2024 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24np2-3.webp","W":973,"H":1634,"p":[{"id":"24np2-3.a.i","l":"(a)(i)","m":1,"y":40,"h":370,"a":"S in the centre bonded to three O atoms: **one S=O double bond** and **two S–O single (coordinate) bonds**, with no lone pair on S. The double bonded O has 2 lone pairs and each single bonded O has 3 lone pairs, so every atom has an octet.","g":"(a)"},{"id":"24np2-3.a.iii","l":"(a)(iii)","m":2,"y":430,"h":151,"a":"Molecular geometry: **trigonal planar**\nBond angle: **120°**\n(3 electron domains around S and no lone pairs.)","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":20}},"split":true},{"id":"25m1p2-4-4.3","t":"May 2025 TZ1 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m1p2-4.webp","W":973,"H":921,"p":[{"id":"25m1p2-4.b.ii","l":"(b)(ii)","m":1,"y":530,"h":371,"a":"N in the centre with **one N=O double bond** and **two N–O single bonds**. The double bonded O has 2 lone pairs, each single bonded O has 3 lone pairs, N has no lone pair. Put the structure in square brackets with a **−** charge.","g":"(b)"},{"id":"25m1p2-4.b.iii","l":"(b)(iii)","m":1,"y":901,"h":20,"a":"**Trigonal planar**","g":"(b)"}],"c":{"y":0,"h":44},"ps":{"(b)":{"y":354,"h":20}},"split":true},{"id":"25m2p2-1-4.3","t":"May 2025 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m2p2-1.webp","W":973,"H":1065,"p":[{"id":"25m2p2-1.a.ii","l":"(a)(ii)","m":2,"y":334,"h":129,"a":"Molecular geometry: **linear** (180°).\nExplanation: C has **two electron domains** (the single bond and the triple bond) and no lone pairs; the domains repel and get as far apart as possible.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":20}},"split":true},{"id":"25m3p2-7-4.3","t":"May 2025 TZ3 Paper 2 · Q7","s":"Structured questions (Paper 2)","img":"q/25m3p2-7.webp","W":973,"H":1327,"p":[{"id":"25m3p2-7.a.ii","l":"(a)(ii)","m":1,"y":42,"h":224,"a":"S in the centre with **one lone pair**, bonded to two O atoms: O=S–O (octet form, one double and one single bond, with 2 and 3 lone pairs on the O atoms), or O=S=O with 2 lone pairs on each O. Both resonance forms are accepted."},{"id":"25m3p2-7.a.iii","l":"(a)(iii)","m":2,"y":266,"h":157,"a":"Electron domain geometry: **trigonal planar** (3 domains on S)\nMolecular geometry: **bent** (V shaped), because one domain is a lone pair"},{"id":"25m3p2-7.a.iv","l":"(a)(iv)","m":2,"y":423,"h":20,"a":"Each S–O bond is **polar**: O is more electronegative than S, so O is δ− and S is δ+.\nThe molecule is **bent**, so the bond dipoles **do not cancel**: SO_{2} has a net dipole and is **polar**."},{"id":"25m3p2-7.d","l":"(d)","m":3,"y":1145,"h":182,"a":"Silicon has a **giant covalent (network) structure**: melting requires breaking **many strong covalent bonds** throughout the lattice, so its melting point is very high (1683 K).\nPoly(ethene) consists of separate long **chain molecules**: melting only needs to overcome the **London (dispersion) forces between the chains** (no covalent bonds are broken), which are much weaker, so the melting point is far lower (393 K, though higher than small molecules because the chains are very large)."}],"c":{"y":0,"h":22},"split":true},{"id":"25n3p2-2-4.3","t":"Nov 2025 TZ3 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n3p2-2.webp","W":973,"H":542,"p":[{"id":"25n3p2-2.b.i","l":"(b)(i)","m":1,"y":261,"h":261,"a":"N in the centre with **one N=O double bond** and **two N–O single bonds**; the double bonded O has 2 lone pairs, each single bonded O has 3 lone pairs, N has none. Enclose in square brackets with a **−** charge."}],"c":{"y":0,"h":21},"split":true}]},{"k":"4.4","n":"Intermolecular forces","q":[{"id":"22m2-12","t":"May 2022 TZ2 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u4-4.webp","W":973,"H":171,"p":[{"id":"22m2-12","l":"","m":1,"y":0,"h":171,"a":"**A**\nCH_{4} is non polar (symmetrical tetrahedron), so the only forces between its molecules are **London (dispersion) forces**."}]},{"id":"23m2-9","t":"May 2023 TZ2 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u4-4.webp","W":973,"H":170,"p":[{"id":"23m2-9","l":"","m":1,"y":0,"h":170,"a":"**C**\nMethanol is a small molecule with weak intermolecular forces, so it is **volatile**, and its –OH group forms hydrogen bonds with water, so it is **soluble**.\nNaCl is not volatile, propane is insoluble, sucrose is not volatile."}]},{"id":"23n-13","t":"Nov 2023 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u4-4.webp","W":973,"H":184,"p":[{"id":"23n-13","l":"","m":1,"y":0,"h":184,"a":"**B**\nHCl is a small covalent molecule, a gas at room temperature, so it is **very volatile**. In water it ionizes completely (H^{+} and Cl^{−}), so the solution **conducts well**.\nNaCl is not volatile; C_{6}H_{5}Cl does not ionize; HCN is a weak acid (few ions)."}]},{"id":"24m2-12","t":"May 2024 TZ2 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u4-4.webp","W":973,"H":175,"p":[{"id":"24m2-12","l":"","m":1,"y":0,"h":175,"a":"**A**\nHexan-1-ol has one –OH group but a long non polar hydrocarbon chain, so it does not mix with water (**immiscible**).\nEthanoic acid and ethanol mix with water and with each other (hydrogen bonding); pentane and hexane mix (both non polar)."}]},{"id":"24n-10","t":"Nov 2024 Paper 1 · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u4-4.webp","W":973,"H":373,"p":[{"id":"24n-10","l":"","m":1,"y":0,"h":373,"a":"**A**\nCH_{4}: non polar, so **London dispersion only**.\nCH_{3}OH: polar with an O–H group, so London, dipole–dipole **and hydrogen bonding**.\nCH_{3}Cl: polar but no H on N, O or F, so London and **dipole–dipole** (no hydrogen bonding)."}]},{"id":"25m3a-8","t":"May 2025 TZ3 Paper 1A · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u4-4.webp","W":973,"H":192,"p":[{"id":"25m3a-8","l":"","m":1,"y":0,"h":192,"a":"**D**\nN is small and very electronegative, so NH_{3} forms **hydrogen bonds** between molecules. P is not electronegative enough, so PH_{3} has only London forces and weak dipole–dipole forces."}]},{"id":"25n1a-8","t":"Nov 2025 TZ1 Paper 1A · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u4-4.webp","W":973,"H":173,"p":[{"id":"25n1a-8","l":"","m":1,"y":0,"h":173,"a":"**D**\nDipole–dipole forces need a **polar** molecule. H_{2}CO (methanal) has a polar C=O bond and a trigonal planar shape where the dipoles do not cancel.\nCCl_{4}, O_{2} and C_{2}H_{6} are non polar (London forces only)."}]},{"id":"25n3a-14","t":"Nov 2025 TZ3 Paper 1A · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-4.webp","W":973,"H":176,"p":[{"id":"25n3a-14","l":"","m":1,"y":0,"h":176,"a":"**B**\nStraight chain hexane (C_{6}H_{14}) has the highest boiling point.\nIt has more electrons than butane (stronger London forces), and compared with its branched isomers (C and D) it has a larger surface area of contact between molecules."}]},{"id":"22m1p2-3-4.4","t":"May 2022 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m1p2-3.webp","W":973,"H":1211,"p":[{"id":"22m1p2-3.c.ii","l":"(c)(ii)","m":1,"y":378,"h":20,"a":"**Hydrogen bonding** (Compound B is an alcohol with an –OH group).","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(c)":{"y":107,"h":227}},"split":true},{"id":"22np2-4-4.4","t":"Nov 2022 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22np2-4.webp","W":973,"H":715,"p":[{"id":"22np2-4.a.iii","l":"(a)(iii)","m":2,"y":652,"h":20,"a":"A is an alcohol: its –OH group forms **hydrogen bonds** between molecules.\nB is an ester with no O–H bond, so it only has weaker **dipole–dipole and London forces**. Less energy is needed to separate B molecules, so B is **more volatile**."}],"c":{"y":0,"h":227},"split":true},{"id":"23m1p2-2-4.4","t":"May 2023 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m1p2-2.webp","W":973,"H":2486,"p":[{"id":"23m1p2-2.c.iii","l":"(c)(iii)","m":3,"y":1620,"h":45,"a":"NH_{3} molecules form **hydrogen bonds**: H is bonded to the small, very electronegative N, which also has a lone pair.\nPH_{3} cannot hydrogen bond (P is not electronegative enough); it only has **weak London (and dipole–dipole) forces**.\nHydrogen bonds are much stronger, so **more energy** is needed to separate NH_{3} molecules, giving a higher boiling point."}],"c":{"y":0,"h":20},"split":true},{"id":"23np2-1-4.4","t":"Nov 2023 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23np2-1.webp","W":973,"H":597,"p":[{"id":"23np2-1.d.i","l":"(d)(i)","m":2,"y":381,"h":44,"a":"Methanoic acid has an O–H group, so it forms **hydrogen bonds** between molecules.\nEthanal has no H bonded to O, so its strongest forces are **dipole–dipole** forces, which are much weaker. Less energy is needed to separate ethanal molecules, so it boils at a much lower temperature.","g":"(d)"},{"id":"23np2-1.d.ii","l":"(d)(ii)","m":1,"y":425,"h":20,"a":"Both can form **hydrogen bonds with water** molecules (the lone pairs on their O atoms accept H bonds from water, and methanoic acid's O–H can also donate).","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":341,"h":40}},"split":true},{"id":"24m1p2-2-4.4","t":"May 2024 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24m1p2-2.webp","W":973,"H":1323,"p":[{"id":"24m1p2-2.c.ii","l":"(c)(ii)","m":1,"y":1260,"h":20,"a":"**Hydrogen bonding**","g":"(c)"},{"id":"24m1p2-2.c.iii","l":"(c)(iii)","m":1,"y":1280,"h":43,"a":"**London (dispersion) forces**: butan-1-ol has more electrons and a larger surface area.","g":"(c)"}],"c":{"y":0,"h":697},"ps":{"(c)":{"y":1089,"h":20}},"split":true},{"id":"24m2p2-4-4.4","t":"May 2024 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m2p2-4.webp","W":973,"H":2256,"p":[{"id":"24m2p2-4.b","l":"(b)","m":2,"y":151,"h":43,"a":"Similarity: both have **London (dispersion) forces**, which are similar in size because the molecules have similar numbers of electrons (M about 42 and 44).\nDifference: ethenone is **polar**, so it also has **dipole–dipole forces**, whereas CO_{2} is linear and non polar (dipoles cancel). The extra forces make ethenone less volatile."}],"c":{"y":0,"h":131},"split":true},{"id":"24np2-1-4.4","t":"Nov 2024 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24np2-1.webp","W":973,"H":1074,"p":[{"id":"24np2-1.a.i","l":"(a)(i)","m":2,"y":427,"h":20,"a":"From methane to propane the molecules have **more electrons** (and a larger surface area), so the **London (dispersion) forces** between molecules get stronger. More energy is needed to separate the molecules, so the boiling point rises.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":407}},"split":true},{"id":"25m1p2-6-4.4","t":"May 2025 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/25m1p2-6.webp","W":973,"H":1705,"p":[{"id":"25m1p2-6.c.iv","l":"(c)(iv)","m":2,"y":1325,"h":263,"a":"Boiling point increases from ethene to pent-1-ene. Each alkene has one more CH_{2}, so **more electrons** and a larger surface area, giving **stronger London (dispersion) forces** between molecules; more energy is needed to separate them.","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(c)":{"y":1222,"h":20}},"split":true},{"id":"25m2p2-1-4.4","t":"May 2025 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m2p2-1.webp","W":973,"H":1065,"p":[{"id":"25m2p2-1.a.iv","l":"(a)(iv)","m":2,"y":638,"h":20,"a":"N_{2} is **non polar**, so only weak **London (dispersion) forces** act between its molecules.\nHCN is **polar**, so it has **dipole–dipole forces** in addition to London forces (and similar molar mass, 27 vs 28). The stronger intermolecular forces in HCN need more energy to overcome, so its boiling point is much higher.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":20}},"split":true},{"id":"25m3p2-7-4.4","t":"May 2025 TZ3 Paper 2 · Q7","s":"Structured questions (Paper 2)","img":"q/25m3p2-7.webp","W":973,"H":1327,"p":[{"id":"25m3p2-7.c","l":"(c)","m":1,"y":608,"h":537,"a":"Draw a dotted line from an **H of an O–H group in H_{2}SO_{4} to a lone pair on the O of a water molecule** (or from an H of water to an O atom of H_{2}SO_{4}). The O–H···O atoms should be in a straight line."}],"c":{"y":0,"h":22},"split":true},{"id":"25n1p2-1-4.4","t":"Nov 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25n1p2-1.webp","W":973,"H":1792,"p":[{"id":"25n1p2-1.b.iv","l":"(b)(iv)","m":2,"y":1247,"h":81,"a":"P_{4}O_{6} has a **simple molecular** (covalent molecular) structure. Melting only overcomes the **weak intermolecular forces** (London / dipole–dipole) between the molecules, not the strong covalent bonds within them, so little energy is needed.","g":"(b)"}],"c":{"y":0,"h":44},"ps":{"(b)":{"y":1036,"h":44}},"split":true},{"id":"25n3p2-5-4.4","t":"Nov 2025 TZ3 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/25n3p2-5.webp","W":973,"H":1014,"p":[{"id":"25n3p2-5.c.iii","l":"(c)(iii)","m":2,"y":234,"h":43,"a":"The halogens are non polar molecules held by **London (dispersion) forces**. Down the group the molecules have **more electrons** (and are larger), so the London forces get **stronger** and more energy is needed to separate the molecules.\nCl_{2} has the weakest forces (gas), Br_{2} intermediate (liquid), I_{2} the strongest (solid)."}],"c":{"y":0,"h":94},"split":true}]},{"k":"4.5","n":"Metallic bonding","q":[{"id":"22n-12","t":"Nov 2022 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u4-5.webp","W":973,"H":196,"p":[{"id":"22n-12","l":"","m":1,"y":0,"h":196,"a":"**D**\nSmaller atoms disrupt the regular layers so they cannot slide over each other easily. The alloy is **stronger and harder** but less malleable and ductile. Conductivity usually decreases."}]},{"id":"24m2-11","t":"May 2024 TZ2 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u4-5.webp","W":973,"H":172,"p":[{"id":"24m2-11","l":"","m":1,"y":0,"h":172,"a":"**C**\nMetallic bonding is non directional: the delocalized electrons attract the cations in all directions. Layers of **cations** can slide over each other without breaking the bonding, so the metal can be hammered into shape.\nMetals contain cations, not anions."}]},{"id":"24n-12","t":"Nov 2024 Paper 1 · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u4-5.webp","W":973,"H":303,"p":[{"id":"24n-12","l":"","m":1,"y":0,"h":303,"a":"**D**\nAll three are correct. An alloy is a homogeneous mixture of a metal with other metals or a non metal (I). Atoms of a different size disrupt the regular layers so they cannot slide easily (II), which is why steel (iron + carbon) is stronger than pure iron (III)."}]},{"id":"25m2a-9","t":"May 2025 TZ2 Paper 1A · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u4-5.webp","W":973,"H":160,"p":[{"id":"25m2a-9","l":"","m":1,"y":0,"h":160,"a":"**A**\nMetallic bond strength depends on the attraction between the cations and the delocalized electrons. All four form 2+ ions, so the **smallest** ion has the strongest attraction. Mg^{2+} is the smallest (group 2 radius increases down the group)."}]},{"id":"25m3a-9","t":"May 2025 TZ3 Paper 1A · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u4-5.webp","W":973,"H":172,"p":[{"id":"25m3a-9","l":"","m":1,"y":0,"h":172,"a":"**A**\nMetallic bond strength increases with **more delocalized electrons** (higher ion charge) and **smaller ions**.\nAl^{3+} > Mg^{2+} > Na^{+} > K^{+} (K^{+} is the largest 1+ ion, so the weakest)."}]},{"id":"25n1a-9","t":"Nov 2025 TZ1 Paper 1A · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u4-5.webp","W":973,"H":172,"p":[{"id":"25n1a-9","l":"","m":1,"y":0,"h":172,"a":"**C**\nMalleability means the metal can be hammered into shape. In metallic bonding the bonds are non directional, so **layers of ions can slide** over each other while the delocalized electrons keep holding them together."}]},{"id":"25n3a-9","t":"Nov 2025 TZ3 Paper 1A · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-5.webp","W":973,"H":352,"p":[{"id":"25n3a-9","l":"","m":1,"y":0,"h":160,"a":"**B**\nAl forms Al^{3+}, giving 3 delocalized electrons per atom, and it is a small ion. Ga also forms 3+ but its ion is larger, so the attraction is weaker. Mg (2+) and K (1+, large) are weaker still."}]},{"id":"25n3a-10","t":"Nov 2025 TZ3 Paper 1A · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u4-5.webp","W":973,"H":352,"p":[{"id":"25n3a-10","l":"","m":1,"y":172,"h":180,"a":"**D**\nGood conduction of heat and electricity as a **solid and a liquid**, insolubility in water and a high melting point describe a **metal** (delocalized electrons).\nIonic compounds conduct only when molten or dissolved, and are often soluble."}]},{"id":"23m2p2-4-4.5","t":"May 2023 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/23m2p2-4.webp","W":973,"H":405,"p":[{"id":"23m2p2-4.b","l":"(b)","m":1,"y":87,"h":20,"a":"Metallic bonding is **non directional**: the **layers of Al^{3+} ions can slide** over each other while the delocalized electrons keep attracting them, so the metal changes shape without breaking."}],"c":{"y":0,"h":43},"split":true},{"id":"25m1p2-1-4.5","t":"May 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m1p2-1.webp","W":973,"H":728,"p":[{"id":"25m1p2-1.c.iii","l":"(c)(iii)","m":1,"y":708,"h":20,"a":"Any one contrast, e.g. iron **conducts electricity** as a solid (delocalized electrons) but iron(II) sulfide does not; or iron is **malleable/ductile** whereas iron(II) sulfide is **brittle**.","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(c)":{"y":83,"h":44}},"split":true}]}]},{"k":"5","n":"Energetics and thermochemistry","units":[{"k":"5.1","n":"Measuring energy changes","q":[{"id":"22m1-13","t":"May 2022 TZ1 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u5-1.webp","W":973,"H":1045,"p":[{"id":"22m1-13","l":"","m":1,"y":0,"h":429,"a":"**B**\nq = mcΔT = 150 × 4.18 × 10.5 J (ΔT in K is the same as in °C, so no 273)\nn(ethanol) = 0.250 / 46.08 mol\nΔH = q / n in J mol^{−1}; dividing by 1000 gives kJ mol^{−1.}\nSo the answer is (150 × 4.18 × 10.5) / ((0.250 / 46.08) × 1000), option **B** (as a negative value since combustion is exothermic)."}]},{"id":"22m1-15","t":"May 2022 TZ1 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u5-1.webp","W":973,"H":1045,"p":[{"id":"22m1-15","l":"","m":1,"y":441,"h":604,"a":"**C**\nProducts are higher in enthalpy than reactants, so ΔH is positive: **endothermic**.\nHigher enthalpy means **less stable** products."}]},{"id":"22m2-15","t":"May 2022 TZ2 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u5-1.webp","W":973,"H":466,"p":[{"id":"22m2-15","l":"","m":1,"y":0,"h":466,"a":"**A**\nn(Mg) = 0.05 / 24.31 = 0.002 mol. Both solutions contain 0.10 mol HCl, so the acid is in excess in both and Mg is limiting.\nThe same amount of Mg reacts, so the same heat is released. Solution X has half the volume (mass) of water, so ΔT = q / mc is larger: **X reaches a higher temperature**."}]},{"id":"22n-15","t":"Nov 2022 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u5-1.webp","W":973,"H":168,"p":[{"id":"22n-15","l":"","m":1,"y":0,"h":168,"a":"**C**\nHeat is energy **transferred** from a hotter to a colder body because of a temperature difference. Temperature is related to the average kinetic energy of the particles."}]},{"id":"23m1-14","t":"May 2023 TZ1 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u5-1.webp","W":973,"H":1541,"p":[{"id":"23m1-14","l":"","m":1,"y":0,"h":490,"a":"**D**\nq = mcΔT = 75 × 4.2 × 24 J\nΔH = −q / n = −(75 × 4.2 × 24) / 0.015 J mol^{−1}\nDividing by 1000 converts to kJ mol^{−1}, so **D**."}]},{"id":"23m1-15","t":"May 2023 TZ1 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u5-1.webp","W":973,"H":1541,"p":[{"id":"23m1-15","l":"","m":1,"y":502,"h":1039,"a":"**B**\nThe solution gets colder, so heat is absorbed from the surroundings: **endothermic**, ΔH positive.\nThe products X(aq) must be **higher** in enthalpy than X(s), with the arrow pointing up."}]},{"id":"23m2-13","t":"May 2023 TZ2 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u5-1.webp","W":973,"H":236,"p":[{"id":"23m2-13","l":"","m":1,"y":0,"h":236,"a":"**D**\nΔHf is per mole of NH_{3} formed. The equation makes 2 mol NH_{3}:\nenergy released = 2 × 46 = **92 kJ**"}]},{"id":"23n-14","t":"Nov 2023 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u5-1.webp","W":973,"H":653,"p":[{"id":"23n-14","l":"","m":1,"y":0,"h":276,"a":"**D**\nI: combustion of carbon is exothermic.\nII: an ion gaining an electron to become an atom is the reverse of ionization (which needs energy), so it releases energy.\nIII: condensation (gas to liquid) forms intermolecular forces, releasing heat."}]},{"id":"23n-16","t":"Nov 2023 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u5-1.webp","W":973,"H":653,"p":[{"id":"23n-16","l":"","m":1,"y":288,"h":365,"a":"**A**\nI is the rise from reactants to the top of the curve (activation energy), II is the fall from the top to the products.\nΔH = H(products) − H(reactants) = **I − II** (a positive value, as the products are higher; III shows the same difference)."}]},{"id":"24m1-13","t":"May 2024 TZ1 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u5-1.webp","W":973,"H":257,"p":[{"id":"24m1-13","l":"","m":1,"y":0,"h":257,"a":"**A**\nHeat lost by the copper: q = m c ΔT using copper's own mass and specific heat capacity.\nq = 2.00 × 0.385 × (65.0 − 15.0). A temperature change in °C is the same size in K, so no 273 is added."}]},{"id":"24m2-13","t":"May 2024 TZ2 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u5-1.webp","W":973,"H":655,"p":[{"id":"24m2-13","l":"","m":1,"y":0,"h":655,"a":"**A**\nThe main error in this experiment is heat loss to the surroundings. A **lid** on the can reduces heat lost from the water, so the measured ΔT is closer to the true value.\nMoving the can further away or starting with warm water increases heat loss."}]},{"id":"24n-16","t":"Nov 2024 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u5-1.webp","W":973,"H":348,"p":[{"id":"24n-16","l":"","m":1,"y":0,"h":348,"a":"**D**\nThe temperature falls, so the process is **endothermic** and ΔH is positive.\nq = mcΔT = 50.0 × 4.18 × 28 J (ΔT is the same in K and °C, so no 273)\nn(NH_{4}Cl) = 107 / 53.5 = 2 mol\nΔH = q / (n × 1000) = +(50.0 × 4.18 × 28) / (2 × 1000) kJ mol^{−1}"}]},{"id":"25m1a-18","t":"May 2025 TZ1 Paper 1A · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u5-1.webp","W":973,"H":592,"p":[{"id":"25m1a-18","l":"","m":1,"y":0,"h":320,"a":"**D**\nThe temperature of the mixture falls, so the reaction is endothermic: the chemical system **takes in energy** (its energy increases).\nHeat then flows from the surroundings into the mixture to restore thermal equilibrium, so the **surroundings lose energy**."}]},{"id":"25m1a-19","t":"May 2025 TZ1 Paper 1A · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u5-1.webp","W":973,"H":592,"p":[{"id":"25m1a-19","l":"","m":1,"y":332,"h":260,"a":"**C**\nNaHCO_{3} is limiting: 0.050 mol NaHCO_{3} reacts with 0.050 / 3 = 0.0167 mol citric acid (0.10 mol present).\nq = mcΔT = 50 × 4.18 × 1 = 209 J\nPer mole of reaction as written (3 mol NaHCO_{3}): n = 0.0167 mol\nΔH = 209 / 0.0167 = 12 500 J mol^{−1} = 12.5 kJ mol^{−1}\nThe temperature fell, so it is endothermic: **+12.5 kJ mol^{−1}**"}]},{"id":"25m2a-15","t":"May 2025 TZ2 Paper 1A · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u5-1.webp","W":973,"H":1310,"p":[{"id":"25m2a-15","l":"","m":1,"y":0,"h":521,"a":"**A**\nThe products are higher in energy than the reactants, so the reaction is **endothermic**: the reactants are lower in energy and therefore **more stable**.\nAn endothermic reaction absorbs heat from the surroundings, so the **temperature of the surroundings decreases**."}]},{"id":"25m2a-16","t":"May 2025 TZ2 Paper 1A · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u5-1.webp","W":973,"H":1310,"p":[{"id":"25m2a-16","l":"","m":1,"y":533,"h":777,"a":"**B**\nq = mcΔT = 200 × 4.18 × (25.0 − 21.0) = 3344 J = 3.344 kJ\nΔH = −q / n = −3.344 / 0.110 = **−30.4 kJ mol^{−1}** (negative because combustion releases heat)"}]},{"id":"25m3a-16","t":"May 2025 TZ3 Paper 1A · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u5-1.webp","W":973,"H":438,"p":[{"id":"25m3a-16","l":"","m":1,"y":0,"h":168,"a":"**D**\nAn exothermic reaction releases heat to the surroundings, so the **temperature increases**. Energy is lost from the system, so the **products have lower enthalpy** than the reactants (ΔH negative)."}]},{"id":"25m3a-17","t":"May 2025 TZ3 Paper 1A · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u5-1.webp","W":973,"H":438,"p":[{"id":"25m3a-17","l":"","m":1,"y":180,"h":258,"a":"**A**\nq = mcΔT = 200 × 4.18 × 5.00 = 4180 J = 4.18 kJ\nn(methanol) = 0.321 / 32.05 = 0.01002 mol\nΔHc = −4.18 / 0.01002 = **−417 kJ mol^{−1}**"}]},{"id":"25n1a-16","t":"Nov 2025 TZ1 Paper 1A · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u5-1.webp","W":973,"H":457,"p":[{"id":"25n1a-16","l":"","m":1,"y":0,"h":457,"a":"**A**\nThe products are higher than the reactants, so the reaction is **endothermic**.\nN_{2} + O_{2} → 2NO is endothermic (it only happens at very high temperature, e.g. in engines).\nB (bond forming), C (neutralization) and D (combustion) are all exothermic."}]},{"id":"25n1b-2-5.1","t":"Nov 2025 TZ1 Paper 1B · Q2","s":"Data based questions (Paper 1B)","img":"q/25n1b-2.webp","W":973,"H":813,"p":[{"id":"25n1b-2.a","l":"(a)","m":2,"y":370,"h":44,"a":"ΔT(water) = 26.77 − 25.00 = 1.77 K\nq = mcΔT = 5.65 × 4.18 × 1.77 = **41.8 J**"},{"id":"25n1b-2.b","l":"(b)","m":2,"y":414,"h":116,"a":"ΔT(metal) = 100.00 − 26.77 = 73.23 K\nc = q / (mΔT) = 41.8 / (1.28 × 73.23) = **0.446 J g^{−1} K^{−1}**"},{"id":"25n1b-2.c","l":"(c)","m":1,"y":530,"h":263,"a":"0.446 J g^{−1} K^{−1} is closest to **iron** (0.449)."},{"id":"25n1b-2.d","l":"(d)","m":2,"y":793,"h":20,"a":"- **Heat lost** from the hot metal to the air while it is transferred from beaker A to beaker B.\n- Heat lost from beaker B to the surroundings (and absorbed by the beaker itself), so the measured temperature rise is too small.\n- Hot water from beaker A carried over on the metal into beaker B."}],"c":{"y":0,"h":370},"split":false},{"id":"25n3b-2-5.1","t":"Nov 2025 TZ3 Paper 1B · Q2","s":"Data based questions (Paper 1B)","img":"q/25n3b-2.webp","W":973,"H":1484,"p":[{"id":"25n3b-2.b.iv","l":"(b)(iv)","m":2,"y":1258,"h":43,"a":"Both methods: the temperature **rises** as HCl is added (neutralization is exothermic) up to a maximum around the equivalence point (about 20 to 25 cm³), then **falls**.\nStudent A mixes fresh solutions each time, so beyond the equivalence point the temperature drops quickly and returns to **22 °C** at 50 cm³ (no reaction happens with only one solution), giving a symmetrical shape.\nStudent B adds acid to the same warm mixture, so after the maximum the temperature only falls slowly (to 28 °C): the extra room temperature acid cools the mixture gradually and there is no reset to 22 °C.","g":"(b)"},{"id":"25n3b-2.b.vi","l":"(b)(vi)","m":1,"y":1464,"h":20,"a":"Use an **insulated container** (for example a polystyrene cup inside a beaker) with a **lid** instead of a glass conical flask.","g":"(b)"}],"c":{"y":0,"h":68},"ps":{"(b)":{"y":871,"h":218}},"split":true},{"id":"22m2p2-1-5.1","t":"May 2022 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m2p2-1.webp","W":973,"H":327,"p":[{"id":"22m2p2-1.d","l":"(d)","m":2,"y":307,"h":20,"a":"Any two:\n- the **temperature of the water rises** (measured with a thermometer, or the container feels warm);\n- steam / water vapour is given off, or the lithium may **melt** or glow;\n- the rate of fizzing increases as the mixture heats up."}],"c":{"y":0,"h":16},"split":true},{"id":"22m2p2-4-5.1","t":"May 2022 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22m2p2-4.webp","W":973,"H":1461,"p":[{"id":"22m2p2-4.e.ii","l":"(e)(ii)","m":2,"y":921,"h":540,"a":"- Reactants (CH_{4} + Cl_{2}) drawn as a line **higher** on the enthalpy axis.\n- Products (CH_{3}Cl + HCl) drawn **lower**.\n- A downward arrow between them labelled **ΔH = −99 kJ mol^{−1}** (exothermic).","g":"(e)"}],"c":{"y":0,"h":20},"ps":{"(e)":{"y":819,"h":59}},"split":true},{"id":"22np2-1-5.1","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.e.i","l":"(e)(i)","m":1,"y":468,"h":128,"a":"ΔT = 25.2 − 0.8 = 24.4 K\nq = mcΔT = 25.32 × 4.18 × 24.4 = **2.58 × 10^{3} J**","g":"(e)"},{"id":"22np2-1.e.ii","l":"(e)(ii)","m":2,"y":596,"h":132,"a":"n(NH_{4}NO_{3}) = q / ΔH = 2.58 kJ / 25.69 kJ mol^{−1} = 0.100 mol\nm = 0.100 × 80.06 = **8.05 g**","g":"(e)"}],"c":{"y":0,"h":21},"ps":{"(e)":{"y":448,"h":20}},"split":true},{"id":"23m1p2-6-5.1","t":"May 2023 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m1p2-6.webp","W":973,"H":1377,"p":[{"id":"23m1p2-6.b.i","l":"(b)(i)","m":2,"y":860,"h":185,"a":"q = mcΔT = 50.00 × 4.18 × (35.0 − 20.0) = 3135 J = 3.14 kJ\nΔHc = −q / n = −3.14 / 0.1 = **−31.4 kJ mol^{−1}**","g":"(b)"},{"id":"23m1p2-6.b.ii","l":"(b)(ii)","m":2,"y":1045,"h":181,"a":"Source: **heat lost to the surroundings** (much of the heat from the burning sulfur does not reach the water; the apparatus is open).\nImprovement: **insulate** the calorimeter and enclose the flame / use a lid (ideally a sealed bomb calorimeter in oxygen).","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":419,"h":441}},"split":true},{"id":"23m2p2-4-5.1","t":"May 2023 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/23m2p2-4.webp","W":973,"H":405,"p":[{"id":"23m2p2-4.c","l":"(c)","m":1,"y":107,"h":106,"a":"q = mcΔT = 11.98 × 0.902 × (40.0 − 18.0) = **238 J**"}],"c":{"y":0,"h":43},"split":true},{"id":"24m1p2-2-5.1","t":"May 2024 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24m1p2-2.webp","W":973,"H":1323,"p":[{"id":"24m1p2-2.a.i","l":"(a)(i)","m":1,"y":697,"h":43,"a":"q = mcΔT = 400.00 × 4.18 × (40.0 − 19.0) = **3.51 × 10^{4} J** (35 100 J)"},{"id":"24m1p2-2.b.i","l":"(b)(i)","m":3,"y":780,"h":269,"a":"Mass of gel burned = 20.00 − 18.20 = 1.80 g\nAssume the gel is **pure propan-1-ol** (M = 60.11): n = 1.80 / 60.11 = 0.0299 mol\nΔHc = −q / n = −35.1 kJ / 0.0299 mol = **−1170 kJ mol^{−1}**\nAssumption (any one): the gel is pure propan-1-ol; **all the heat released goes into the water** (none lost, none absorbed by the copper can); complete combustion."},{"id":"24m1p2-2.b.iii","l":"(b)(iii)","m":1,"y":1069,"h":20,"a":"Main source: **heat loss to the surroundings** (and/or incomplete combustion).\nReduce it by **insulating** the calorimeter, using a lid and a draught shield, and placing the flame closer to the can."}],"c":{"y":0,"h":697},"split":true},{"id":"24m1p2-4-5.1","t":"May 2024 TZ1 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m1p2-4.webp","W":973,"H":877,"p":[{"id":"24m1p2-4.b.v","l":"(b)(v)","m":1,"y":521,"h":356,"a":"CO + ½O_{2} is **higher** in enthalpy than CO_{2}, so **CO is less stable** than CO_{2} (its oxidation to CO_{2} is exothermic)."}],"c":{"y":0,"h":61},"split":true},{"id":"24m2p2-4-5.1","t":"May 2024 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m2p2-4.webp","W":973,"H":2256,"p":[{"id":"24m2p2-4.c.ii","l":"(c)(ii)","m":2,"y":297,"h":679,"a":"- Products (CH_{2}CO + CH_{4}) drawn **higher** than the reactant (propanone): endothermic.\n- A curve rising to a peak: label the rise from reactants to the peak **Ea**.\n- Label the difference between reactant and product levels **ΔH** (positive, arrow pointing up).","g":"(c)"}],"c":{"y":0,"h":131},"ps":{"(c)":{"y":194,"h":59}},"split":true},{"id":"24np2-3-5.1","t":"Nov 2024 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24np2-3.webp","W":973,"H":1634,"p":[{"id":"24np2-3.d.i","l":"(d)(i)","m":3,"y":709,"h":584,"a":"- Label the axes: **potential energy** (y) and **progress of reaction / reaction coordinate** (x).\n- Reactants (2SO_{2} + O_{2}) **higher** than products (2SO_{3}), because ΔH < 0.\n- A hump between them; label **Ea** as the rise from the reactant level to the top of the hump.","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":645,"h":64}},"split":true},{"id":"25m1p2-2-5.1","t":"May 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m1p2-2.webp","W":973,"H":708,"p":[{"id":"25m1p2-2.b.iv","l":"(b)(iv)","m":3,"y":332,"h":376,"a":"- Reactants (Co^{2+} + 4Cl^{−}) drawn **lower** than products (CoCl_{4}^{2−}), because the forward reaction is endothermic.\n- A hump between them; **Ea** labelled from the reactant level up to the top of the hump.\n- **ΔH** labelled as the (positive) vertical difference from reactants up to products.","g":"(b)"}],"c":{"y":0,"h":19},"ps":{"(b)":{"y":42,"h":121}},"split":true},{"id":"25m2p2-3-5.1","t":"May 2025 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m2p2-3.webp","W":973,"H":1520,"p":[{"id":"25m2p2-3.a.iv","l":"(a)(iv)","m":2,"y":185,"h":592,"a":"- **Reactants** (CO + Cl_{2}) drawn **higher** than **Products** (COCl_{2}): exothermic.\n- A hump between them, and a downward **ΔH** arrow from the reactant level to the product level.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":44}},"split":true},{"id":"25m3p2-8-5.1","t":"May 2025 TZ3 Paper 2 · Q8","s":"Structured questions (Paper 2)","img":"q/25m3p2-8.webp","W":973,"H":149,"p":[{"id":"25m3p2-8.b","l":"(b)","m":2,"y":84,"h":65,"a":"n(ethanol) = 4.00 / 46.08 = 0.0868 mol\nHeat released = 0.0868 × 1367 = 119 kJ = 1.19 × 10^{5} J (ΔHc ethanol = −1367 kJ mol^{−1})\nΔT = q / mc = 1.19 × 10^{5} / (500.0 × 4.18) = **56.8 K** (°C)"}],"c":{"y":0,"h":44},"split":true}]},{"k":"5.2","n":"Hess’s law","q":[{"id":"22m1-14","t":"May 2022 TZ1 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u5-2.webp","W":973,"H":379,"p":[{"id":"22m1-14","l":"","m":1,"y":0,"h":379,"a":"**C**\nΔH = ΣΔHf(products) − ΣΔHf(reactants)\n= −156.0 − (0.1 + (−36.3))\n= −156.0 + 36.2 = **−119.8 kJ**"}]},{"id":"22m2-14","t":"May 2022 TZ2 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u5-2.webp","W":973,"H":330,"p":[{"id":"22m2-14","l":"","m":1,"y":0,"h":330,"a":"**D**\nTarget: CS_{2}(l) + 3O_{2}(g) → CO_{2}(g) + 2SO_{2}(g)\nUse ΔH_{1} once (makes CO_{2}), ΔH_{2} twice (makes 2SO_{2}) and ΔH_{3} reversed (breaks CS_{2} into C and 2S).\n**ΔH = ΔH_{1} + 2ΔH_{2} − ΔH_{3}**"}]},{"id":"22n-14","t":"Nov 2022 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u5-2.webp","W":973,"H":326,"p":[{"id":"22n-14","l":"","m":1,"y":0,"h":326,"a":"**D**\nTarget: C(s) + 2H_{2}(g) → CH_{4}(g)\nUse the combustion of C once, the combustion of H_{2} twice, and reverse the combustion of CH_{4}:\nΔHf = −394 + 2(−286) − (−891) = **(−394 − (2 × 286) + 891) kJ mol^{−1}** = −75 kJ mol^{−1}"}]},{"id":"23m2-14","t":"May 2023 TZ2 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u5-2.webp","W":973,"H":339,"p":[{"id":"23m2-14","l":"","m":1,"y":0,"h":339,"a":"**A**\nAdd the first two equations and reverse the third:\nN_{2}H_{4} + CH_{3}OH → CH_{2}O + N_{2} + 3H_{2}   −37\nN_{2} + 3H_{2} → 2NH_{3}   −46\nCH_{2}O + H_{2} → CH_{3}OH   +65\nSum: N_{2}H_{4} + H_{2} → 2NH_{3}, ΔH = −37 − 46 + 65 = **−18 kJ**"}]},{"id":"23n-15","t":"Nov 2023 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u5-2.webp","W":973,"H":333,"p":[{"id":"23n-15","l":"","m":1,"y":0,"h":333,"a":"**C**\nTarget: 1.5 O_{2} → O_{3}\nReverse (ii): 3CO_{2} → 3CO + O_{3}, ΔH = +992\nReverse (i) and multiply by 1.5: 3CO + 1.5O_{2} → 3CO_{2}, ΔH = 1.5 × (−566)\nSum: ΔH = **1.5 × (−566) + 992** = +143 kJ"}]},{"id":"24m1-14","t":"May 2024 TZ1 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u5-2.webp","W":973,"H":323,"p":[{"id":"24m1-14","l":"","m":1,"y":0,"h":323,"a":"**B**\nTarget: C_{3}H_{4} + H_{2} → C_{3}H_{6}\nUse the first equation, then reverse the second (C_{3}H_{8} → C_{3}H_{6} + H_{2}):\nΔH = (−290) − (−125) = **−165 kJ mol^{−1}**"}]},{"id":"24m2-14","t":"May 2024 TZ2 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u5-2.webp","W":973,"H":406,"p":[{"id":"24m2-14","l":"","m":1,"y":0,"h":406,"a":"**D**\nTarget is the formation of ethanol from its elements.\n2 × (C combustion) + 3 × (H_{2} combustion) − (ethanol combustion):\nΔH = (−394 × 2) − (286 × 3) + 1367 = **−279 kJ**"}]},{"id":"24n-13","t":"Nov 2024 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u5-2.webp","W":973,"H":587,"p":[{"id":"24n-13","l":"","m":1,"y":0,"h":203,"a":"**B**\nThe standard enthalpy of formation is for forming **1 mol** of a compound **from its elements in their standard states**.\nB: Al(s), H_{2}(g) and O_{2}(g) are the elements in their standard states, forming 1 mol Al(OH)_{3}.\nA and C start from compounds; D uses H, N and O_{3}, which are not the standard states."}]},{"id":"24n-14","t":"Nov 2024 Paper 1 · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u5-2.webp","W":973,"H":587,"p":[{"id":"24n-14","l":"","m":1,"y":215,"h":372,"a":"**D**\nTarget: C_{2}H_{4} + 6F_{2} → 2CF_{4} + 4HF\n2 × equation 1: 2H_{2} + 2F_{2} → 4HF, −2x\n2 × equation 2: 2C + 4F_{2} → 2CF_{4}, −2y\nReverse equation 3: C_{2}H_{4} → 2C + 2H_{2}, −z\nSum: ΔH = **−2x − 2y − z**"}]},{"id":"25n1a-17","t":"Nov 2025 TZ1 Paper 1A · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u5-2.webp","W":973,"H":302,"p":[{"id":"25n1a-17","l":"","m":1,"y":0,"h":302,"a":"**B**\nGoing directly: 2C + 2H_{2} → C_{2}H_{4}, +52 kJ\nIndirect route: ΔH, then −176 kJ\nHess's law: +52 = ΔH + (−176), so ΔH = **+52 + 176** = +228 kJ"}]},{"id":"25n3a-16","t":"Nov 2025 TZ3 Paper 1A · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u5-2.webp","W":973,"H":397,"p"
