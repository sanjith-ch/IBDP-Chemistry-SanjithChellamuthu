<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IBDP Chemistry By Sanjith Chellamuthu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Same layout as the physics site: question cards with a pinned tracker rail; purple palette. */
:root{
  --bg:#f4f1f9; --surface:#ffffff; --sunken:#ebe5f4; --line:#d9cfe8;
  --ink:#1e1433; --muted:#62577a; --accent:#6a2fd0; --accent-ink:#ffffff; --accent-soft:#ece2fc;
  --done:#0c7d57; --done-soft:#d9f1e7; --flag:#a85d00; --flag-soft:#fbe9cf;
  --img-filter:none; --img-blend:multiply;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#120c1d; --surface:#1d1530; --sunken:#170f26; --line:#33294b;
  --ink:#ece6f8; --muted:#a69bc0; --accent:#b996ff; --accent-ink:#190e2c; --accent-soft:#2c1f4e;
  --done:#4fd3a2; --done-soft:#123a2f; --flag:#f2b35c; --flag-soft:#3d2c12;
  --img-filter:invert(1) hue-rotate(180deg); --img-blend:screen; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#120c1d; --surface:#1d1530; --sunken:#170f26; --line:#33294b;
  --ink:#ece6f8; --muted:#a69bc0; --accent:#b996ff; --accent-ink:#190e2c; --accent-soft:#2c1f4e;
  --done:#4fd3a2; --done-soft:#123a2f; --flag:#f2b35c; --flag-soft:#3d2c12;
  --img-filter:invert(1) hue-rotate(180deg); --img-blend:screen; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
main{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 26px;max-width:60ch}
/* tracker rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.clock div{background:var(--sunken);border-radius:6px;padding:8px 2px;text-align:center}
.clock b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.clock span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.when{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.big{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .25s}
.rows{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px}
.row .bar{margin:0;height:6px}
.row .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile{font-family:var(--display);font-weight:700;width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.revbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--flag-soft);color:var(--flag);border:1px solid transparent;border-radius:8px;padding:10px 12px;font-weight:600}
.revbtn b{font-family:var(--mono)}
.sync{font-size:12px;color:var(--muted);margin:0;padding-inline:4px}
/* home */
.theme{margin-bottom:30px}
.theme h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.theme h2 .tile{width:30px;height:30px;font-size:16px;border-radius:7px}
.theme h2 .sub{color:var(--muted);font-family:var(--body);font-weight:400;font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.unit{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.unit:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.unit:disabled{cursor:default;background:transparent;border-style:dashed;color:var(--muted)}
.unit .code{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.unit:disabled .code{color:var(--muted)}
.unit .name{font-weight:600;font-size:15.5px;line-height:1.25;min-height:2.5em}
.unit .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.unit .bar{height:5px;margin-top:6px}
/* unit view */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.back{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600}
.top .ttl{font-family:var(--display);font-weight:700;font-size:19px;min-width:0;flex:1 1 200px;line-height:1.2}
.top .ttl small{font-family:var(--mono);color:var(--accent);font-size:14px;margin-right:6px}
.top .cnt{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{font-family:var(--display);font-size:17px;font-weight:700;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.q>header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.q>header h3{margin:0;font-size:14.5px;font-weight:600}
.q>header span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.part{padding:14px 16px;border-top:1px solid var(--line)}
.part:first-of-type{border-top:0}
.part.is-done{background:linear-gradient(90deg,var(--done-soft) 0 5px,transparent 5px)}
.part.is-flag{background:linear-gradient(90deg,var(--flag-soft) 0 5px,transparent 5px)}
.part.is-done.is-flag{background:linear-gradient(90deg,var(--done-soft) 0 5px,var(--flag-soft) 5px 10px,transparent 10px)}
.scroll{overflow-x:auto}
.crop{position:relative;overflow:hidden}
.crop img{position:absolute;left:0;max-width:none;filter:var(--img-filter);mix-blend-mode:var(--img-blend)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ctl .lab{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-right:auto}
.b{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.b .box{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.b.done[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.b.flag[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.b.show{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.show[aria-expanded="true"]{background:transparent;color:var(--accent)}
.ans{margin-top:12px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;max-width:74ch}
.ans .eyebrow{color:var(--accent);margin-bottom:6px}
.ans p{margin:0 0 7px}.ans p:last-child,.ans ul:last-child{margin-bottom:0}
.ans ul{margin:0 0 7px;padding-left:20px}.ans li{margin-bottom:4px}
.ans .letter{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:6px}
.ans .letter span{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.qfull{padding:12px 16px 14px;border-top:1px dashed var(--line);background:var(--sunken)}
.b.whole{width:100%;justify-content:center;font-weight:600}
.b.whole[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wholeq{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.wholeq .eyebrow{margin-bottom:8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
/* top tabs */
.tabs{display:flex;gap:4px;background:var(--sunken);border-radius:10px;padding:4px;margin-bottom:18px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:7px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wide{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;margin:0 0 24px}
/* notes */
.notes{display:flex;flex-direction:column;gap:14px;max-width:78ch}
.nsec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.nsec h3{font-family:var(--display);font-size:17px;margin:0 0 8px}
.nsec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tip{margin-top:10px;background:var(--flag-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.tip b{color:var(--flag);margin-right:4px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pn button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13.5px}
/* formulas */
.ftab{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.frow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.6fr);gap:6px 18px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.frow:first-child{border-top:0}
.frow .fd{font-size:14px;font-weight:600;min-width:0}
.frow .fd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.frow .fx{font-family:var(--math);font-size:20px;line-height:1.6;min-width:0;overflow-x:auto;white-space:nowrap}
.frow.cont{padding-top:2px;border-top:0}
.tag{display:inline-block;font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin:4px 6px 0 0;vertical-align:middle}
.tag.hl{background:var(--accent-soft);color:var(--accent)}
.tag.x{background:var(--flag-soft);color:var(--flag)}
.tag.bk{background:var(--done-soft);color:var(--done)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 2px;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.rt{white-space:nowrap}.rad{display:inline-block;border-top:1px solid currentColor;padding:3px 2px 0;margin-left:1px;line-height:1.25;vertical-align:middle}
.gap{display:inline-block;width:1.4em}
.rs{font-size:1.3em;vertical-align:middle;line-height:1}
.tags{display:block;margin-top:2px}
.wides{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}.wides .wide{margin:0}
.wide.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.sitab{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-bottom:22px}
.si{width:100%;border-collapse:collapse;font-size:14px}
.si th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunken);padding:10px 14px;white-space:nowrap}
.si td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.si td.qn{font-weight:600;min-width:120px}.si td.qn small{display:block;font-family:var(--mono);font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.si td.un{color:var(--done);font-weight:600}
.si td.sy{color:var(--flag);font-family:var(--math);font-size:19px;font-weight:600;white-space:nowrap}
.si td.bu{color:var(--accent);font-family:var(--math);font-size:18px;white-space:nowrap}
.si td.sy .mu{display:none;font-family:var(--body);font-size:12px;font-weight:600;color:var(--done);white-space:normal;margin-top:2px}
@media (max-width:620px){.si th:nth-child(2),.si td.un{display:none}.si td.sy .mu{display:block}.si th,.si td{padding:9px 10px}.si td.bu{font-size:16px}}
.sinote{color:var(--muted);font-size:13.5px;margin:-8px 0 22px}
.fsec{font-family:var(--display);font-size:18px;font-weight:700;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
.fsec small{font-family:var(--mono);color:var(--accent);font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 18px}
@media (max-width:620px){.frow{grid-template-columns:minmax(0,1fr)}.frow .fx{font-size:19px}}
.from{font-size:13px;color:var(--muted);margin:22px 0 8px;font-weight:600}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:12px 48px}
  aside{position:static;order:-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  aside .panel{padding:12px}
  .rows,.sync{display:none}
  .revbtn{grid-column:1/-1}
  .clock b{font-size:18px}.big{font-size:24px}
  .in-unit aside .panel{display:none}
}
@media (max-width:520px){ aside{grid-template-columns:1fr} .part{padding:12px} .q>header{padding:9px 12px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ctx{padding:14px 16px 4px;border-bottom:1px dashed var(--line)}
.foot{color:var(--muted);font-size:13.5px;max-width:70ch;margin:8px 0 0}
.fempty{text-align:left;padding:14px 0}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <main id="main"></main>
  <aside aria-label="Tracker">
    <div class="panel">
      <p class="eyebrow">Time to the chemistry exam</p>
      <div class="clock" id="clock"></div>
      <p class="when">Thursday 29 October 2026, 7:00 am IST</p>
    </div>
    <div class="panel">
      <p class="eyebrow">Question parts completed</p>
      <div class="big"><span id="tDone">0</span> <small>/ <span id="tAll"></span></small></div>
      <div class="bar"><i id="tBar" style="width:0"></i></div>
      <div class="rows" id="tRows"></div>
    </div>
    <button class="revbtn" id="revBtn" type="button"><span>Marked for review</span><b id="tRev">0</b></button>
    <p class="sync" id="sync">Progress is saved in this browser.</p>
  </aside>
</div>
<script>
const DATA={"themes":[{"k":"1","n":"Stoichiometric relationships","units":[{"k":"1.1","n":"Particulate nature of matter and chemical change","q":[{"id":"22m2-4","t":"May 2022 TZ2 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u1-1.webp","W":973,"H":172,"p":[{"id":"22m2-4","l":"","m":1,"y":0,"h":172,"a":"**B**\nDeposition is the change of state directly from **gas to solid**, the reverse of sublimation."}]},{"id":"22n-2","t":"Nov 2022 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u1-1.webp","W":973,"H":163,"p":[{"id":"22n-2","l":"","m":1,"y":0,"h":163,"a":"**B**\nGas to solid directly is **deposition**. Condensation is gas to liquid, freezing is liquid to solid, sublimation is solid to gas."}]},{"id":"23m2-1","t":"May 2023 TZ2 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u1-1.webp","W":973,"H":173,"p":[{"id":"23m2-1","l":"","m":1,"y":0,"h":173,"a":"**A**\nThe electrolyte must be molten, so NaCl(l). The cell runs above 801 °C, well above the melting point of sodium (98 °C), so sodium forms as a **liquid**. Chlorine is a gas.\n2NaCl(l) → 2Na(l) + Cl_{2}(g)"}]},{"id":"23n-4","t":"Nov 2023 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u1-1.webp","W":973,"H":233,"p":[{"id":"23n-4","l":"","m":1,"y":0,"h":233,"a":"**B**\n4NH_{3}(g) + 5O_{2}(g) → 4NO(g) + 6H_{2}O(l)\nCheck: N 4 = 4, H 12 = 12, O 10 = 4 + 6. Ratio NH_{3} : O_{2} = **4 : 5**"}]},{"id":"24m1-1","t":"May 2024 TZ1 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u1-1.webp","W":973,"H":498,"p":[{"id":"24m1-1","l":"","m":1,"y":0,"h":272,"a":"**B**\nA compound contains atoms of **more than one element**, chemically bonded in a **fixed ratio** (I and III).\nThe compound has new properties: its atoms do not keep the properties of the separate elements (that describes a mixture)."}]},{"id":"24m1-3","t":"May 2024 TZ1 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u1-1.webp","W":973,"H":498,"p":[{"id":"24m1-3","l":"","m":1,"y":284,"h":214,"a":"**D**\n2Al(OH)_{3} + 3H_{2}SO_{4} → 6H_{2}O + Al_{2}(SO_{4})_{3}\nCheck: Al 2 = 2, S 3 = 3, H 6 + 6 = 12, O 6 + 12 = 6 + 12.\nSum = 2 + 3 + 6 + 1 = **12**"}]},{"id":"24n-2","t":"Nov 2024 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u1-1.webp","W":973,"H":217,"p":[{"id":"24n-2","l":"","m":1,"y":0,"h":217,"a":"**D**\n4FeS + 7O_{2} → 2Fe_{2}O_{3} + 4SO_{2}\nCheck: Fe 4 = 4, S 4 = 4, O 14 = 6 + 8.\nSum = 4 + 7 + 2 + 4 = **17**"}]},{"id":"25m2a-1","t":"May 2025 TZ2 Paper 1A · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u1-1.webp","W":973,"H":489,"p":[{"id":"25m2a-1","l":"","m":1,"y":0,"h":262,"a":"**A**\nLiquid hydrocarbons dissolve in each other, so the mixture is uniform throughout: **homogeneous**.\nThey have different boiling points, so they are separated by (fractional) **distillation**. Filtration only separates an insoluble solid from a liquid."}]},{"id":"25m2a-17","t":"May 2025 TZ2 Paper 1A · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u1-1.webp","W":973,"H":489,"p":[{"id":"25m2a-17","l":"","m":1,"y":274,"h":215,"a":"**C**\nC_{2}H_{5}OH + **3**O_{2} → 2CO_{2} + 3H_{2}O\nCheck: C 2 = 2, H 6 = 6, O: 1 + 6 = 4 + 3 = 7."}]},{"id":"25n1a-1","t":"Nov 2025 TZ1 Paper 1A · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u1-1.webp","W":973,"H":373,"p":[{"id":"25n1a-1","l":"","m":1,"y":0,"h":373,"a":"**D**\nAll three are correct.\nI: a solid whose solubility changes with temperature can be recovered by cooling the hot solution (crystallization).\nII: an undissolved solid is removed by filtration.\nIII: miscible liquids with different boiling points are separated by distillation."}]},{"id":"25n3a-1","t":"Nov 2025 TZ3 Paper 1A · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u1-1.webp","W":973,"H":431,"p":[{"id":"25n3a-1","l":"","m":1,"y":0,"h":201,"a":"**B**\nGas directly to solid is **deposition** (the reverse of sublimation)."}]},{"id":"25n3a-15","t":"Nov 2025 TZ3 Paper 1A · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u1-1.webp","W":973,"H":431,"p":[{"id":"25n3a-15","l":"","m":1,"y":213,"h":218,"a":"**C**\nC_{3}H_{7}OH + 4½O_{2} → 3CO_{2} + 4H_{2}O\nCheck O: 1 + 9 = 6 + 4 = 10.\nSum = 1 + 4.5 + 3 + 4 = **12.5** (1 mol of propan-1-ol, so a fraction is allowed)."}]},{"id":"25m1b-2-1.1","t":"May 2025 TZ1 Paper 1B · Q2","s":"Data based questions (Paper 1B)","img":"q/25m1b-2.webp","W":973,"H":741,"p":[{"id":"25m1b-2.a","l":"(a)","m":4,"y":130,"h":43,"a":"- Use a **magnet** to remove the iron filings.\n- Add **water** to the remaining mixture and stir: the NaCl dissolves, the sand does not.\n- **Filter**: the sand stays on the filter paper (wash it with a little water and dry it).\n- **Evaporate / crystallize** the filtrate (heat to remove the water) to recover dry NaCl."}],"c":{"y":0,"h":130},"split":true},{"id":"25m3b-1-1.1","t":"May 2025 TZ3 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25m3b-1.webp","W":973,"H":2712,"p":[{"id":"25m3b-1.a.ii","l":"(a)(ii)","m":1,"y":314,"h":139,"a":"**1**Cu + **4**HNO_{3} → **1**Cu(NO_{3})_{2} + **2**NO_{2} + **2**H_{2}O\nCheck: N 4 = 2 + 2; O 12 = 6 + 4 + 2; H 4 = 4."}],"c":{"y":0,"h":69},"split":true},{"id":"22m1p2-1-1.1","t":"May 2022 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m1p2-1.webp","W":973,"H":1876,"p":[{"id":"22m1p2-1.a.i","l":"(a)(i)","m":1,"y":20,"h":20,"a":"**2Mg(s) + O_{2}(g) → 2MgO(s)**"},{"id":"22m1p2-1.d.i","l":"(d)(i)","m":1,"y":579,"h":126,"a":"**1**Mg_{3}N_{2} + **6**H_{2}O → **3**Mg(OH)_{2} + **2**NH_{3}","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":535,"h":44}},"split":true},{"id":"22m2p2-1-1.1","t":"May 2022 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m2p2-1.webp","W":973,"H":327,"p":[{"id":"22m2p2-1.a","l":"(a)","m":1,"y":16,"h":115,"a":"**2**Li + **2**H_{2}O → **2**LiOH + **1**H_{2}"}],"c":{"y":0,"h":16},"split":true},{"id":"22np2-1-1.1","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.f.i","l":"(f)(i)","m":1,"y":982,"h":20,"a":"**NH_{4}NO_{3}(s) → N_{2}O(g) + 2H_{2}O(l)**","g":"(f)"}],"c":{"y":0,"h":21},"ps":{"(f)":{"y":962,"h":20}},"split":true},{"id":"23m1p2-5-1.1","t":"May 2023 TZ1 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/23m1p2-5.webp","W":973,"H":1094,"p":[{"id":"23m1p2-5.b.i","l":"(b)(i)","m":1,"y":983,"h":43,"a":"**Ba^{2+}(aq) + SO_{4}^{2−}(aq) → BaSO_{4}(s)**","g":"(b)"}],"c":{"y":0,"h":303},"ps":{"(b)":{"y":940,"h":43}},"split":true},{"id":"23m2p2-6-1.1","t":"May 2023 TZ2 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m2p2-6.webp","W":973,"H":1170,"p":[{"id":"23m2p2-6.d.i","l":"(d)(i)","m":1,"y":464,"h":20,"a":"**C_{2}H_{5}OH(l) + 3O_{2}(g) → 2CO_{2}(g) + 3H_{2}O(l)**"}],"c":{"y":0,"h":59},"split":true},{"id":"24np2-1-1.1","t":"Nov 2024 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24np2-1.webp","W":973,"H":1074,"p":[{"id":"24np2-1.a.ii","l":"(a)(ii)","m":2,"y":447,"h":43,"a":"The boiling point of propane is about **231 K**, between 200 and 250 K. On heating through this range the propane **boils (changes from liquid to gas)**, and a gas occupies a much larger volume than the same mass of liquid because its particles are far apart.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":407}},"split":true},{"id":"25m1p2-1-1.1","t":"May 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m1p2-1.webp","W":973,"H":728,"p":[{"id":"25m1p2-1.a","l":"(a)","m":2,"y":20,"h":20,"a":"An **element** contains only **one type of atom** (all with the same atomic number) and cannot be broken down chemically into simpler substances.\nA **compound** contains **two or more different elements chemically bonded** together in a **fixed ratio**; it can be broken down chemically and has different properties from its elements."}],"c":{"y":0,"h":20},"split":true},{"id":"25m1p2-3-1.1","t":"May 2025 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m1p2-3.webp","W":973,"H":687,"p":[{"id":"25m1p2-3.a","l":"(a)","m":2,"y":46,"h":20,"a":"**CaCO_{3}(s) + 2HCl(aq) → CaCl_{2}(aq) + H_{2}O(l) + CO_{2}(g)**"}],"c":{"y":0,"h":46},"split":true},{"id":"25m3p2-2-1.1","t":"May 2025 TZ3 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m3p2-2.webp","W":973,"H":197,"p":[{"id":"25m3p2-2","l":"","m":2,"y":0,"h":197,"a":"Any two, each with its explanation:\n- A liquid has a **fixed volume** / is almost incompressible: the particles are **close together** with little space between them.\n- A liquid **flows and takes the shape of its container**: the particles can **move past each other** (forces between them are weaker than in a solid).\n- Liquids **diffuse** (slowly): the particles are in constant random motion."}],"split":false}]},{"k":"1.2","n":"The mole concept","q":[{"id":"22m1-2","t":"May 2022 TZ1 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u1-2.webp","W":973,"H":672,"p":[{"id":"22m1-2","l":"","m":1,"y":0,"h":262,"a":"**A**\nA: n = cV = 0.1 × 0.0100 = **0.001 mol**\nB: 6.02 × 10^{24} / 6.02 × 10^{23} = 10 mol\nC: 0.365 / 36.46 = 0.01 mol\nD: 2.27 / 22.7 = 0.1 mol"}]},{"id":"22m1-3","t":"May 2022 TZ1 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u1-2.webp","W":973,"H":672,"p":[{"id":"22m1-3","l":"","m":1,"y":274,"h":194,"a":"**B**\nM(CHO_{2}) = 12.01 + 1.01 + 32.00 = 45.02\n90 / 45 = 2, so the molecular formula is 2 × CHO_{2} = **C_{2}H_{2}O_{4}**."}]},{"id":"22m1-4","t":"May 2022 TZ1 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u1-2.webp","W":973,"H":672,"p":[{"id":"22m1-4","l":"","m":1,"y":480,"h":192,"a":"**B**\nMass of N = 8.8 − 3.2 = 5.6 g\nn(N) = 5.6 / 14.01 = 0.40 mol, n(O) = 3.2 / 16.00 = 0.20 mol\nRatio N : O = 2 : 1, so **N_{2}O**."}]},{"id":"22m2-2","t":"May 2022 TZ2 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u1-2.webp","W":973,"H":232,"p":[{"id":"22m2-2","l":"","m":1,"y":0,"h":232,"a":"**D**\n44 g CO_{2} = 1 mol, so 1 mol C = 12 g\n18 g H_{2}O = 1 mol, so 2 mol H = 2 g\nMass of O = 30 − 12 − 2 = 16 g = 1 mol O\nC : H : O = 1 : 2 : 1, so **CH_{2}O**"}]},{"id":"22n-1","t":"Nov 2022 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u1-2.webp","W":973,"H":391,"p":[{"id":"22n-1","l":"","m":1,"y":0,"h":209,"a":"**A**\nEach Ba(OH)_{2}•8H_{2}O contains 2 + 8 = 10 O atoms.\nn(O) = 0.0500 × 10 = 0.500 mol\nNumber of O atoms = 0.500 × 6.02 × 10^{23} = **3.01 × 10^{23}**"}]},{"id":"22n-4","t":"Nov 2022 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u1-2.webp","W":973,"H":391,"p":[{"id":"22n-4","l":"","m":1,"y":221,"h":170,"a":"**B**\nAn empirical formula is the simplest whole number ratio. M(CH_{2}) = 14 and 3 × 14 = 42, so the substance could be C_{3}H_{6} with empirical formula **CH_{2}**.\nC_{3}H_{6} itself is not an empirical formula (it simplifies to CH_{2}), CH (13) does not divide into 42, and C_{3}H_{8} = 44."}]},{"id":"23m1-1","t":"May 2023 TZ1 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u1-2.webp","W":973,"H":690,"p":[{"id":"23m1-1","l":"","m":1,"y":0,"h":170,"a":"**D**\nMolar mass is the mass of one mole of a substance: **g mol^{−1}**."}]},{"id":"23m1-2","t":"May 2023 TZ1 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u1-2.webp","W":973,"H":690,"p":[{"id":"23m1-2","l":"","m":1,"y":182,"h":162,"a":"**B**\nThe molecular formula gives the **actual number** of each type of atom in one molecule. The simplest ratio is the empirical formula."}]},{"id":"23m1-3","t":"May 2023 TZ1 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u1-2.webp","W":973,"H":690,"p":[{"id":"23m1-3","l":"","m":1,"y":356,"h":334,"a":"**A**\nKnowing the mass of Zn and the mass of zinc oxide formed gives the mass of O that combined.\nFrom these masses you can find the **percentage composition** and the **empirical formula** (mole ratio Zn : O).\nThe molecular formula cannot be found: zinc oxide is ionic (a lattice, not molecules) and you would also need its molar mass."}]},{"id":"23m2-2","t":"May 2023 TZ2 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u1-2.webp","W":973,"H":225,"p":[{"id":"23m2-2","l":"","m":1,"y":0,"h":225,"a":"**D**\nM(C_{60}) = 60 × 12.01 = 720.6 g mol^{−1}\nMass of one molecule = 720.6 / 6.0 × 10^{23} = **1.2 × 10^{−21} g**"}]},{"id":"23n-2","t":"Nov 2023 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u1-2.webp","W":973,"H":379,"p":[{"id":"23n-2","l":"","m":1,"y":0,"h":176,"a":"**D**\nMass of M = 26.0 − 16.0 = 10.0 g\nn(S) = 16.0 / 32.07 = 0.50 mol\nMS_{2} has 2 S per M, so n(M) = 0.25 mol\nA_{r}(M) = 10.0 / 0.25 = **40**"}]},{"id":"23n-30","t":"Nov 2023 Paper 1 · Q30","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u1-2.webp","W":973,"H":379,"p":[{"id":"23n-30","l":"","m":1,"y":188,"h":191,"a":"**A**\nThe empirical formula is found from the mass or percentage of each element: **percentage composition** (divide each by A_{r} and find the simplest ratio)."}]},{"id":"24m1-2","t":"May 2024 TZ1 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u1-2.webp","W":973,"H":583,"p":[{"id":"24m1-2","l":"","m":1,"y":0,"h":583,"a":"**D**\nThe peak with the highest m/z (the molecular ion) is at **70**, so M_{r} = 70.\nM(CH_{2}) = 14 and 70 / 14 = 5, so the molecular formula is **C_{5}H_{10}**."}]},{"id":"24m2-1","t":"May 2024 TZ2 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u1-2.webp","W":973,"H":571,"p":[{"id":"24m2-1","l":"","m":1,"y":0,"h":170,"a":"**B**\n%C = mass of C / M × 100\nCH_{4}: 12.01 / 16.05 = 75 %\nC_{2}H_{6}: 24.02 / 30.08 = **80 %**\nCO: 43 %; CO_{2}: 27 %"}]},{"id":"24m2-3","t":"May 2024 TZ2 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u1-2.webp","W":973,"H":571,"p":[{"id":"24m2-3","l":"","m":1,"y":182,"h":167,"a":"**C**\nThe empirical formula shows the **simplest whole number ratio** of atoms of each element. The actual numbers are given by the molecular formula."}]},{"id":"24m2-4","t":"May 2024 TZ2 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u1-2.webp","W":973,"H":571,"p":[{"id":"24m2-4","l":"","m":1,"y":361,"h":210,"a":"**D**\nEach NH_{3} has 3 H atoms: n(H) = 2.00 × 3 = 6.00 mol\nNumber of H atoms = 6.00 × 6.02 × 10^{23} = **3.61 × 10^{24}**"}]},{"id":"24n-1","t":"Nov 2024 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u1-2.webp","W":973,"H":182,"p":[{"id":"24n-1","l":"","m":1,"y":0,"h":182,"a":"**C**\nn(Ca_{3}(PO_{4})_{2}) = 103.39 / 310.18 = 0.3333 mol\nEach formula unit contains 2 PO_{4}^{3−} ions: n(PO_{4}^{3−}) = 2 × 0.3333 = **0.67 mol**"}]},{"id":"25m2a-5","t":"May 2025 TZ2 Paper 1A · Q5","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u1-2.webp","W":973,"H":211,"p":[{"id":"25m2a-5","l":"","m":1,"y":0,"h":211,"a":"**D**\nC: 37.5 / 12.01 = 3.12\nH: 12.5 / 1.01 = 12.4\nO: 50.0 / 16.00 = 3.13\nDivide by 3.12: C 1, H 4, O 1, so **CH_{4}O** (methanol)."}]},{"id":"25m3a-1","t":"May 2025 TZ3 Paper 1A · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u1-2.webp","W":973,"H":462,"p":[{"id":"25m3a-1","l":"","m":1,"y":0,"h":169,"a":"**D**\nEach CuSO_{4}•5H_{2}O contains 4 + 5 = 9 O atoms.\nn(O) = 0.0200 × 9 = 0.180 mol\nNumber of O atoms = 0.180 × 6.02 × 10^{23} = **1.08 × 10^{23}**"}]},{"id":"25m3a-2","t":"May 2025 TZ3 Paper 1A · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u1-2.webp","W":973,"H":462,"p":[{"id":"25m3a-2","l":"","m":1,"y":181,"h":281,"a":"**B**\nI: M(C_{2}H_{5}) = 29 and 2 × 29 = 58, so C_{4}H_{10} has empirical formula C_{2}H_{5}. Possible.\nII: C_{4}H_{10} can be simplified (to C_{2}H_{5}), so it is not an empirical formula.\nIII: M(C_{3}H_{6}O) = 58, and C_{3}H_{6}O cannot be simplified. Possible."}]},{"id":"25n3a-3","t":"Nov 2025 TZ3 Paper 1A · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u1-2.webp","W":973,"H":168,"p":[{"id":"25n3a-3","l":"","m":1,"y":0,"h":168,"a":"**C**\n(NH_{4})_{2}SO_{4} contains 2 NH_{4}^{+} and 1 SO_{4}^{2−}: **3 ions** per formula unit.\nNumber of ions = 0.20 × 3 × 6 × 10^{23}"}]},{"id":"25m1b-2-1.2","t":"May 2025 TZ1 Paper 1B · Q2","s":"Data based questions (Paper 1B)","img":"q/25m1b-2.webp","W":973,"H":741,"p":[{"id":"25m1b-2.b","l":"(b)","m":1,"y":173,"h":344,"a":"Iron: 2.17 / 5.62 × 100 = **38.6 %**\nSand: 1.98 / 5.62 × 100 = **35.2 %**"}],"c":{"y":0,"h":130},"split":true},{"id":"25m2b-1-1.2","t":"May 2025 TZ2 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25m2b-1.webp","W":973,"H":1479,"p":[{"id":"25m2b-1.b","l":"(b)","m":2,"y":237,"h":100,"a":"**Heat the solid** (in an oven or in a crucible over a flame) to drive off the water, then cool it in a **desiccator** so it cannot reabsorb moisture.\n**Repeat heating, cooling and weighing until the mass is constant**, which shows all the water has gone."}],"c":{"y":0,"h":47},"split":true},{"id":"22m1p2-1-1.2","t":"May 2022 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m1p2-1.webp","W":973,"H":1876,"p":[{"id":"22m1p2-1.b.i","l":"(b)(i)","m":1,"y":257,"h":20,"a":"m(Mg) = 53.726 − 47.372 = 6.354 g\nn(Mg) = 6.354 / 24.31 = **0.2614 mol**","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":102,"h":155}},"split":true},{"id":"22np2-1-1.2","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.a","l":"(a)","m":1,"y":21,"h":42,"a":"M(NH_{4}NO_{3}) = 2(14.01) + 4(1.01) + 3(16.00) = 80.06 g mol^{−1}\n%N = 28.02 / 80.06 × 100 = **35.0 %**"}],"c":{"y":0,"h":21},"split":true},{"id":"23m1p2-5-1.2","t":"May 2023 TZ1 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/23m1p2-5.webp","W":973,"H":1094,"p":[{"id":"23m1p2-5.a.i","l":"(a)(i)","m":1,"y":303,"h":20,"a":"%O = 100 − (7.09 + 5.11 + 16.22 + 14.91) = **56.67 %**"},{"id":"23m1p2-5.a.ii","l":"(a)(ii)","m":3,"y":323,"h":573,"a":"Divide each % by A_{r}:\nN 7.09 / 14.01 = 0.506; H 5.11 / 1.01 = 5.06; S 16.22 / 32.07 = 0.506; Co 14.91 / 58.93 = 0.253; O 56.67 / 16.00 = 3.54\nDivide by the smallest (0.253): N 2, H 20, S 2, Co 1, O 14\nEmpirical formula: **CoN_{2}H_{20}S_{2}O_{14}**"},{"id":"23m1p2-5.a.iii","l":"(a)(iii)","m":1,"y":896,"h":44,"a":"Group the atoms into ions and water: 2 NH_{4}^{+} (N_{2}H_{8}), Co^{2+}, 2 SO_{4}^{2−} (S_{2}O_{8}), and the remaining H_{12}O_{6} = 6 H_{2}O.\n**(NH_{4})_{2}Co(SO_{4})_{2}•6H_{2}O**"}],"c":{"y":0,"h":303},"split":true},{"id":"23m2p2-1-1.2","t":"May 2023 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23m2p2-1.webp","W":973,"H":1301,"p":[{"id":"23m2p2-1.a","l":"(a)","m":3,"y":43,"h":201,"a":"%H = 100 − 48.6 − 43.2 = 8.2 %\nC: 48.6 / 12.01 = 4.05; H: 8.2 / 1.01 = 8.1; O: 43.2 / 16.00 = 2.70\nDivide by 2.70: C 1.5, H 3, O 1; multiply by 2: C 3, H 6, O 2\nEmpirical formula: **C_{3}H_{6}O_{2}**"},{"id":"23m2p2-1.c","l":"(c)","m":1,"y":418,"h":708,"a":"The molecular ion (M^{+}) peak is at m/z = 74, and M(C_{3}H_{6}O_{2}) = 74.\nSo the molecular formula is the same as the empirical formula: **C_{3}H_{6}O_{2}**"}],"c":{"y":0,"h":43},"split":true},{"id":"23np2-1-1.2","t":"Nov 2023 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23np2-1.webp","W":973,"H":597,"p":[{"id":"23np2-1.c","l":"(c)","m":2,"y":283,"h":58,"a":"M(HCOOH) = 2(1.01) + 12.01 + 2(16.00) = 46.03 g mol^{−1}\n%O = 32.00 / 46.03 × 100 = **69.5 %**"}],"c":{"y":0,"h":20},"split":true},{"id":"24m2p2-1-1.2","t":"May 2024 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24m2p2-1.webp","W":973,"H":871,"p":[{"id":"24m2p2-1.a","l":"(a)","m":1,"y":143,"h":20,"a":"C + H = 71.93 + 12.10 = 84.03 %, which is less than 100 %, so the compound must contain another element: **oxygen** (15.97 %). A hydrocarbon contains only C and H."},{"id":"24m2p2-1.b","l":"(b)","m":2,"y":163,"h":20,"a":"O = 100 − 84.03 = 15.97 %\nC: 71.93 / 12.01 = 5.99; H: 12.10 / 1.01 = 11.98; O: 15.97 / 16.00 = 1.00\nRatio 6 : 12 : 1, so **C_{6}H_{12}O**"}],"c":{"y":0,"h":143},"split":true},{"id":"25m1p2-5-1.2","t":"May 2025 TZ1 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/25m1p2-5.webp","W":973,"H":339,"p":[{"id":"25m1p2-5.a","l":"(a)","m":3,"y":20,"h":91,"a":"n(C) = n(CO_{2}) = 9.49 / 44.01 = 0.216 mol, mass C = 0.216 × 12.01 = 2.59 g\nn(H) = 2 × n(H_{2}O) = 2 × 5.18 / 18.02 = 0.575 mol, mass H = 0.575 × 1.01 = 0.581 g\nmass O = 4.32 − 2.59 − 0.581 = 1.15 g, n(O) = 1.15 / 16.00 = 0.0718 mol\nRatio C : H : O = 0.216 : 0.575 : 0.0718 = 3 : 8 : 1, so **C_{3}H_{8}O**"}],"c":{"y":0,"h":20},"split":true},{"id":"25m3p2-1-1.2","t":"May 2025 TZ3 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m3p2-1.webp","W":973,"H":789,"p":[{"id":"25m3p2-1.a","l":"(a)","m":2,"y":358,"h":158,"a":"Count from the structure: three benzene rings (C6 each) plus the central C and the C=O carbon: C_{20}; 14 H; 4 O.\nMolecular formula: **C_{20}H_{14}O_{4}**\nEmpirical formula: divide by 2: **C_{10}H_{7}O_{2}**"}],"c":{"y":0,"h":358},"split":true},{"id":"25m3p2-4-1.2","t":"May 2025 TZ3 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m3p2-4.webp","W":973,"H":815,"p":[{"id":"25m3p2-4.b","l":"(b)","m":2,"y":65,"h":44,"a":"X is C_{6}H_{13}Br: M = 6(12.01) + 13(1.01) + 79.90 = 165.09 g mol^{−1}\n%H = 13.13 / 165.09 × 100 = **7.953 %**"}],"c":{"y":0,"h":20},"split":true},{"id":"25n1p2-1-1.2","t":"Nov 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25n1p2-1.webp","W":973,"H":1792,"p":[{"id":"25n1p2-1.b.i","l":"(b)(i)","m":1,"y":1080,"h":42,"a":"n(P) = 7.75 / 30.97 = 0.250 mol\nAtoms = 0.250 × 6.02 × 10^{23} = **1.51 × 10^{23}**","g":"(b)"},{"id":"25n1p2-1.b.ii","l":"(b)(ii)","m":3,"y":1122,"h":42,"a":"Mass of O = 13.75 − 7.75 = 6.00 g; n(O) = 6.00 / 16.00 = 0.375 mol\nn(P) = 0.250 mol\nP : O = 0.250 : 0.375 = 1 : 1.5 = 2 : 3, so **P_{2}O_{3}**","g":"(b)"},{"id":"25n1p2-1.b.iii","l":"(b)(iii)","m":1,"y":1164,"h":83,"a":"M(P_{2}O_{3}) = 2(30.97) + 3(16.00) = 109.94\n219.88 / 109.94 = 2, so the molecular formula is **P_{4}O_{6}**","g":"(b)"}],"c":{"y":0,"h":44},"ps":{"(b)":{"y":1036,"h":44}},"split":true}]},{"k":"1.3","n":"Reacting masses and volumes","q":[{"id":"22m1-1","t":"May 2022 TZ1 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u1-3.webp","W":973,"H":233,"p":[{"id":"22m1-1","l":"","m":1,"y":0,"h":233,"a":"**B**\n2 NaHCO_{3} → Na_{2}CO_{3} + H_{2}O(g) + CO_{2}(g)\n2 mol NaHCO_{3} give 1 mol H_{2}O(g) + 1 mol CO_{2}(g), so 2 mol of gas in total.\n0.2 mol NaHCO_{3} therefore gives **0.1 + 0.1 = 0.2 mol of gas**."}]},{"id":"22m2-1","t":"May 2022 TZ2 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u1-3.webp","W":973,"H":611,"p":[{"id":"22m2-1","l":"","m":1,"y":0,"h":178,"a":"**C**\nn(Cl^{−}) from HCl = 1 × 0.200 = 0.20 mol\nn(Cl^{−}) from NaCl = 5 × 0.200 = 1.00 mol\nTotal = 1.20 mol in 400 cm³ = 0.400 dm³\n[Cl^{−}] = 1.20 / 0.400 = **3 mol dm^{−3}**"}]},{"id":"22m2-3","t":"May 2022 TZ2 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u1-3.webp","W":973,"H":611,"p":[{"id":"22m2-3","l":"","m":1,"y":190,"h":421,"a":"**B**\nRearranging PV = nRT gives n = PV / RT. With P and V constant, n is inversely proportional to T, so the graph is a curve falling towards the T axis (n × T = constant)."}]},{"id":"22n-3","t":"Nov 2022 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u1-3.webp","W":973,"H":218,"p":[{"id":"22n-3","l":"","m":1,"y":0,"h":218,"a":"**B**\nC_{2}H_{4} + 3O_{2} → 2CO_{2} + 2H_{2}O\nn(C_{2}H_{4}) = 7.0 / 28 = 0.25 mol, and each C_{2}H_{4} gives 2 CO_{2}, so n(CO_{2}) = **0.50 mol**."}]},{"id":"23m1-4","t":"May 2023 TZ1 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u1-3.webp","W":973,"H":522,"p":[{"id":"23m1-4","l":"","m":1,"y":0,"h":522,"a":"**A**\nn = m / M and PV = nRT, so M = mRT / PV.\nT = 17 + 273 = 290 K. With P in kPa, V must be in dm³: 220 cm³ = 0.220 dm³.\nM = (40.0 × 8.31 × 290) / (98 × 0.220)"}]},{"id":"23m2-3","t":"May 2023 TZ2 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u1-3.webp","W":973,"H":1293,"p":[{"id":"23m2-3","l":"","m":1,"y":0,"h":293,"a":"**D**\nEqual volumes of gas contain equal amounts (Avogadro's law), so volumes act as mole ratios.\nA used = 20 − 10 (excess) = 10 cm³; B used = 20 cm³; product = 10 cm³.\n10 A + 20 B → 10 AxBy, so 1 A + 2 B → 1 AxBy: **x = 1, y = 2** (AB_{2})."}]},{"id":"23m2-4","t":"May 2023 TZ2 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u1-3.webp","W":973,"H":1293,"p":[{"id":"23m2-4","l":"","m":1,"y":305,"h":988,"a":"**A**\nAt constant temperature for a fixed mass of gas, pV = nRT is constant (Boyle's law). So pV does not change as p changes: a **horizontal line**."}]},{"id":"23n-1","t":"Nov 2023 Paper 1 · Q1","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u1-3.webp","W":973,"H":1487,"p":[{"id":"23n-1","l":"","m":1,"y":0,"h":198,"a":"**D**\nFor equal moles of CO_{2} and H_{2}O the formula must have twice as many H as C (C_{n}H_{2n}), since each H_{2}O contains 2 H.\nC_{4}H_{8} + 6O_{2} → **4CO_{2} + 4H_{2}O**\nCH_{4} gives 1 : 2, C_{2}H_{2} gives 2 : 1, C_{3}H_{8} gives 3 : 4."}]},{"id":"23n-3","t":"Nov 2023 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u1-3.webp","W":973,"H":1487,"p":[{"id":"23n-3","l":"","m":1,"y":210,"h":247,"a":"**C**\nn(CH_{4}) = 64 / 16 = 4 mol; n(O_{2}) = 96 / 32 = 3 mol\n4 mol CH_{4} would need 8 mol O_{2}, so **O_{2} is limiting**.\n3 mol O_{2} reacts with 1.5 mol CH_{4}, leaving 2.5 mol CH_{4} unreacted.\nAt the end: CH_{4} (excess), CO_{2} and H_{2}O, but no O_{2}."}]},{"id":"23n-29","t":"Nov 2023 Paper 1 · Q29","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u1-3.webp","W":973,"H":1487,"p":[{"id":"23n-29","l":"","m":1,"y":469,"h":1018,"a":"**A**\nOnce the limiting reactant is used up, no more product can form. Adding more of the excess reactant does **not** change the amount of product, so the line is horizontal."}]},{"id":"24m1-4","t":"May 2024 TZ1 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u1-3.webp","W":973,"H":244,"p":[{"id":"24m1-4","l":"","m":1,"y":0,"h":244,"a":"**B**\nGas volumes react in the mole ratio 1 : 2.\n15 dm³ of buta-1,3-diene would need 30 dm³ H_{2}, but only 18 dm³ is present, so **H_{2} is limiting**.\n18 dm³ H_{2} reacts with 9 dm³ diene, forming **9 dm³ butane** and leaving 15 − 9 = **6 dm³ buta-1,3-diene**."}]},{"id":"24m2-2","t":"May 2024 TZ2 Paper 1 · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u1-3.webp","W":973,"H":887,"p":[{"id":"24m2-2","l":"","m":1,"y":0,"h":276,"a":"**A**\n6.00 mol Cu would need 6.00 × 8/3 = 16.0 mol HNO_{3}, but only 12.00 mol is present, so **HNO_{3} is limiting**.\nn(NO) = 12.00 × 2/8 = **3.00 mol**"}]},{"id":"24m2-29","t":"May 2024 TZ2 Paper 1 · Q29","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u1-3.webp","W":973,"H":887,"p":[{"id":"24m2-29","l":"","m":1,"y":288,"h":599,"a":"**D**\nAt constant pressure V is proportional to the **absolute** temperature, so V against T/K would be a straight line through the origin (not offered).\nOn a °C axis, V is still positive at 0 °C (273 K), so the line has a **positive intercept**."}]},{"id":"24n-3","t":"Nov 2024 Paper 1 · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u1-3.webp","W":973,"H":574,"p":[{"id":"24n-3","l":"","m":1,"y":0,"h":269,"a":"**B**\nn(Na) = 2.30 / 22.99 = 0.100 mol\nn(Cl_{2}) = 11.4 / 22.7 = 0.502 mol, but only 0.050 mol is needed, so **Na is limiting**.\nn(NaCl) = 0.100 mol, mass = 0.100 × 58.4 = **5.84 g**"}]},{"id":"24n-4","t":"Nov 2024 Paper 1 · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u1-3.webp","W":973,"H":574,"p":[{"id":"24n-4","l":"","m":1,"y":281,"h":293,"a":"**B**\nFor a pressure in Pa use SI units: V in m³ and T in K.\nn(O_{2}) = 64 / 32 = 2 mol; T = 298 K; V = 3.0 dm³ = 3.0 × 10^{−3} m³\nP = nRT / V = (2 × 8.31 × 298) / (3.0 × 10^{−3})"}]},{"id":"25m1a-4","t":"May 2025 TZ1 Paper 1A · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u1-3.webp","W":973,"H":730,"p":[{"id":"25m1a-4","l":"","m":1,"y":0,"h":240,"a":"**A**\nGases behave most ideally at **low pressure** (particles far apart, their own volume negligible) and **high temperature** (particles move fast, intermolecular forces negligible).\nPH_{3} has weaker intermolecular forces than NH_{3}, which hydrogen bonds, so **PH_{3}** deviates less."}]},{"id":"25m1a-6","t":"May 2025 TZ1 Paper 1A · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u1-3.webp","W":973,"H":730,"p":[{"id":"25m1a-6","l":"","m":1,"y":252,"h":194,"a":"**D**\nAt constant n and T, pV is constant (Boyle's law). Increasing the volume by 100 % doubles it, so the pressure halves: it **decreases by 50 %**."}]},{"id":"25m1a-21","t":"May 2025 TZ1 Paper 1A · Q21","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u1-3.webp","W":973,"H":730,"p":[{"id":"25m1a-21","l":"","m":1,"y":458,"h":272,"a":"**A**\nGas volumes react in the mole ratio. 75 cm³ C_{3}H_{8} needs 5 × 75 = 375 cm³ O_{2}.\nO_{2} left over = 400 − 375 = **25 cm³**"}]},{"id":"25m2a-18","t":"May 2025 TZ2 Paper 1A · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u1-3.webp","W":973,"H":302,"p":[{"id":"25m2a-18","l":"","m":1,"y":0,"h":302,"a":"**D**\n0.20 mol Mg would need 0.40 mol HCl, but only 0.20 mol HCl is present, so **HCl is limiting**.\nn(H_{2}) = 0.20 / 2 = **0.10 mol**"}]},{"id":"25m3a-3","t":"May 2025 TZ3 Paper 1A · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u1-3.webp","W":973,"H":431,"p":[{"id":"25m3a-3","l":"","m":1,"y":0,"h":221,"a":"**B**\nGas volumes react in the mole ratio: 2 butane : 8 CO_{2} = 1 : 4.\nVolume of butane = 40 / 4 = **10 cm³**"}]},{"id":"25m3a-21","t":"May 2025 TZ3 Paper 1A · Q21","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u1-3.webp","W":973,"H":431,"p":[{"id":"25m3a-21","l":"","m":1,"y":233,"h":198,"a":"**D**\nC_{3}H_{8} + 5O_{2} → 3CO_{2} + 4H_{2}O\nn(C_{3}H_{8}) = 11.5 / 44.1 = 0.261 mol\nn(O_{2}) = 5 × 0.261 = **1.30 mol**"}]},{"id":"25n1a-4","t":"Nov 2025 TZ1 Paper 1A · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u1-3.webp","W":973,"H":1304,"p":[{"id":"25n1a-4","l":"","m":1,"y":0,"h":222,"a":"**D**\nn(Na_{2}CO_{3}•10H_{2}O) = 5.72 / 286 = 0.0200 mol\nEach formula unit gives 2 Na^{+}: n(Na^{+}) = 0.0400 mol\n[Na^{+}] = 0.0400 / 0.4 = **0.10 mol dm^{−3}**"}]},{"id":"25n1a-5","t":"Nov 2025 TZ1 Paper 1A · Q5","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u1-3.webp","W":973,"H":1304,"p":[{"id":"25n1a-5","l":"","m":1,"y":234,"h":240,"a":"**C**\nGases are most ideal at **low pressure** and **high temperature**, and when their intermolecular forces are weak.\nH_{2} has only weak London forces, while NH_{3} hydrogen bonds. So H_{2} at 50 kPa and 473 K."}]},{"id":"25n1a-19","t":"Nov 2025 TZ1 Paper 1A · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u1-3.webp","W":973,"H":1304,"p":[{"id":"25n1a-19","l":"","m":1,"y":486,"h":262,"a":"**C**\nEqual volumes V of X_{2} and Y_{2}. Y_{2} is needed 3 times as much as X_{2}, so **Y_{2} is limiting** and all of it reacts.\n40 cm³ XY_{3} needs 3/2 × 40 = 60 cm³ Y_{2}, so V = **60 cm³**. (X_{2} is in excess: 20 cm³ is used, 40 cm³ is left.)"}]},{"id":"25n1a-20","t":"Nov 2025 TZ1 Paper 1A · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u1-3.webp","W":973,"H":1304,"p":[{"id":"25n1a-20","l":"","m":1,"y":760,"h":259,"a":"**D**\nn(Cu) = 1.28 / 63.55 = 0.0201 mol\nn(NO_{2}) = 2 × 0.0201 = 0.0403 mol\nV = 0.0403 × 22.7 = 0.914 dm³ = **914 cm³**"}]},{"id":"25n1a-21","t":"Nov 2025 TZ1 Paper 1A · Q21","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u1-3.webp","W":973,"H":1304,"p":[{"id":"25n1a-21","l":"","m":1,"y":1031,"h":273,"a":"**C**\nn(SO_{2}) = 96 / 64.07 = 1.50 mol, so 1.50 mol SO_{3} can form.\nTheoretical mass = 1.50 × 80.07 = 120 g\n% yield = 96 / 120 × 100 = **80 %**"}]},{"id":"25n3a-4","t":"Nov 2025 TZ3 Paper 1A · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u1-3.webp","W":973,"H":798,"p":[{"id":"25n3a-4","l":"","m":1,"y":0,"h":257,"a":"**A**\nVolumes react in the mole ratio 1 C_{2}H_{2} : 2 H_{2}.\n0.25 dm³ C_{2}H_{2} would need 0.50 dm³ H_{2}, but only 0.40 dm³ is present, so **H_{2} is limiting**.\nV(C_{2}H_{6}) = 0.40 / 2 = **0.20 dm³**"}]},{"id":"25n3a-5","t":"Nov 2025 TZ3 Paper 1A · Q5","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u1-3.webp","W":973,"H":798,"p":[{"id":"25n3a-5","l":"","m":1,"y":269,"h":180,"a":"**C**\nAt constant volume, P is proportional to the **absolute** temperature.\nT rises from 303 K to 333 K, so P becomes P × 333/303 = 1.10 P: **a little more than P** (not double; doubling °C is not doubling K)."}]},{"id":"25n3a-18","t":"Nov 2025 TZ3 Paper 1A · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u1-3.webp","W":973,"H":798,"p":[{"id":"25n3a-18","l":"","m":1,"y":461,"h":337,"a":"**C**\nn((NH_{4})_{2}CO_{3}) = 4.00 / 96.11 = 0.0416 mol\nThis gives 2 × 0.0416 = 0.0832 mol CH_{3}COONH_{4}, which gives 0.0832 mol CH_{3}CONH_{2} (1 : 1).\nMass = 0.0832 × 59.08 = **4.92 g**"}]},{"id":"25m1b-1-1.3","t":"May 2025 TZ1 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25m1b-1.webp","W":973,"H":1349,"p":[{"id":"25m1b-1.a","l":"(a)","m":2,"y":528,"h":46,"a":"n = cV = 0.1500 × 0.5000 = 0.07500 mol\nM(Na_{2}S_{2}O_{3}) = 2(22.99) + 2(32.07) + 3(16.00) = 158.12 g mol^{−1}\nm = nM = 0.07500 × 158.12 = **11.86 g**"},{"id":"25m1b-1.b","l":"(b)","m":3,"y":574,"h":23,"a":"- Weigh 11.86 g of Na_{2}S_{2}O_{3} accurately (weighing boat / by difference).\n- Dissolve it completely in a beaker using a small volume of distilled water.\n- Transfer the solution into a 500.0 cm³ volumetric flask, rinsing the beaker (and funnel/rod) with distilled water and adding the washings to the flask.\n- Add distilled water until the bottom of the meniscus is on the graduation mark, then stopper and invert to mix."},{"id":"25m1b-1.c","l":"(c)","m":3,"y":597,"h":47,"a":"Dilution: c_{1}V_{1} = c_{2}V_{2}, so V_{1} = (0.03000 × 100.0) / 0.1500 = **20.00 cm³**\n- Measure 20.00 cm³ of the 0.1500 mol dm^{−3} solution with a pipette (or burette).\n- Transfer it to a 100.0 cm³ volumetric flask.\n- Add distilled water up to the mark and invert to mix."}],"c":{"y":0,"h":528},"split":true},{"id":"25m2b-1-1.3","t":"May 2025 TZ2 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25m2b-1.webp","W":973,"H":1479,"p":[{"id":"25m2b-1.a.i","l":"(a)(i)","m":1,"y":171,"h":23,"a":"A **250.0 cm³ volumetric flask** (class A), which is calibrated to contain exactly that volume.","g":"(a)"},{"id":"25m2b-1.a.ii","l":"(a)(ii)","m":2,"y":194,"h":43,"a":"- Use a **pipette** to transfer an accurately measured volume of the initial calcium chloride solution into a clean **volumetric flask**.\n- Add distilled water until the bottom of the meniscus is on the **graduation mark**, then stopper and invert several times to mix.\n(Calculate the volume needed first with c_{1}V_{1} = c_{2}V_{2}.)","g":"(a)"},{"id":"25m2b-1.d.iii","l":"(d)(iii)","m":1,"y":1433,"h":46,"a":"The stock solution was diluted from 2.00 cm³ to 25.00 cm³, a dilution factor of 25.00 / 2.00 = 12.5.\nc(stock) = 4.00 × 12.5 = **50.0 ppm**\n(c_{1}V_{1} = c_{2}V_{2}: c_{1} × 2.00 = 4.00 × 25.00)","g":"(d)"}],"c":{"y":0,"h":47},"ps":{"(a)":{"y":47,"h":124},"(d)":{"y":796,"h":67}},"split":true},{"id":"25m2b-3-1.3","t":"May 2025 TZ2 Paper 1B · Q3","s":"Data based questions (Paper 1B)","img":"q/25m2b-3.webp","W":973,"H":858,"p":[{"id":"25m2b-3.b","l":"(b)","m":1,"y":687,"h":171,"a":"Limiting reagent: **HCl(aq)**\nReason: the same mass of NaHCO_{3} was used each time, but the total mass of CO_{2} lost increases with the acid concentration (about 1.4 g, 3.5 g and 4.1 g). If NaHCO_{3} were limiting, the total mass lost would be the same in every case."}],"c":{"y":0,"h":91},"split":true},{"id":"25m3b-1-1.3","t":"May 2025 TZ3 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25m3b-1.webp","W":973,"H":2712,"p":[{"id":"25m3b-1.a.iii","l":"(a)(iii)","m":1,"y":453,"h":43,"a":"1 mol Cu gives 2 mol NO_{2}, so n(Cu) = 0.0100 / 2 = 0.00500 mol\nm = 0.00500 × 63.55 = **0.318 g**"},{"id":"25m3b-1.e.i","l":"(e)(i)","m":1,"y":1368,"h":156,"a":"Transferring 25.0 cm³: a **25.0 cm³ (volumetric) pipette**\nAdding NaOH: a **burette**","g":"(e)"},{"id":"25m3b-1.e.iv","l":"(e)(iv)","m":1,"y":2625,"h":43,"a":"T(K) = T(°C) + 273.15\n0.0 °C = **273.15 K**; 20.0 °C = **293.15 K**; 50.0 °C = **323.15 K**; 100.0 °C = **373.15 K**","g":"(e)"}],"c":{"y":0,"h":69},"ps":{"(e)":{"y":1221,"h":147}},"split":true},{"id":"25m3b-2-1.3","t":"May 2025 TZ3 Paper 1B · Q2","s":"Data based questions (Paper 1B)","img":"q/25m3b-2.webp","W":973,"H":181,"p":[{"id":"25m3b-2.a","l":"(a)","m":3,"y":102,"h":20,"a":"- Weigh accurately the mass of solid needed (calculated from m = cVM).\n- Dissolve it completely in a small amount of distilled water in a beaker.\n- Transfer to a volumetric flask, rinsing the beaker into the flask, then add distilled water up to the graduation mark and invert to mix."}],"c":{"y":0,"h":102},"split":true},{"id":"25n1b-1-1.3","t":"Nov 2025 TZ1 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25n1b-1.webp","W":973,"H":1045,"p":[{"id":"25n1b-1.a","l":"(a)","m":1,"y":43,"h":20,"a":"n(NaOH) = cV = 0.2500 × 0.5000 = 0.1250 mol\nm = 0.1250 × 40.00 = **5.000 g**"},{"id":"25n1b-1.b","l":"(b)","m":3,"y":63,"h":20,"a":"- Weigh the solid accurately (by difference) and dissolve it completely in a small volume of distilled water in a beaker.\n- Transfer the solution to the volumetric flask, **rinsing** the beaker (and funnel) with distilled water into the flask so no solute is lost.\n- Add distilled water until the **bottom of the meniscus** is on the graduation mark (dropwise near the end, reading at eye level), then stopper and **invert** to mix."},{"id":"25n1b-1.c","l":"(c)","m":2,"y":83,"h":810,"a":"Each small division on the burette is 0.2 cm³, and readings are recorded to 2 decimal places (±0.05 cm³).\nInitial volume: **10.30 cm³** (meniscus bottom halfway between 10.2 and 10.4)\nFinal volume: **23.20 cm³**\nVolume used: 23.20 − 10.30 = **12.90 cm³**\nn(HCl) = 0.2000 × 0.01290 = 2.580 × 10^{−3} mol = n(NaOH) (1 : 1)\n[NaOH] = 2.580 × 10^{−3} / 0.01000 = **0.2580 mol dm^{−3}**"},{"id":"25n1b-1.e","l":"(e)","m":2,"y":1001,"h":44,"a":"Solid NaOH is **hygroscopic** (absorbs water from the air) and also **reacts with CO_{2}** in the air (forming Na_{2}CO_{3}).\nSo the mass weighed is not all NaOH and the true concentration is not exactly the intended value: it must be found by titration against an accurately known (primary) standard."}],"c":{"y":0,"h":43},"split":true},{"id":"22m1p2-1-1.3","t":"May 2022 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m1p2-1.webp","W":973,"H":1876,"p":[{"id":"22m1p2-1.b.iii","l":"(b)(iii)","m":2,"y":297,"h":68,"a":"Mass of MgO obtained = 56.941 − 47.372 = 9.569 g\nTheoretical: n(MgO) = n(Mg) = 0.2614 mol, m = 0.2614 × 40.31 = 10.54 g\n% yield = 9.569 / 10.54 × 100 = **90.8 %**","g":"(b)"},{"id":"22m1p2-1.c.i","l":"(c)(i)","m":1,"y":448,"h":44,"a":"**Yes, it could.** 3 mol Mg (72.9 g) forms only 1 mol Mg_{3}N_{2} (100.9 g), whereas as MgO the same Mg would form 120.9 g. So any Mg that forms nitride gives a **smaller mass of product**, which lowers the apparent yield of MgO.","g":"(c)"},{"id":"22m1p2-1.c.ii","l":"(c)(ii)","m":1,"y":492,"h":43,"a":"Any one of:\n- not all the magnesium reacted (incomplete reaction, e.g. the lid limited the oxygen supply);\n- the magnesium ribbon was impure / already coated with oxide, so less Mg was present than assumed.","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":102,"h":155},"(c)":{"y":365,"h":83}},"split":true},{"id":"22m1p2-2-1.3","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.e.ii","l":"(e)(ii)","m":2,"y":1176,"h":70,"a":"n = PV / RT = (100.0 × 900.0) / (8.31 × 300.0) = 36.1 mol (kPa × dm³ gives J)\nc = n / V = 36.1 / 2.00 = **18.1 mol dm^{−3}**","g":"(e)"}],"c":{"y":0,"h":21},"ps"  1 · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u2-2.webp","W":973,"H":1263,"p":[{"id":"23m2-6","l":"","m":1,"y":350,"h":721,"a":"**A**\nLight passing through cold gas has certain frequencies absorbed: dark lines on a continuous background, an **absorption** spectrum (A).\nHot gas emits light at certain frequencies: bright lines on a dark background, an **emission** spectrum (B)."}]},{"id":"23m2-7","t":"May 2023 TZ2 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u2-2.webp","W":973,"H":1263,"p":[{"id":"23m2-7","l":"","m":1,"y":1083,"h":180,"a":"**A**\nPeriod 5 starts after krypton: 5s fills (groups 1 and 2), then 4d. Group 4 has 2 electrons in 4d: **[Kr] 5s² 4d²** (zirconium)."}]},{"id":"23n-6","t":"Nov 2023 Paper 1 · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u2-2.webp","W":973,"H":179,"p":[{"id":"23n-6","l":"","m":1,"y":0,"h":179,"a":"**B**\nCopper is an exception: a full 3d sub level is more stable, so its ground state is **[Ar] 4s¹ 3d¹⁰**.\nA should be 4s² 3d¹ (Sc), C is not the ground state of Cu, and D should be 4s² 3d¹⁰ 4p¹ (Ga, a p block element)."}]},{"id":"24m1-6","t":"May 2024 TZ1 Paper 1 · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u2-2.webp","W":973,"H":608,"p":[{"id":"24m1-6","l":"","m":1,"y":0,"h":608,"a":"**A**\nVisible lines of hydrogen come from transitions **down to n = 2** (emission, so the arrow points down).\nRed light has the lowest energy of the visible lines, so it is the smallest visible drop: **n = 3 to n = 2**.\nB is a larger drop (blue/violet), C is absorption, D (to n = 1) is in the UV."}]},{"id":"24m2-5","t":"May 2024 TZ2 Paper 1 · Q5","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u2-2.webp","W":973,"H":340,"p":[{"id":"24m2-5","l":"","m":1,"y":0,"h":156,"a":"**C**\nMaximum = 2n² = 2 × 16 = **32** (s 2 + p 6 + d 10 + f 14)."}]},{"id":"24m2-6","t":"May 2024 TZ2 Paper 1 · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u2-2.webp","W":973,"H":340,"p":[{"id":"24m2-6","l":"","m":1,"y":168,"h":172,"a":"**B**\nEmission lines are produced when excited electrons **fall to lower energy levels**, giving out photons whose energy equals the difference between the two levels (E = hf)."}]},{"id":"24n-6","t":"Nov 2024 Paper 1 · Q6","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u2-2.webp","W":973,"H":299,"p":[{"id":"24n-6","l":"","m":1,"y":0,"h":299,"a":"**A**\nUV radiation has a **shorter wavelength** and therefore **higher energy** (E = hc/λ) than visible light; visible light has a longer wavelength and lower energy."}]},{"id":"25m1a-2","t":"May 2025 TZ1 Paper 1A · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u2-2.webp","W":973,"H":1008,"p":[{"id":"25m1a-2","l":"","m":1,"y":0,"h":221,"a":"**D**\nWork out the electrons in each ion:\nW: Z = 12, 2+ charge, 10 electrons: 2,8 (8 outer)\nX: Z = 16, 1− charge, 17 electrons: 2,8,7 (7 outer)\nY: Z = 21, 2+ charge, 19 electrons: [Ar] 3d¹\nZ: Z = 9, 1− charge, 10 electrons: 2,8 (8 outer)\n**W and Z** both have 8 outer electrons."}]},{"id":"25m1a-3","t":"May 2025 TZ1 Paper 1A · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u2-2.webp","W":973,"H":1008,"p":[{"id":"25m1a-3","l":"","m":1,"y":233,"h":424,"a":"**A**\nN has 7 electrons: 1s² 2s² 2p³.\n1s and 2s are full (paired, opposite spins). Hund's rule: the three 2p electrons occupy **separate** 2p orbitals with **parallel spins**.\nB and D wrongly pair 2p electrons; C has unpaired 1s and 2s electrons."}]},{"id":"25m1a-5","t":"May 2025 TZ1 Paper 1A · Q5","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u2-2.webp","W":973,"H":1008,"p":[{"id":"25m1a-5","l":"","m":1,"y":669,"h":339,"a":"**D**\nAn s orbital is **spherical**; a p orbital is **dumbbell shaped** (two lobes on either side of the nucleus)."}]},{"id":"25m2a-3","t":"May 2025 TZ2 Paper 1A · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u2-2.webp","W":973,"H":331,"p":[{"id":"25m2a-3","l":"","m":1,"y":0,"h":163,"a":"**B**\nThe line spectrum shows that only certain energies are emitted, so electrons can only exist in discrete **energy levels**."}]},{"id":"25m2a-4","t":"May 2025 TZ2 Paper 1A · Q4","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u2-2.webp","W":973,"H":331,"p":[{"id":"25m2a-4","l":"","m":1,"y":175,"h":156,"a":"**C**\nMaximum = 2n² = 2 × 3² = **18** (3s 2 + 3p 6 + 3d 10)."}]},{"id":"25m3a-5","t":"May 2025 TZ3 Paper 1A · Q5","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u2-2.webp","W":973,"H":368,"p":[{"id":"25m3a-5","l":"","m":1,"y":0,"h":176,"a":"**C**\nMaximum = 2n² = 2 × 4² = **32**."}]},{"id":"25m3a-12","t":"May 2025 TZ3 Paper 1A · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u2-2.webp","W":973,"H":368,"p":[{"id":"25m3a-12","l":"","m":1,"y":188,"h":180,"a":"**D**\nCopper is an exception: a full 3d sub level is more stable, so one 4s electron moves into 3d: **[Ar] 4s¹ 3d¹⁰**."}]},{"id":"25n1a-3","t":"Nov 2025 TZ1 Paper 1A · Q3","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u2-2.webp","W":973,"H":462,"p":[{"id":"25n1a-3","l":"","m":1,"y":0,"h":462,"a":"**D**\nPauli: each orbital holds at most two electrons with **opposite** spins. Hund: electrons fill separate orbitals of a sub level with **parallel** spins before pairing.\nD (fluorine, 2p⁵) follows both rules.\nA and B have unpaired 2p electrons with opposite spins (breaks Hund's rule); C has two electrons with the same spin in one orbital (breaks Pauli)."}]},{"id":"25n3a-2","t":"Nov 2025 TZ3 Paper 1A · Q2","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u2-2.webp","W":973,"H":192,"p":[{"id":"25n3a-2","l":"","m":1,"y":0,"h":192,"a":"**C**\nIn an emission spectrum the lines get **closer together (converge) at higher energy**. These lines come from electrons falling from levels far from the nucleus, so the outer energy levels must be closer together."}]},{"id":"22m1p2-2-2.2","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.a","l":"(a)","m":1,"y":21,"h":347,"a":"1s: ↑↓\n2s: ↑↓\n2p: ↑ ↑ ↑ (one electron in each 2p box, all with parallel spins, Hund's rule)"}],"c":{"y":0,"h":21},"split":true},{"id":"22m2p2-2-2.2","t":"May 2022 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m2p2-2.webp","W":973,"H":715,"p":[{"id":"22m2p2-2.b.i","l":"(b)(i)","m":2,"y":584,"h":44,"a":"Any two:\n- it does not show **sub levels** (s, p, d) or orbitals within each level;\n- it suggests electrons move in fixed circular orbits, whereas their position is only a **probability** (orbitals);\n- it only works for **hydrogen** (one electron); it cannot explain spectra of atoms with more electrons.","g":"(b)"},{"id":"22m2p2-2.b.ii","l":"(b)(ii)","m":1,"y":628,"h":44,"a":"X: an arrow pointing **up from n = 1 to n = ∞**.","g":"(b)"},{"id":"22m2p2-2.b.iii","l":"(b)(iii)","m":1,"y":672,"h":43,"a":"Z: an arrow pointing **down from n = 3 to n = 2** (visible lines end at n = 2; the smallest drop is the lowest energy, the red line).","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":40,"h":544}},"split":true},{"id":"22np2-2-2.2","t":"Nov 2022 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22np2-2.webp","W":973,"H":1733,"p":[{"id":"22np2-2.e.ii","l":"(e)(ii)","m":1,"y":1063,"h":82,"a":"**1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹**, i.e. [Ar] 3d¹⁰ 4s¹ (a full 3d sub level is more stable).","g":"(e)"}],"c":{"y":0,"h":375},"ps":{"(e)":{"y":479,"h":284}},"split":true},{"id":"22np2-3-2.2","t":"Nov 2022 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22np2-3.webp","W":973,"H":1266,"p":[{"id":"22np2-3.a","l":"(a)","m":1,"y":61,"h":23,"a":"**[Ar] 3d⁶** (1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶). The 4s electrons are lost first."}],"c":{"y":0,"h":61},"split":true},{"id":"23m1p2-2-2.2","t":"May 2023 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m1p2-2.webp","W":973,"H":2486,"p":[{"id":"23m1p2-2.a.i","l":"(a)(i)","m":1,"y":20,"h":253,"a":"[He] then:\n2s: ↑↓ (one box with a pair of opposite spins)\n2p: ↑ (one electron in one of the three 2p boxes, the other two empty)\nLabel the boxes **2s** and **2p**."},{"id":"23m1p2-2.a.ii","l":"(a)(ii)","m":2,"y":273,"h":718,"a":"2s orbital: a **sphere** centred on the origin. Orbital type: s.\n2p orbital: a **dumbbell** (two lobes) along one axis, e.g. the x axis. Orbital type: p."}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-4-2.2","t":"May 2023 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/23m2p2-4.webp","W":973,"H":405,"p":[{"id":"23m2p2-4.a","l":"(a)","m":2,"y":43,"h":44,"a":"Any two:\n- it is in **period 6**, so it has **6 occupied energy levels** (main shells);\n- it is in **group 15**, so it has **5 valence electrons** (6s² 6p³);\n- it is in the **p block**, so its highest energy electrons are in a p sub level (6p), with 3 unpaired 6p electrons."},{"id":"23m2p2-4.e","l":"(e)","m":1,"y":382,"h":23,"a":"**1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁷** (Co is [Ar] 3d⁷ 4s²; the two 4s electrons are lost first)."}],"c":{"y":0,"h":43},"split":true},{"id":"24m1p2-5-2.2","t":"May 2024 TZ1 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/24m1p2-5.webp","W":973,"H":83,"p":[{"id":"24m1p2-5.a","l":"(a)","m":1,"y":0,"h":20,"a":"**1s² 2s² 2p⁶ 3s² 3p⁴** ([Ne] 3s² 3p⁴)"}],"split":true},{"id":"24m1p2-6-2.2","t":"May 2024 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/24m1p2-6.webp","W":973,"H":790,"p":[{"id":"24m1p2-6.b.ii","l":"(b)(ii)","m":1,"y":577,"h":170,"a":"Ni^{2+} is [Ar] 3d⁸ (the 4s electrons are lost first):\n4s: empty\n3d: ↑↓ ↑↓ ↑↓ ↑ ↑"}],"split":true},{"id":"24m2p2-2-2.2","t":"May 2024 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24m2p2-2.webp","W":973,"H":1359,"p":[{"id":"24m2p2-2.a","l":"(a)","m":2,"y":59,"h":174,"a":"**1s² 2s² 2p⁴**\nUnpaired electrons: **2** (the 2p⁴ electrons fill as ↑↓ ↑ ↑)."}],"c":{"y":0,"h":59},"split":true},{"id":"25m1p2-2-2.2","t":"May 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m1p2-2.webp","W":973,"H":708,"p":[{"id":"25m1p2-2.a","l":"(a)","m":1,"y":19,"h":23,"a":"**1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁷** ([Ar] 3d⁷; the 4s electrons are lost first)."}],"c":{"y":0,"h":19},"split":true},{"id":"25m3p2-7-2.2","t":"May 2025 TZ3 Paper 2 · Q7","s":"Structured questions (Paper 2)","img":"q/25m3p2-7.webp","W":973,"H":1327,"p":[{"id":"25m3p2-7.a.i","l":"(a)(i)","m":1,"y":22,"h":20,"a":"**1s² 2s² 2p⁶ 3s² 3p⁴**"}],"c":{"y":0,"h":22},"split":true},{"id":"25n1p2-1-2.2","t":"Nov 2025 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25n1p2-1.webp","W":973,"H":1792,"p":[{"id":"25n1p2-1.a.i","l":"(a)(i)","m":2,"y":44,"h":493,"a":"P has 15 electrons: 1s² 2s² 2p⁶ 3s² 3p³\n1s: ↑↓ | 2s: ↑↓ | 2p: ↑↓ ↑↓ ↑↓ | 3s: ↑↓ | 3p: ↑ ↑ ↑\nLabel each box. The three 3p electrons go into **separate** orbitals with **parallel spins** (Hund's rule); each full box has opposite spins (Pauli)."},{"id":"25n1p2-1.a.ii","l":"(a)(ii)","m":2,"y":537,"h":455,"a":"**2s**: a **sphere** centred on the origin.\n**2p**: a **dumbbell** (two lobes) along one axis, e.g. 2px along the x axis."}],"c":{"y":0,"h":44},"split":true},{"id":"25n3p2-5-2.2","t":"Nov 2025 TZ3 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/25n3p2-5.webp","W":973,"H":1014,"p":[{"id":"25n3p2-5.c.i","l":"(c)(i)","m":1,"y":194,"h":20,"a":"**[Ar] 3d¹⁰ 4s² 4p⁵**"}],"c":{"y":0,"h":94},"split":true}]}]},{"k":"3","n":"Periodicity","units":[{"k":"3.1","n":"The periodic table","q":[{"id":"22m1-8","t":"May 2022 TZ1 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u3-1.webp","W":973,"H":179,"p":[{"id":"22m1-8","l":"","m":1,"y":0,"h":179,"a":"**C**\nA is Si (metalloid), B is S (non metal), D is Br (non metal).\n[Ne]3s² 3p⁶ 3d³ 4s² has 23 electrons: **vanadium**, a transition metal."}]},{"id":"22m2-8","t":"May 2022 TZ2 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u3-1.webp","W":973,"H":156,"p":[{"id":"22m2-8","l":"","m":1,"y":0,"h":156,"a":"**D**\nPeriod 6 starts with Cs (group 1) and Ba (group 2), then La; group 4 in period 6 is **hafnium, Hf**.\nSe is period 4 group 16, Pb is period 6 group 14, Cr is period 4 group 6."}]},{"id":"22n-7","t":"Nov 2022 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u3-1.webp","W":973,"H":268,"p":[{"id":"22n-7","l":"","m":1,"y":0,"h":268,"a":"**C**\nThe metalloids lie along the staircase line: B, Si, **Ge, As**, Sb, Te. Gallium is a metal."}]},{"id":"23m1-7","t":"May 2023 TZ1 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u3-1.webp","W":973,"H":981,"p":[{"id":"23m1-7","l":"","m":1,"y":0,"h":696,"a":"**D**\nGroups 1 and 2 (left) are the **s block**, groups 13 to 18 (right) the **p block**, the transition metals in the middle the **d block**, and the lanthanoids and actinoids placed below the table the **f block**."}]},{"id":"23m1-8","t":"May 2023 TZ1 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u3-1.webp","W":973,"H":981,"p":[{"id":"23m1-8","l":"","m":1,"y":708,"h":273,"a":"**A**\nThe period number equals the highest occupied main energy level (I). Level n contains n sub levels, so the number of sub levels in the outer shell follows from it too (II).\nThe number of outer (valence) electrons comes from the group number, not the period (III is wrong)."}]},{"id":"23n-9","t":"Nov 2023 Paper 1 · Q9","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u3-1.webp","W":973,"H":184,"p":[{"id":"23n-9","l":"","m":1,"y":0,"h":184,"a":"**A**\nElement 118 is in group 18 at the end of period 7. Element 119 would start period 8 with one electron in a new s orbital (8s¹), so it would be in group 1, like the **alkali metals**."}]},{"id":"24m1-7","t":"May 2024 TZ1 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u3-1.webp","W":973,"H":151,"p":[{"id":"24m1-7","l":"","m":1,"y":0,"h":151,"a":"**D**\nThe actinoids are elements 89 to 103 (Ac to Lr). **Pa, protactinium (91)** is one of them.\nRf is a transition metal (104), Ra is group 2, Pr is a lanthanoid."}]},{"id":"24n-7","t":"Nov 2024 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u3-1.webp","W":973,"H":326,"p":[{"id":"24n-7","l":"","m":1,"y":0,"h":326,"a":"**C**\nI is false: Be (4) uses 2 shells, Mg (12) 3 shells and Ca (20) 4 shells. They are in the same **group**, not the same period.\nII is true: F, Cl and Br are all in group 17 with 7 outer electrons.\nIII is true: the s, p, d and f blocks show which sub level is being filled."}]},{"id":"25m2a-11","t":"May 2025 TZ2 Paper 1A · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u3-1.webp","W":973,"H":393,"p":[{"id":"25m2a-11","l":"","m":1,"y":0,"h":393,"a":"**B**\nThe d block is the central block between groups 2 and 13 (the transition elements). A is the s block, C the p block, D the f block."}]},{"id":"25m3a-11","t":"May 2025 TZ3 Paper 1A · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u3-1.webp","W":973,"H":154,"p":[{"id":"25m3a-11","l":"","m":1,"y":0,"h":154,"a":"**B**\nLu (lutetium, 71) is the last of the lanthanoids, in the f block.\nRa is s block (group 2), Rf is d block (group 4), Nh is p block (group 13)."}]},{"id":"25n3a-11","t":"Nov 2025 TZ3 Paper 1A · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u3-1.webp","W":973,"H":155,"p":[{"id":"25n3a-11","l":"","m":1,"y":0,"h":155,"a":"**A**\nSn (tin, group 14) is a **metal in the p block**.\nTe and At are metalloids/non metals; Cd is a d block metal."}]},{"id":"22m1p2-1-3.1","t":"May 2022 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22m1p2-1.webp","W":973,"H":1876,"p":[{"id":"22m1p2-1.a.ii","l":"(a)(ii)","m":1,"y":40,"h":20,"a":"**s block** (group 2: its outer electrons are in the 3s sub level)."}],"c":{"y":0,"h":20},"split":true},{"id":"24m1p2-5-3.1","t":"May 2024 TZ1 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/24m1p2-5.webp","W":973,"H":83,"p":[{"id":"24m1p2-5.b","l":"(b)","m":1,"y":20,"h":43,"a":"Any one: it is a **poor conductor** of electricity (or heat); it is **brittle**; it has a low melting point; it is dull (not shiny)."}],"split":true}]},{"k":"3.2","n":"Periodic trends","q":[{"id":"22m1-7","t":"May 2022 TZ1 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u3-2.webp","W":973,"H":274,"p":[{"id":"22m1-7","l":"","m":1,"y":0,"h":274,"a":"**D**\nAll three are non metal oxides, which are acidic.\nNO_{2} forms HNO_{2}/HNO_{3}, CO_{2} forms H_{2}CO_{3} and SO_{2} forms H_{2}SO_{3} in water."}]},{"id":"22m2-7","t":"May 2022 TZ2 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u3-2.webp","W":973,"H":430,"p":[{"id":"22m2-7","l":"","m":1,"y":0,"h":430,"a":"**C**\nIn a period, atomic radius decreases from left to right, so X is on the left and Z on the right.\nAcross a period the effective nuclear charge increases (X < Y < Z), so ionization energy increases (X < Y < Z) and oxides change from basic to acidic (X < Y < Z)."}]},{"id":"22n-8","t":"Nov 2022 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u3-2.webp","W":973,"H":164,"p":[{"id":"22n-8","l":"","m":1,"y":0,"h":164,"a":"**A**\nAtomic radius increases down a group (more occupied shells) and decreases across a period (greater nuclear charge, same shell).\nElectronegativity and ionization energy show the opposite pattern. Ionic radius does not simply decrease across a period: it jumps up from the positive ions to the negative ions."}]},{"id":"23m1-11","t":"May 2023 TZ1 Paper 1 · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u3-2.webp","W":973,"H":160,"p":[{"id":"23m1-11","l":"","m":1,"y":0,"h":160,"a":"**C**\nGroup 1 metals are held by metallic bonding: attraction between the metal ions and the delocalized electrons.\nDown the group the **ions get larger**, so the delocalized electrons are further from the nucleus and the attraction is weaker, so less energy is needed to melt the metal."}]},{"id":"23m2-8","t":"May 2023 TZ2 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u3-2.webp","W":973,"H":278,"p":[{"id":"23m2-8","l":"","m":1,"y":0,"h":278,"a":"**B**\nDown group 1, the atomic radius **increases** (more shells) and the outer electron is lost more easily, so **reactivity with water increases**.\nThe melting point **decreases** (weaker metallic bonding as the ions get larger)."}]},{"id":"23n-8","t":"Nov 2023 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u3-2.webp","W":973,"H":164,"p":[{"id":"23n-8","l":"","m":1,"y":0,"h":164,"a":"**B**\nFirst ionization energy and electronegativity both increase across a period and decrease down a group (both depend on how strongly the nucleus attracts outer electrons).\nAtomic radius and metallic character change the opposite way."}]},{"id":"24m1-8","t":"May 2024 TZ1 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u3-2.webp","W":973,"H":174,"p":[{"id":"24m1-8","l":"","m":1,"y":0,"h":174,"a":"**A**\nNa_{2}O is a metal oxide, so it is basic: Na_{2}O + H_{2}O → 2NaOH (pH well above 7).\nP_{4}O_{10}, NO_{2} and CO_{2} are non metal oxides and form acidic solutions."}]},{"id":"24m2-7","t":"May 2024 TZ2 Paper 1 · Q7","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u3-2.webp","W":973,"H":376,"p":[{"id":"24m2-7","l":"","m":1,"y":0,"h":167,"a":"**D**\nP^{3−}, Cl^{−}, K^{+} and Ca^{2+} all have 18 electrons (isoelectronic). The more protons, the more strongly the same electrons are pulled in, so the smaller the ion.\nProtons: Ca 20 > K 19 > Cl 17 > P 15, so radius: **Ca^{2+} < K^{+} < Cl^{−} < P^{3−}**"}]},{"id":"24m2-8","t":"May 2024 TZ2 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u3-2.webp","W":973,"H":376,"p":[{"id":"24m2-8","l":"","m":1,"y":179,"h":197,"a":"**A**\nOxides across period 3 go from basic to acidic. **MgO** is basic: MgO + H_{2}O → Mg(OH)_{2} (alkaline).\nAl_{2}O_{3} is amphoteric and insoluble, SiO_{2} is insoluble (weakly acidic), SO_{2} is acidic."}]},{"id":"24n-8","t":"Nov 2024 Paper 1 · Q8","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u3-2.webp","W":973,"H":173,"p":[{"id":"24n-8","l":"","m":1,"y":0,"h":173,"a":"**D**\nP_{4}O_{6} is a non metal oxide, so it is acidic: P_{4}O_{6} + 6H_{2}O → 4H_{3}PO_{3} (pH < 7).\nNa_{2}O and MgO are basic; Al_{2}O_{3} is amphoteric and insoluble."}]},{"id":"25m1a-14","t":"May 2025 TZ1 Paper 1A · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u3-2.webp","W":973,"H":565,"p":[{"id":"25m1a-14","l":"","m":1,"y":0,"h":200,"a":"**A**\nFor the same element, adding electrons (with the same nuclear charge) increases repulsion and size; removing electrons makes the species smaller.\nGe^{4+} (fewest electrons) < Ge^{2+} < Ge (atom) < Ge^{4−} (most electrons)."}]},{"id":"25m1a-15","t":"May 2025 TZ1 Paper 1A · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u3-2.webp","W":973,"H":565,"p":[{"id":"25m1a-15","l":"","m":1,"y":212,"h":168,"a":"**A**\nAcross period 3 the **nuclear charge increases** while the electrons enter the same shell (shielding stays about the same). The outer electrons are held more strongly, so the first ionization energy generally increases."}]},{"id":"25m1a-16","t":"May 2025 TZ1 Paper 1A · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u3-2.webp","W":973,"H":565,"p":[{"id":"25m1a-16","l":"","m":1,"y":392,"h":173,"a":"**B**\nGroup 1 metals get **more reactive down the group** (the outer electron is lost more easily), so K is more reactive than Na.\nHalogens get **more reactive up the group** (they gain an electron more easily), so Cl_{2} is more reactive than Br_{2}.\nMost vigorous: **K and Cl_{2}**."}]},{"id":"25m2a-12","t":"May 2025 TZ2 Paper 1A · Q12","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u3-2.webp","W":973,"H":192,"p":[{"id":"25m2a-12","l":"","m":1,"y":0,"h":192,"a":"**D**\nAcross a period electrons are added to the same shell, so shielding hardly changes, but group 17 atoms have **more protons**. The greater nuclear charge holds the outer electrons more strongly, so more energy is needed to remove one."}]},{"id":"25m3a-13","t":"May 2025 TZ3 Paper 1A · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u3-2.webp","W":973,"H":156,"p":[{"id":"25m3a-13","l":"","m":1,"y":0,"h":156,"a":"**B**\nGroup 1 reactivity increases down the group, so Li is the least reactive metal here.\nHalogen reactivity decreases down the group, so I_{2} is the least reactive halogen.\nLeast vigorous: **lithium and iodine**."}]},{"id":"25n1a-14","t":"Nov 2025 TZ1 Paper 1A · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u3-2.webp","W":973,"H":606,"p":[{"id":"25n1a-14","l":"","m":1,"y":0,"h":606,"a":"**A**\nThe large drop from B to C is the change from a **noble gas** (B, very high IE) to an **alkali metal** (C, very low IE). D is then a group 2 metal.\nSo A is in group 17, a halogen such as Cl, which is a non metal forming **acidic oxides**."}]},{"id":"25n3a-13","t":"Nov 2025 TZ3 Paper 1A · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u3-2.webp","W":973,"H":171,"p":[{"id":"25n3a-13","l":"","m":1,"y":0,"h":171,"a":"**A**\nAcross period 3 the oxides change from basic to acidic. MgO (metal oxide) is basic; Al_{2}O_{3} is amphoteric; SiO_{2} and SO_{3} are acidic."}]},{"id":"25n3b-1-3.2","t":"Nov 2025 TZ3 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25n3b-1.webp","W":973,"H":722,"p":[{"id":"25n3b-1.a","l":"(a)","m":1,"y":599,"h":43,"a":"From the data booklet: scandium has an atomic radius of **159 pm** and a first ionization energy of **633 kJ mol^{−1}**. Mark a cross at (159, 633) on the graph (it sits among the period 4 points)."},{"id":"25n3b-1.b","l":"(b)","m":1,"y":642,"h":20,"a":"The smaller the atom, the **closer the outer electron is to the nucleus** (and the less it is shielded relative to the nuclear charge), so it is **attracted more strongly** and more energy is needed to remove it."},{"id":"25n3b-1.c.i","l":"(c)(i)","m":1,"y":682,"h":20,"a":"A **negative (inverse) correlation**: as atomic radius increases, first ionization energy decreases (not a straight line, so not directly proportional).","g":"(c)"
