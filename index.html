:[{"id":"25n3a-16","l":"","m":1,"y":0,"h":397,"a":"**B**\nTarget: S + 1½O_{2} → SO_{3}\nUse the first equation once (S → SO_{2}, x) and half of the second (SO_{2} + ½O_{2} → SO_{3}, ½y).\nΔH = **x + ½y**"}]},{"id":"22m1p2-2-5.2","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.d.ii","l":"(d)(ii)","m":1,"y":943,"h":91,"a":"2 mol NH_{3} are formed: ΔH = 2 × (−46.2) = **−92.4 kJ**","g":"(d)"}],"c":{"y":0,"h":21},"ps":{"(d)":{"y":856,"h":44}},"split":true},{"id":"22np2-1-5.2","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.f.iii","l":"(f)(iii)","m":2,"y":1082,"h":127,"a":"ΔH = ΣΔHf(products) − ΣΔHf(reactants)\n= [82 + 2(−285.8)] − (−366)\n= 82 − 571.6 + 366 = **−124 kJ** (per mol NH_{4}NO_{3})","g":"(f)"}],"c":{"y":0,"h":21},"ps":{"(f)":{"y":962,"h":20}},"split":true},{"id":"23m1p2-6-5.2","t":"May 2023 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m1p2-6.webp","W":973,"H":1377,"p":[{"id":"23m1p2-6.a.i","l":"(a)(i)","m":1,"y":20,"h":190,"a":"SO_{2} + ½O_{2} → SO_{3}\nΔH = ΔHf(SO_{3}) − ΔHf(SO_{2}) = −395.8 − (−296.8) = **−99.0 kJ mol^{−1}** (O_{2} is an element, ΔHf = 0)"}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-2-5.2","t":"May 2023 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m2p2-2.webp","W":973,"H":1011,"p":[{"id":"23m2p2-2.a.iii","l":"(a)(iii)","m":1,"y":204,"h":201,"a":"ΔH = ΣΔHf(products) − ΣΔHf(reactants) = 2(33.18) − 9.16 = **+57.2 kJ mol^{−1}**","g":"(a)"}],"c":{"y":0,"h":44},"ps":{"(a)":{"y":44,"h":59}},"split":true},{"id":"23np2-4-5.2","t":"Nov 2023 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/23np2-4.webp","W":973,"H":872,"p":[{"id":"23np2-4.a","l":"(a)","m":2,"y":58,"h":164,"a":"ΔH = ΣΔHf(products) − ΣΔHf(reactants)\n= [−393.5 + 2(−20.6)] − [88.7 + 2(−241.8)]\n= −434.7 − (−394.9) = **−39.8 kJ** (per mol CS_{2})\n(H_{2}O is a gas here, so use −241.8 kJ mol^{−1.})"}],"c":{"y":0,"h":58},"split":true},{"id":"24m2p2-4-5.2","t":"May 2024 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m2p2-4.webp","W":973,"H":2256,"p":[{"id":"24m2p2-4.c.i","l":"(c)(i)","m":2,"y":253,"h":44,"a":"ΔH = ΣΔHf(products) − ΣΔHf(reactants)\n= [−87.2 + (−74.0)] − (−248)\n= **+86.8 kJ mol^{−1}**\n(using ΔHf CH_{4} = −74.0 and ΔHf propanone(l) = −248 kJ mol^{−1})","g":"(c)"}],"c":{"y":0,"h":131},"ps":{"(c)":{"y":194,"h":59}},"split":true},{"id":"24np2-2-5.2","t":"Nov 2024 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24np2-2.webp","W":973,"H":666,"p":[{"id":"24np2-2.d.i","l":"(d)(i)","m":3,"y":579,"h":47,"a":"ΔH = ΣΔHf(products) − ΣΔHf(reactants) for the equation as written (2 mol K):\n= [2(−481.8) + 0] − [0 + 2(−285.8)] = −963.6 + 571.6 = −392.0 kJ\nPer mol of K: −392.0 / 2 = **−196.0 kJ mol^{−1}**\n(K(s) and H_{2}(g) are elements, ΔHf = 0.)","g":"(d)"}],"c":{"y":0,"h":19},"ps":{"(d)":{"y":521,"h":58}},"split":true}]},{"k":"5.3","n":"Bond enthalpies","q":[{"id":"22m2-13","t":"May 2022 TZ2 Paper 1 · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u5-3.webp","W":973,"H":246,"p":[{"id":"22m2-13","l":"","m":1,"y":0,"h":246,"a":"**C**\nBreaking bonds needs energy: **endothermic, ΔH positive**.\nForming bonds releases energy: **exothermic, ΔH negative**."}]},{"id":"23m2-15","t":"May 2023 TZ2 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u5-3.webp","W":973,"H":172,"p":[{"id":"23m2-15","l":"","m":1,"y":0,"h":172,"a":"**A**\nBond breaking **requires energy** (to overcome the attraction between the atoms), so it is **endothermic**."}]},{"id":"24m1-15","t":"May 2024 TZ1 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u5-3.webp","W":973,"H":184,"p":[{"id":"24m1-15","l":"","m":1,"y":0,"h":184,"a":"**C**\nUsing bond enthalpies: ΔH = Σ(bonds broken) − Σ(bonds formed), and the bonds broken are in the reactants, the bonds formed in the products.\nCorrect versions of the others would be ΔHf: products − reactants; ΔHc: reactants − products."}]},{"id":"24m2-15","t":"May 2024 TZ2 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u5-3.webp","W":973,"H":195,"p":[{"id":"24m2-15","l":"","m":1,"y":0,"h":195,"a":"**B**\nEnergy released forming the product bonds is greater than the energy needed to break the reactant bonds, so ΔH is negative: **exothermic**.\nC has the subtraction the wrong way round (it is bonds broken minus bonds formed), and D is wrong because bond formation releases energy."}]},{"id":"22m1p2-2-5.3","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.d.i","l":"(d)(i)","m":3,"y":900,"h":43,"a":"Bonds broken: N≡N + 3 H–H = 945 + 3(436) = 2253 kJ\nBonds formed: 6 N–H = 6(391) = 2346 kJ\nΔH = broken − formed = 2253 − 2346 = **−93 kJ**","g":"(d)"},{"id":"22m1p2-2.d.iii","l":"(d)(iii)","m":1,"y":1034,"h":58,"a":"Bond enthalpies are **average values** taken from many different compounds, so they are not exact for the bonds in NH_{3} (and they apply to gaseous species).","g":"(d)"}],"c":{"y":0,"h":21},"ps":{"(d)":{"y":856,"h":44}},"split":true},{"id":"22m2p2-4-5.3","t":"May 2022 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22m2p2-4.webp","W":973,"H":1461,"p":[{"id":"22m2p2-4.e.i","l":"(e)(i)","m":3,"y":878,"h":43,"a":"Bonds broken: C–H + Cl–Cl = 414 + 242 = 656 kJ\nBonds formed: C–Cl + H–Cl = 324 + 431 = 755 kJ\nΔH = 656 − 755 = **−99 kJ** (per mol)","g":"(e)"}],"c":{"y":0,"h":20},"ps":{"(e)":{"y":819,"h":59}},"split":true},{"id":"23m2p2-6-5.3","t":"May 2023 TZ2 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m2p2-6.webp","W":973,"H":1170,"p":[{"id":"23m2p2-6.d.ii","l":"(d)(ii)","m":3,"y":484,"h":85,"a":"Bonds broken: 5 C–H + 1 C–C + 1 C–O + 1 O–H + 3 O=O\n= 5(414) + 346 + 358 + 463 + 3(498) = 4731 kJ\nBonds formed: 4 C=O + 6 O–H = 4(804) + 6(463) = 5994 kJ\nΔH = 4731 − 5994 = **−1263 kJ mol^{−1}**"}],"c":{"y":0,"h":59},"split":true},{"id":"23np2-2-5.3","t":"Nov 2023 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23np2-2.webp","W":973,"H":976,"p":[{"id":"23np2-2.c.i","l":"(c)(i)","m":3,"y":179,"h":44,"a":"Bonds broken: 2 C=O (in CO_{2}) + H–H = 2(804) + 436 = 2044 kJ\nBonds formed (in HCOOH): C–H + C=O + C–O + O–H = 414 + 804 + 358 + 463 = 2039 kJ\nΔH = 2044 − 2039 = **+5 kJ** (per mol)\n(The data booklet gives a single value, 804 kJ mol^{−1}, for C=O.)","g":"(c)"}],"c":{"y":0,"h":81},"ps":{"(c)":{"y":159,"h":20}},"split":true},{"id":"25m1p2-6-5.3","t":"May 2025 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/25m1p2-6.webp","W":973,"H":1705,"p":[{"id":"25m1p2-6.d","l":"(d)","m":3,"y":1588,"h":117,"a":"Section 12 of this data booklet is bond enthalpies. Only the bonds that change need counting:\nBonds broken: C=C + one O–H (from H_{2}O) = 614 + 463 = 1077 kJ\nBonds formed: C–C + C–H + C–O = 346 + 414 + 358 = 1118 kJ\nΔH = 1077 − 1118 = **−41 kJ**\n(The 4 C–H bonds of ethene and the other O–H stay the same, so they cancel.)"}],"c":{"y":0,"h":20},"split":true},{"id":"25m2p2-3-5.3","t":"May 2025 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m2p2-3.webp","W":973,"H":1520,"p":[{"id":"25m2p2-3.a.iii","l":"(a)(iii)","m":3,"y":104,"h":81,"a":"CO + Cl_{2} → COCl_{2} (Cl_{2}C=O)\nBonds broken: C≡O + Cl–Cl = 1077 + 242 = 1319 kJ\nBonds formed: C=O + 2 C–Cl = 804 + 2(324) = 1452 kJ\nΔH = 1319 − 1452 = **−133 kJ mol^{−1}**","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":44}},"split":true},{"id":"25n1p2-2-5.3","t":"Nov 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n1p2-2.webp","W":973,"H":1858,"p":[{"id":"25n1p2-2.c.i","l":"(c)(i)","m":3,"y":1525,"h":42,"a":"Section 12 of the data booklet gives bond enthalpies.\nBonds broken: 2 C_{2}H_{6} = 2(C–C + 6 C–H) = 2(346) + 12(414) = 5660; Cl–Cl = 242; 1.5 O=O = 1.5(498) = 747. Total = 6649 kJ\nBonds formed: CH_{3}COOCH_{2}CH_{3} = 8 C–H + 2 C–C + C=O + 2 C–O = 3312 + 692 + 804 + 716 = 5524; 2 H–Cl = 862; H_{2}O 2 O–H = 926. Total = 7312 kJ\nΔH = 6649 − 7312 = **−663 kJ**","g":"(c)"},{"id":"25n1p2-2.c.ii","l":"(c)(ii)","m":1,"y":1567,"h":187,"a":"Bond enthalpies are **average values** for each bond, taken from many compounds and for **gaseous** species, so they are only approximate. The Hess's law value uses **enthalpies of formation of the actual compounds** (here in the liquid state), so it is more accurate. Both calculations are done correctly but on different data.","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(c)":{"y":1449,"h":76}},"split":true}]}]},{"k":"6","n":"Chemical kinetics","units":[{"k":"6.1","n":"Collision theory and rates of reaction","q":[{"id":"22m1-16","t":"May 2022 TZ1 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u6-1.webp","W":973,"H":747,"p":[{"id":"22m1-16","l":"","m":1,"y":0,"h":514,"a":"**B**\nThe acid is in excess, so the amount of CaCO_{3} limits the CO_{2} produced. Doubling the acid concentration does not change the total mass of CO_{2} lost, so the final mass stays the same (about 98.9 g).\nMore concentrated acid means more frequent collisions, so the mass falls faster at the start: curve **B**.\nC and D lose more mass, A is slower."}]},{"id":"22m1-17","t":"May 2022 TZ1 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u6-1.webp","W":973,"H":747,"p":[{"id":"22m1-17","l":"","m":1,"y":526,"h":221,"a":"**A**\nA colorimeter needs a coloured species to appear or disappear.\nCl_{2} + 2KBr → 2KCl + Br_{2}: orange/brown bromine forms, so absorbance changes.\nB: no reaction (Cu is less reactive than Na). C: neutralization, all colourless. D: (CH_{3})_{3}COH is a tertiary alcohol and is not oxidized, so the dichromate stays orange."}]},{"id":"22m2-16","t":"May 2022 TZ2 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u6-1.webp","W":973,"H":809,"p":[{"id":"22m2-16","l":"","m":1,"y":0,"h":195,"a":"**A**\nAt higher pressure there are more gas particles per unit volume, so **collisions are more frequent**. The energy of collisions depends on temperature, which is unchanged, and pressure does not change the activation energy."}]},{"id":"22m2-17","t":"May 2022 TZ2 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u6-1.webp","W":973,"H":809,"p":[{"id":"22m2-17","l":"","m":1,"y":207,"h":602,"a":"**C**\nNeed Ea = 40 kJ mol^{−1} (reactants to peak) and ΔH = −60 kJ mol^{−1} (products 60 lower than reactants).\nC: reactants 100, peak 140 (Ea = 40), products 40 (ΔH = −60).\nA has ΔH = −100; B and D are endothermic."}]},{"id":"22n-16","t":"Nov 2022 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u6-1.webp","W":973,"H":969,"p":[{"id":"22n-16","l":"","m":1,"y":0,"h":718,"a":"**A**\nInitial rate = gradient at t = 0. The first points fall from 1.6 to 1.4 mol dm^{−3} in 2.0 s:\nrate = 0.2 / 2.0 = **0.1 mol dm^{−3} s^{−1}**"}]},{"id":"22n-17","t":"Nov 2022 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u6-1.webp","W":973,"H":969,"p":[{"id":"22n-17","l":"","m":1,"y":730,"h":239,"a":"**A**\nRate increases with **higher temperature** (more particles with E ≥ Ea) and **smaller particle size** (larger surface area). Whether the reaction is exothermic does not matter for rate."}]},{"id":"23m1-16","t":"May 2023 TZ1 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u6-1.webp","W":973,"H":717,"p":[{"id":"23m1-16","l":"","m":1,"y":0,"h":445,"a":"**C**\nThe dotted path has the same reactant and product enthalpies (same ΔH) but a **lower activation energy**: this is the effect of a **catalyst**, which provides an alternative pathway."}]},{"id":"23m1-17","t":"May 2023 TZ1 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u6-1.webp","W":973,"H":717,"p":[{"id":"23m1-17","l":"","m":1,"y":457,"h":260,"a":"**A**\nThe average kinetic energy of the particles is directly proportional to the absolute temperature (kelvin). Doubling T **doubles** the average kinetic energy. (The speed increases by √2, not 2.)"}]},{"id":"23m2-16","t":"May 2023 TZ2 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u6-1.webp","W":973,"H":1962,"p":[{"id":"23m2-16","l":"","m":1,"y":0,"h":603,"a":"**B**\nCurve Y is **slower** at first but finally gives **more** oxygen.\nAdding 0.1 mol dm^{−3} H_{2}O_{2} adds more peroxide (more O_{2} in total) but lowers the overall concentration (slower rate).\n2.0 mol dm^{−3} would be faster as well as giving more O_{2}; water gives the same total; no catalyst gives the same total."}]},{"id":"23m2-17","t":"May 2023 TZ2 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u6-1.webp","W":973,"H":1962,"p":[{"id":"23m2-17","l":"","m":1,"y":615,"h":515,"a":"**A**\nA catalyst lowers the activation energy for both the forward reaction (I) and the reverse reaction (II).\nIt does **not** change ΔH (III), because the reactants and products are the same."}]},{"id":"23m2-29","t":"May 2023 TZ2 Paper 1 · Q29","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u6-1.webp","W":973,"H":1962,"p":[{"id":"23m2-29","l":"","m":1,"y":1142,"h":820,"a":"**B**\nAverage rate = change in concentration / time\n= (0.10 − 0.02) / 800 = 0.08 / 800 = **1 × 10^{−4} mol dm^{−3} s^{−1}**"}]},{"id":"23n-17","t":"Nov 2023 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u6-1.webp","W":973,"H":196,"p":[{"id":"23n-17","l":"","m":1,"y":0,"h":196,"a":"**C**\nA catalyst provides an alternative pathway with a lower activation energy. One way some catalysts do this is by holding molecules on their surface so that more collisions happen in the **correct orientation**.\nA catalyst does not change collision frequency or collision energy (that depends on temperature), and it does not change the energy distribution of the molecules."}]},{"id":"24m1-16","t":"May 2024 TZ1 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u6-1.webp","W":973,"H":519,"p":[{"id":"24m1-16","l":"","m":1,"y":0,"h":192,"a":"**D**\nAdding water dilutes the acid, so there are fewer H^{+} ions per unit volume and **fewer collisions per second**.\nA longer ribbon gives more surface; warming or cutting the ribbon speed the reaction up."}]},{"id":"24m1-17","t":"May 2024 TZ1 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u6-1.webp","W":973,"H":519,"p":[{"id":"24m1-17","l":"","m":1,"y":204,"h":315,"a":"**A**\nH^{+} ions form, so the **pH falls** (I), and ions are produced from neutral molecules, so the **conductivity rises** (II).\nNo gas is released, so the mass does not change (III cannot be used)."}]},{"id":"24m2-16","t":"May 2024 TZ2 Paper 1 · Q16","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u6-1.webp","W":973,"H":1346,"p":[{"id":"24m2-16","l":"","m":1,"y":0,"h":196,"a":"**B**\nHigh temperature and pressure give frequent, energetic collisions, so if the rate is still low the **activation energy must be high**, meaning strong bonds in the reactants have to be broken."}]},{"id":"24m2-17","t":"May 2024 TZ2 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u6-1.webp","W":973,"H":1346,"p":[{"id":"24m2-17","l":"","m":1,"y":208,"h":1138,"a":"**C**\nCaCO_{3} is in excess, so the HCl is limiting. With half the volume (half the moles) of acid, only **half the CO_{2}** is produced, so the final mass loss is half of curve I.\nThe acid concentration and the CaCO_{3} pieces are the same, so the **initial rate is the same**: the curve starts along curve I, then levels off at half the drop."}]},{"id":"24n-15","t":"Nov 2024 Paper 1 · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u6-1.webp","W":973,"H":1118,"p":[{"id":"24n-15","l":"","m":1,"y":0,"h":615,"a":"**B**\nAt the higher temperature T_{1} the curve is **flatter and shifted to the right** (more molecules with high energy, lower peak), with the same area under both curves.\nAt the lower temperature T_{2} the peak is **higher and further left**. Only B shows this."}]},{"id":"24n-17","t":"Nov 2024 Paper 1 · Q17","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u6-1.webp","W":973,"H":1118,"p":[{"id":"24n-17","l":"","m":1,"y":627,"h":491,"a":"**A**\nMg is in excess, so the amount of HCl decides how much H_{2} is lost. Line 2 has a **smaller total mass loss** and a **slower** rate.\nMore dilute HCl contains fewer moles of acid (less H_{2}) and gives fewer collisions per second (slower).\nRibbon would be slower but give the same mass loss; higher temperature or more Mg would be faster."}]},{"id":"25m1a-22","t":"May 2025 TZ1 Paper 1A · Q22","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u6-1.webp","W":973,"H":1396,"p":[{"id":"25m1a-22","l":"","m":1,"y":0,"h":871,"a":"**A**\nAt a lower temperature fewer particles have high energy: the peak is **higher and moves to the left**, with the tail lower, while the area (total number of particles) stays the same.\nThe **activation energy does not change** with temperature, so the Ea line stays at the same energy.\nB moves Ea; C and D are flattened (that is a higher temperature)."}]},{"id":"25m1a-23","t":"May 2025 TZ1 Paper 1A · Q23","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u6-1.webp","W":973,"H":1396,"p":[{"id":"25m1a-23","l":"","m":1,"y":883,"h":513,"a":"**A**\nAt 20 s the volume of gas is 40 cm³.\nAverage rate = 40 / 20 = **2.0 cm³ s^{−1}**"}]},{"id":"25m2a-19","t":"May 2025 TZ2 Paper 1A · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u6-1.webp","W":973,"H":675,"p":[{"id":"25m2a-19","l":"","m":1,"y":0,"h":161,"a":"**C**\nRate = change in concentration / time, so its units are concentration per unit time: **mol dm^{−3} h^{−1}** (h is hours).\nA has no volume and time is multiplied, B has no amount, D multiplies by time."}]},{"id":"25m2a-20","t":"May 2025 TZ2 Paper 1A · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u6-1.webp","W":973,"H":675,"p":[{"id":"25m2a-20","l":"","m":1,"y":173,"h":318,"a":"**A**\nA catalyst (I) lowers the activation energy, and a higher concentration (II) gives more frequent collisions.\nThe reactant H_{2}O_{2} is in solution, not a gas, so pressure (III) has no effect on the rate."}]},{"id":"25m2a-21","t":"May 2025 TZ2 Paper 1A · Q21","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u6-1.webp","W":973,"H":675,"p":[{"id":"25m2a-21","l":"","m":1,"y":503,"h":172,"a":"**B**\nAt a higher temperature particles have more kinetic energy, so a **greater proportion of collisions have energy ≥ Ea** (and they collide more often).\nOrientation and the activation energy are not changed by temperature."}]},{"id":"25m3a-19","t":"May 2025 TZ3 Paper 1A · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u6-1.webp","W":973,"H":314,"p":[{"id":"25m3a-19","l":"","m":1,"y":0,"h":314,"a":"**A**\nHCl is used up, so the **pH rises** (pH meter, I). CO_{2} gas is given off, so its volume can be collected in a **gas syringe** (II).\nAll the substances are colourless, so a colorimeter would show no change (III)."}]},{"id":"25n1a-22","t":"Nov 2025 TZ1 Paper 1A · Q22","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u6-1.webp","W":973,"H":706,"p":[{"id":"25n1a-22","l":"","m":1,"y":0,"h":520,"a":"**A**\nOriginal: 0.100 × 1.0 = 0.100 mol HCl. New: 0.200 × 0.25 = 0.050 mol HCl.\nCaCO_{3} is in excess, so half the HCl gives **half the CO_{2}**.\nThe acid is also 4 times more dilute, so the rate is **slower** than the dotted line. Only A finishes at half the volume and is slower."}]},{"id":"25n1a-23","t":"Nov 2025 TZ1 Paper 1A · Q23","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u6-1.webp","W":973,"H":706,"p":[{"id":"25n1a-23","l":"","m":1,"y":532,"h":174,"a":"**D**\nTwo H atoms (radicals) joining only **forms** a bond and needs no bond to be broken first, so its activation energy is essentially zero.\nA, B and C all require a bond to be broken."}]},{"id":"25n3a-19","t":"Nov 2025 TZ3 Paper 1A · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u6-1.webp","W":973,"H":1224,"p":[{"id":"25n3a-19","l":"","m":1,"y":0,"h":710,"a":"**D**\nH_{2} is used up **twice as fast** as C_{2}H_{2} (2 mol H_{2} per mol C_{2}H_{2}), so its volume falls more steeply and drops further below the C_{2}H_{2} line."}]},{"id":"25n3a-20","t":"Nov 2025 TZ3 Paper 1A · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u6-1.webp","W":973,"H":1224,"p":[{"id":"25n3a-20","l":"","m":1,"y":722,"h":318,"a":"**A**\nHigher temperature (I): more frequent and more energetic collisions.\nHigher pressure (II): gases more concentrated, so more frequent collisions.\nLarger volume (III) lowers the concentration and slows the reaction."}]},{"id":"25n3a-21","t":"Nov 2025 TZ3 Paper 1A · Q21","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u6-1.webp","W":973,"H":1224,"p":[{"id":"25n3a-21","l":"","m":1,"y":1052,"h":172,"a":"**D**\nA catalyst provides an **alternative pathway (mechanism)** with a lower activation energy.\nIt does not change the kinetic energy of particles, it is not used up, and it speeds up the forward and reverse reactions equally."}]},{"id":"25m2b-3-6.1","t":"May 2025 TZ2 Paper 1B · Q3","s":"Data based questions (Paper 1B)","img":"q/25m2b-3.webp","W":973,"H":858,"p":[{"id":"25m2b-3.a.i","l":"(a)(i)","m":2,"y":594,"h":47,"a":"Mass is lost because CO_{2} escapes, so the rate of CO_{2} release = −gradient of the mass–time curve.\nDraw a **tangent** to the 1.5 mol dm^{−3} curve at t = 0 and find its gradient.\nThe tangent falls from about 9.1 g to about 4.5 g in about 5 s:\nrate ≈ (9.1 − 4.5) / 5 ≈ **0.9 g s^{−1}** (values of roughly 0.8 to 1.2 g s^{−1} come from a reasonable tangent).","g":"(a)"},{"id":"25m2b-3.a.ii","l":"(a)(ii)","m":1,"y":641,"h":46,"a":"For 0.5 mol dm^{−3}: mass falls from about 9.4 g at 0 s to about 8.15 g at 20 s.\nAverage rate = (9.4 − 8.15) / 20 = **0.06 g s^{−1}**","g":"(a)"}],"c":{"y":0,"h":91},"ps":{"(a)":{"y":91,"h":503}},"split":true},{"id":"22m1p2-3-6.1","t":"May 2022 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m1p2-3.webp","W":973,"H":1211,"p":[{"id":"22m1p2-3.f.ii","l":"(f)(ii)","m":2,"y":1127,"h":20,"a":"- The particles must collide with energy **equal to or greater than the activation energy**.\n- They must collide with the **correct orientation** (geometry).","g":"(f)"}],"c":{"y":0,"h":20},"ps":{"(f)":{"y":1047,"h":60}},"split":true},{"id":"22m2p2-3-6.1","t":"May 2022 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m2p2-3.webp","W":973,"H":992,"p":[{"id":"22m2p2-3.a","l":"(a)","m":2,"y":62,"h":20,"a":"A catalyst **increases the rate** of reaction (and is not used up). It provides an **alternative pathway with a lower activation energy**, so a larger proportion of particles have energy ≥ Ea when they collide.\n(It does not change ΔH or the position of equilibrium.)"},{"id":"22m2p2-3.b.i","l":"(b)(i)","m":3,"y":102,"h":536,"a":"- Both curves start at the **origin** and approach (but do not touch) the energy axis at high energy.\n- The T_{2} curve (higher temperature) has a **lower peak shifted to higher energy** and a higher tail.\n- The **areas under both curves are equal** (same number of particles).","g":"(b)"}],"c":{"y":0,"h":62},"ps":{"(b)":{"y":82,"h":20}},"split":true},{"id":"22np2-2-6.1","t":"Nov 2022 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22np2-2.webp","W":973,"H":1733,"p":[{"id":"22np2-2.e.iii","l":"(e)(iii)","m":1,"y":1145,"h":545,"a":"Draw two vertical lines on the energy axis to the right of the peak: the **catalysed Ea** at a **lower** kinetic energy and the **uncatalysed Ea** further to the right (higher energy).","g":"(e)"},{"id":"22np2-2.e.iv","l":"(e)(iv)","m":1,"y":1690,"h":43,"a":"A catalyst lowers the activation energy, so a **larger proportion of particles** (a larger area under the curve to the right of Ea) have energy ≥ Ea. More collisions are successful, so the rate increases.","g":"(e)"}],"c":{"y":0,"h":375},"ps":{"(e)":{"y":479,"h":284}},"split":true},{"id":"22np2-5-6.1","t":"Nov 2022 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/22np2-5.webp","W":973,"H":794,"p":[{"id":"22np2-5.c","l":"(c)","m":2,"y":161,"h":570,"a":"Any two: the **volumes** of both solutions (total volume / depth of liquid), the **same flask** and the same **mark** (size and darkness), the same observer and viewing position, the same concentration of HCl."}],"c":{"y":0,"h":20},"split":true},{"id":"23m1p2-2-6.1","t":"May 2023 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m1p2-2.webp","W":973,"H":2486,"p":[{"id":"23m1p2-2.d.iii","l":"(d)(iii)","m":1,"y":1786,"h":20,"a":"A catalyst provides an **alternative reaction pathway with a lower activation energy** (and is not used up)."},{"id":"23m1p2-2.d.iv","l":"(d)(iv)","m":2,"y":1806,"h":660,"a":"- A Maxwell–Boltzmann curve starting at the origin, rising to a peak and tailing off towards (but not touching) the energy axis.\n- Two Ea lines marked on the energy axis to the right of the peak: **Ea (with catalyst)** at lower energy and **Ea (without catalyst)** at higher energy."},{"id":"23m1p2-2.d.v","l":"(d)(v)","m":1,"y":2466,"h":20,"a":"Measure the **pressure** at constant volume: it decreases as 4 mol of gas become 2 mol. (Or measure the change in volume at constant pressure, or test the pH of samples as NH_{3} forms.)"}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-6-6.1","t":"May 2023 TZ2 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m2p2-6.webp","W":973,"H":1170,"p":[{"id":"23m2p2-6.a","l":"(a)","m":2,"y":59,"h":20,"a":"Any suitable method with how it is measured over time, e.g.\n- collect the CO_{2} in a **gas syringe** and record the **volume against time**; or\n- measure the **loss of mass** (CO_{2} escapes) with a balance at regular intervals; or\n- follow the fading of the **orange/brown Br_{2} colour** with a colorimeter; or\n- measure the increase in **conductivity** as HBr ions form."},{"id":"23m2p2-6.b","l":"(b)","m":2,"y":79,"h":42,"a":"A catalyst provides an **alternative pathway with a lower activation energy**. A greater proportion of particles then have energy ≥ Ea, so there are **more successful collisions per unit time**."}],"c":{"y":0,"h":59},"split":true},{"id":"23np2-2-6.1","t":"Nov 2023 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23np2-2.webp","W":973,"H":976,"p":[{"id":"23np2-2.e.i","l":"(e)(i)","m":3,"y":370,"h":542,"a":"- Products (HCOOH) drawn **higher** than the reactants (CO_{2} + H_{2}), since ΔH is positive; label the vertical difference **ΔH**.\n- Uncatalysed curve with a tall hump, labelled **Ea (uncatalysed)** from reactants to the top.\n- Catalysed curve with a **lower hump** between the same start and end levels, labelled **Ea (catalysed)**.","g":"(e)"},{"id":"23np2-2.e.ii","l":"(e)(ii)","m":1,"y":912,"h":44,"a":"Increase the **pressure** (or the concentration of the gases), which increases the frequency of collisions. (A larger catalyst surface area would also work.)","g":"(e)"}],"c":{"y":0,"h":81},"ps":{"(e)":{"y":326,"h":44}},"split":true},{"id":"24m1p2-3-6.1","t":"May 2024 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24m1p2-3.webp","W":973,"H":570,"p":[{"id":"24m1p2-3.c","l":"(c)","m":3,"y":124,"h":402,"a":"- Draw a second curve for the higher temperature: **flatter, with its peak lower and shifted to higher energy**, same area under the curve.\n- Mark Ea on the energy axis: the **area under the curve beyond Ea is larger** at the higher temperature.\nExplanation: at higher temperature a **greater proportion of particles have energy ≥ Ea**, and particles also collide more frequently, so there are **more successful collisions per unit time**."},{"id":"24m1p2-3.d","l":"(d)","m":1,"y":526,"h":44,"a":"Mark a second, **lower activation energy** (Ea catalysed) to the **left** of the original Ea. The distribution curve itself does not change."}],"c":{"y":0,"h":61},"split":true},{"id":"24m2p2-5-6.1","t":"May 2024 TZ2 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/24m2p2-5.webp","W":973,"H":1499,"p":[{"id":"24m2p2-5.a","l":"(a)","m":1,"y":418,"h":20,"a":"The calculated value is an **average rate** over the whole 110 s. The rate is fastest at the start and decreases as the dye is used up, so the average is lower than the initial rate."},{"id":"24m2p2-5.b.i","l":"(b)(i)","m":3,"y":1283,"h":196,"a":"Initial [RCl]: read from the graph at t = 0: **6.00 × 10^{−6} mol dm^{−3}**\nInitial rate: draw a **tangent** at t = 0 and find its gradient: the tangent falls about 6 × 10^{−6} mol dm^{−3} in about 95 s, giving **about 6.4 × 10^{−8} mol dm^{−3} s^{−1}**.\nJustification: this is double experiment 1 (3.20 × 10^{−8}), which has half the [RCl] and the same [OH^{−}], so doubling [RCl] doubles the rate.","g":"(b)"},{"id":"24m2p2-5.b.ii","l":"(b)(ii)","m":1,"y":1479,"h":20,"a":"As the reaction proceeds the reactants are used up, so their **concentration decreases**: there are **fewer collisions per unit time** (fewer successful collisions), so the rate falls.","g":"(b)"}],"c":{"y":0,"h":418},"ps":{"(b)":{"y":438,"h":845}},"split":false},{"id":"24np2-3-6.1","t":"Nov 2024 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24np2-3.webp","W":973,"H":1634,"p":[{"id":"24np2-3.d.ii","l":"(d)(ii)","m":2,"y":1293,"h":20,"a":"At higher temperature particles have more kinetic energy, so a **greater proportion have energy ≥ Ea** and they also **collide more frequently**. Both increase the number of successful collisions per unit time.","g":"(d)"},{"id":"24np2-3.d.iii","l":"(d)(iii)","m":2,"y":1313,"h":43,"a":"A catalyst provides an **alternative pathway with a lower activation energy**, so a **greater proportion of collisions have energy ≥ Ea**, increasing the frequency of successful collisions.","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":645,"h":64}},"split":true},{"id":"25m1p2-3-6.1","t":"May 2025 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m1p2-3.webp","W":973,"H":687,"p":[{"id":"25m1p2-3.d","l":"(d)","m":1,"y":170,"h":517,"a":"A curve that is **steeper at the start** (faster rate) but levels off at the **same final volume** of gas (the amount of limiting reactant is unchanged), reaching it sooner."}],"c":{"y":0,"h":46},"split":true},{"id":"25m1p2-4-6.1","t":"May 2025 TZ1 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m1p2-4.webp","W":973,"H":921,"p":[{"id":"25m1p2-4.a.i","l":"(a)(i)","m":2,"y":106,"h":20,"a":"The catalyst provides an **alternative reaction pathway with a lower activation energy**, so a **greater proportion of particles have energy ≥ Ea**, giving more successful collisions per unit time.","g":"(a)"}],"c":{"y":0,"h":44},"ps":{"(a)":{"y":44,"h":62}},"split":true},{"id":"25m2p2-3-6.1","t":"May 2025 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m2p2-3.webp","W":973,"H":1520,"p":[{"id":"25m2p2-3.b.i","l":"(b)(i)","m":1,"y":835,"h":20,"a":"Any one: measure the **change in pH** (HCl forms), the change in **conductivity**, or the increase in **pressure** at constant volume (2 mol gas become 3 mol), over time.","g":"(b)"},{"id":"25m2p2-3.b.ii","l":"(b)(ii)","m":2,"y":855,"h":44,"a":"For a reaction, particles must collide with **energy ≥ the activation energy** and with the **correct orientation**. Collisions with too little energy, or the wrong orientation, do not lead to reaction.","g":"(b)"},{"id":"25m2p2-3.b.iii","l":"(b)(iii)","m":1,"y":899,"h":534,"a":"Draw a second curve starting at the origin that is **flatter, with a lower peak shifted to higher energy**, and with a higher tail at high energy (same area under the curve).","g":"(b)"},{"id":"25m2p2-3.b.iv","l":"(b)(iv)","m":2,"y":1433,"h":44,"a":"Mark Ea on the energy axis. At the higher temperature the **area under the curve beyond Ea is larger**, so a **greater proportion of particles have energy ≥ Ea**. Particles also move faster and collide more often. So there are more successful collisions per unit time.","g":"(b)"},{"id":"25m2p2-3.b.v","l":"(b)(v)","m":2,"y":1477,"h":43,"a":"- The **rate of reaction increases** (e.g. gas or HCl is produced faster) when the solid is added.\n- The solid is **unchanged at the end**: same mass (recovered and weighed) and same chemical identity.","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":777,"h":58}},"split":true},{"id":"25m3p2-4-6.1","t":"May 2025 TZ3 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m3p2-4.webp","W":973,"H":815,"p":[{"id":"25m3p2-4.d.iii","l":"(d)(iii)","m":3,"y":772,"h":43,"a":"- At higher temperature the particles have **more kinetic energy**, so they move faster and **collide more frequently**.\n- A **greater proportion of collisions have energy ≥ Ea** (the Maxwell–Boltzmann curve shifts to higher energy).\n- So there are **more successful collisions per unit time**, and the rate increases.","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":333,"h":20}},"split":true},{"id":"25n1p2-2-6.1","t":"Nov 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n1p2-2.webp","W":973,"H":1858,"p":[{"id":"25n1p2-2.b.iv","l":"(b)(iv)","m":2,"y":1136,"h":77,"a":"A catalyst provides an **alternative pathway with a lower activation energy**, so a **greater proportion of particles have energy ≥ Ea** and the rate increases. It is not used up and does not change the position of equilibrium.","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":338,"h":58}},"split":true},{"id":"25n1p2-3-6.1","t":"Nov 2025 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25n1p2-3.webp","W":973,"H":873,"p":[{"id":"25n1p2-3.b.i","l":"(b)(i)","m":2,"y":226,"h":584,"a":"- Draw a Maxwell–Boltzmann curve: starts at the origin, rises to a peak, then a long tail approaching (not touching) the x axis.\n- Mark **Ea (with catalyst)** at a lower energy and **Ea (without catalyst)** at a higher energy, both to the right of the peak."},{"id":"25n1p2-3.b.ii","l":"(b)(ii)","m":1,"y":810,"h":63,"a":"Room temperature is lower than 60 °C, so the second curve has a **higher peak shifted to lower energy** (to the left), with a smaller tail at high energy, and the same area under the curve."}],"c":{"y":0,"h":61},"split":true},{"id":"25n3p2-3-6.1","t":"Nov 2025 TZ3 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25n3p2-3.webp","W":973,"H":3347,"p":[{"id":"25n3p2-3.b","l":"(b)","m":3,"y":267,"h":729,"a":"- Products (styrene + H_{2}) drawn **higher** than the reactant (ethylbenzene): endothermic, label the upward difference **ΔH**.\n- Uncatalysed path with a tall hump: label **Ea** from the reactant level to its top.\n- Catalysed path with a **lower** hump between the same start and end levels: label **Ea (catalysed)**."},{"id":"25n3p2-3.c.i","l":"(c)(i)","m":1,"y":996,"h":554,"a":"The 298 K curve has a **higher peak located at lower energy** (to the left of the 900 K peak), falls more steeply, and has a **lower tail** at high energy; the area under both curves is the same."},{"id":"25n3p2-3.c.ii","l":"(c)(ii)","m":1,"y":1550,"h":21,"a":"Draw a vertical line labelled **Ea** on the kinetic energy axis, well to the right of both peaks (in the tail region)."},{"id":"25n3p2-3.c.iii","l":"(c)(iii)","m":2,"y":1571,"h":44,"a":"At the lower temperature the **area under the curve to the right of Ea is much smaller**, so a **smaller proportion of particles have energy ≥ Ea**. The particles also collide less often. So there are fewer successful collisions per unit time and the rate falls."}],"c":{"y":0,"h":165},"split":true}]}]},{"k":"7","n":"Equilibrium","units":[{"k":"7.1","n":"Equilibrium","q":[{"id":"22m1-18","t":"May 2022 TZ1 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u7-1.webp","W":973,"H":302,"p":[{"id":"22m1-18","l":"","m":1,"y":0,"h":302,"a":"**D**\nReversing the reaction inverts K: ICl ⇌ ½Cl_{2} + ½I_{2} has K = 1/454.\nDoubling the coefficients squares K: 2ICl ⇌ Cl_{2} + I_{2} has K = (1/454)² = **1/454²**."}]},{"id":"22m2-18","t":"May 2022 TZ2 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u7-1.webp","W":973,"H":216,"p":[{"id":"22m2-18","l":"","m":1,"y":0,"h":216,"a":"**B**\nC + 2D ⇌ A + 2B is the reverse of the given reaction with all coefficients halved.\nReverse: K = 1 / 4.0 = 0.25. Halving the coefficients takes the square root: K = √0.25 = **0.50**"}]},{"id":"22n-18","t":"Nov 2022 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u7-1.webp","W":973,"H":216,"p":[{"id":"22n-18","l":"","m":1,"y":0,"h":216,"a":"**B**\nThe forward reaction is exothermic, so raising the temperature decreases K.\nAt the instant the temperature rises the concentrations have not changed, so Q is unchanged and now **Q > K**.\nThe system reduces Q by shifting **left, towards reactants**."}]},{"id":"23m1-18","t":"May 2023 TZ1 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u7-1.webp","W":973,"H":191,"p":[{"id":"23m1-18","l":"","m":1,"y":0,"h":191,"a":"**A**\nQ = [products] / [reactants]. The **smallest Q** means the smallest proportion of products, so 4.9 × 10^{−3.}"}]},{"id":"23m2-18","t":"May 2023 TZ2 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u7-1.webp","W":973,"H":204,"p":[{"id":"23m2-18","l":"","m":1,"y":0,"h":204,"a":"**C**\nAdding NaCl increases [Cl^{−}], so the equilibrium shifts **right** to use up some of the extra Cl^{−.}\nRemoving a solid does not change the position; adding water dilutes the ions (shifts left); pressure has no effect (no gases)."}]},{"id":"23n-18","t":"Nov 2023 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u7-1.webp","W":973,"H":196,"p":[{"id":"23n-18","l":"","m":1,"y":0,"h":196,"a":"**B**\nIncreasing pressure shifts the equilibrium to the side with **fewer moles of gas**.\nB: 1 mol gas (H_{2}O) on the left, 2 mol gas (CO + H_{2}) on the right, so it shifts **left**. (C is solid and does not count.)\nA has 2 and 2 (no shift); C and D have fewer gas moles on the right (shift right)."}]},{"id":"24m1-18","t":"May 2024 TZ1 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u7-1.webp","W":973,"H":259,"p":[{"id":"24m1-18","l":"","m":1,"y":0,"h":259,"a":"**B**\n4NO_{2} ⇌ 2N_{2}O_{4} is the given reaction reversed and doubled.\nReverse: K = 1 / 0.0059. Double the coefficients: square it: K = **1 / 0.0059²**"}]},{"id":"24m2-18","t":"May 2024 TZ2 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u7-1.webp","W":973,"H":655,"p":[{"id":"24m2-18","l":"","m":1,"y":0,"h":315,"a":"**C**\nThe forward reaction is exothermic, so **increasing temperature** shifts the equilibrium left (endothermic direction).\nThere are 3 mol gas on the left and 1 mol on the right, so **decreasing pressure** shifts it left (more gas molecules)."}]},{"id":"24m2-19","t":"May 2024 TZ2 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u7-1.webp","W":973,"H":655,"p":[{"id":"24m2-19","l":"","m":1,"y":327,"h":328,"a":"**B**\nThe second reaction is the reverse of the first, so K = 1 / 5."}]},{"id":"24n-18","t":"Nov 2024 Paper 1 · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u7-1.webp","W":973,"H":235,"p":[{"id":"24n-18","l":"","m":1,"y":0,"h":235,"a":"**C**\nThe forward reaction is exothermic, so raising the temperature shifts the equilibrium **left** (endothermic direction).\nLess H_{3}O^{+} is present, so the **pH increases**."}]},{"id":"25m1a-24","t":"May 2025 TZ1 Paper 1A · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u7-1.webp","W":973,"H":318,"p":[{"id":"25m1a-24","l":"","m":1,"y":0,"h":318,"a":"**B**\n2 mol of gas on each side, so pressure has **no effect** on the position.\nThe forward reaction is endothermic (ΔH = +9), so **decreasing the temperature** shifts the equilibrium **left** (exothermic direction).\nOnly B includes a temperature decrease."}]},{"id":"25m2a-22","t":"May 2025 TZ2 Paper 1A · Q22","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u7-1.webp","W":973,"H":618,"p":[{"id":"25m2a-22","l":"","m":1,"y":0,"h":303,"a":"**A**\nThe equilibrium constant for the reverse reaction is the reciprocal: K = **1 / 4.3** (about 0.23)."}]},{"id":"25m2a-23","t":"May 2025 TZ2 Paper 1A · Q23","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u7-1.webp","W":973,"H":618,"p":[{"id":"25m2a-23","l":"","m":1,"y":315,"h":303,"a":"**A**\n3 mol of gas on the left and 2 mol on the right. Doubling the pressure shifts the equilibrium to the side with fewer gas molecules: **right**.\nK only depends on temperature, so it does **not change**."}]},{"id":"25m3a-20","t":"May 2025 TZ3 Paper 1A · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u7-1.webp","W":973,"H":210,"p":[{"id":"25m3a-20","l":"","m":1,"y":0,"h":210,"a":"**C**\nRemoving ethanol (a reactant) makes the equilibrium shift **left** to replace some of it (Le Chatelier).\nRemoving water would shift it right, adding ethanol would shift it right, and adding water would shift it left."}]},{"id":"25n1a-24","t":"Nov 2025 TZ1 Paper 1A · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u7-1.webp","W":973,"H":170,"p":[{"id":"25n1a-24","l":"","m":1,"y":0,"h":170,"a":"**B**\nAt dynamic equilibrium the forward and reverse reactions **are still happening**, at equal rates, so the concentrations stay constant."}]},{"id":"25n3a-22","t":"Nov 2025 TZ3 Paper 1A · Q22","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u7-1.webp","W":973,"H":509,"p":[{"id":"25n3a-22","l":"","m":1,"y":0,"h":227,"a":"**C**\nAt equilibrium, dissolving and crystallization both continue at the same rate (dynamic equilibrium). The concentration and the crystal's mass stay constant, but ions leave one part of the crystal and deposit elsewhere, so its **shape can slowly change**."}]},{"id":"25n3a-23","t":"Nov 2025 TZ3 Paper 1A · Q23","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u7-1.webp","W":973,"H":509,"p":[{"id":"25n3a-23","l":"","m":1,"y":239,"h":270,"a":"**C**\nK = 6.5 × 10^{4} is very large, so the equilibrium lies far to the **right**: the products greatly outweigh the reactants, so **[NOCl] >> [NO]**."}]},{"id":"25m3b-1-7.1","t":"May 2025 TZ3 Paper 1B · Q1","s":"Data based questions (Paper 1B)","img":"q/25m3b-1.webp","W":973,"H":2712,"p":[{"id":"25m3b-1.b","l":"(b)","m":4,"y":496,"h":355,"a":"Measurement 1: **pressure** inside the sealed vessel.\nExpected result: it **decreases** (2 mol of gas form 1 mol of gas) and then becomes **constant** once equilibrium is reached.\nMeasurement 2: **temperature** of the gas mixture.\nExpected result: it **rises** (the forward reaction is exothermic, ΔH = −55.3 kJ mol^{−1}) and then levels off / becomes constant at equilibrium.\n(Any measurable property that stops changing at equilibrium, e.g. density at constant pressure, would also work.)"},{"id":"25m3b-1.c.ii","l":"(c)(ii)","m":1,"y":941,"h":82,"a":"The reading was taken immediately, before the system had time to **reach equilibrium**, so the NO_{2} concentration was still changing (and the mixture may not yet have reached 40 °C).","g":"(c)"},{"id":"25m3b-1.c.iii","l":"(c)(iii)","m":1,"y":1023,"h":20,"a":"**Wait** and take readings at intervals until the absorbance stays **constant**, showing that equilibrium has been reached; then record that value.","g":"(c)"},{"id":"25m3b-1.d","l":"(d)","m":1,"y":1043,"h":178,"a":"The volume is 1 dm³, so the concentrations equal the amounts in mol.\nK = [N_{2}O_{4}] / [NO_{2}]² = 0.00134 / (0.00732)² = 0.00134 / 5.36 × 10^{−5} = **25** (2 s.f.)"},{"id":"25m3b-1.e.v","l":"(e)(v)","m":1,"y":2668,"h":44,"a":"**Consistent.** K decreases as the temperature increases (25 at 273 K down to 0.0364 at 373 K). For an **exothermic** forward reaction (ΔH = −55.3 kJ mol^{−1}), raising the temperature favours the reverse (endothermic) reaction, shifting the equilibrium to the left, so K should decrease.","g":"(e)"}],"c":{"y":0,"h":69},"ps":{"(c)":{"y":851,"h":46},"(e)":{"y":1221,"h":147}},"split":true},{"id":"22m1p2-2-7.1","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.c.i","l":"(c)(i)","m":1,"y":733,"h":21,"a":"K_{c} = [NH_{3}]² / ([N_{2}][H_{2}]³)","g":"(c)"},{"id":"22m1p2-2.c.ii","l":"(c)(ii)","m":2,"y":754,"h":44,"a":"There are 4 mol of gas on the left and 2 mol on the right. Increasing the pressure shifts the equilibrium towards the side with **fewer gas molecules** (the products), which reduces the pressure.\nK_{c} **does not change**: it only depends on temperature.","g":"(c)"},{"id":"22m1p2-2.c.iii","l":"(c)(iii)","m":1,"y":798,"h":58,"a":"**No effect** on the position of equilibrium. A catalyst speeds up the forward and reverse reactions equally, so equilibrium is just reached faster.","g":"(c)"}],"c":{"y":0,"h":21},"ps":{"(c)":{"y":674,"h":59}},"split":true},{"id":"22m2p2-3-7.1","t":"May 2022 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m2p2-3.webp","W":973,"H":992,"p":[{"id":"22m2p2-3.b.ii","l":"(b)(ii)","m":2,"y":638,"h":21,"a":"The **yield of SO_{3} decreases**. The forward reaction is **exothermic** (ΔH = −196 kJ mol^{−1}), so raising the temperature shifts the equilibrium to the left (in the endothermic direction) to absorb the extra heat, and K decreases.","g":"(b)"}],"c":{"y":0,"h":62},"ps":{"(b)":{"y":82,"h":20}},"split":true},{"id":"22np2-4-7.1","t":"Nov 2022 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22np2-4.webp","W":973,"H":715,"p":[{"id":"22np2-4.a.ii","l":"(a)(ii)","m":2,"y":608,"h":44,"a":"Dilute sulfuric acid contains a lot of **water**, which is a **product** of the reaction. Adding a product shifts the equilibrium to the **left** (Le Châtelier), so the **yield of B decreases**.\n(Concentrated H_{2}SO_{4} also absorbs water, shifting the equilibrium to the right.)"}],"c":{"y":0,"h":227},"split":true},{"id":"23m1p2-2-7.1","t":"May 2023 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m1p2-2.webp","W":973,"H":2486,"p":[{"id":"23m1p2-2.d.i","l":"(d)(i)","m":1,"y":1665,"h":100,"a":"The forward and reverse reactions continue to happen but at **equal rates**, so the concentrations of reactants and products stay **constant** (in a closed system)."},{"id":"23m1p2-2.d.ii","l":"(d)(ii)","m":1,"y":1765,"h":21,"a":"K_{c} = [NH_{3}]² / ([N_{2}][H_{2}]³)"}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-2-7.1","t":"May 2023 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m2p2-2.webp","W":973,"H":1011,"p":[{"id":"23m2p2-2.a.i","l":"(a)(i)","m":1,"y":103,"h":43,"a":"K_{c} = 0.0665 is **less than 1**, so the equilibrium **lies to the left**: the reactant (NO_{2}) predominates and the reaction does not proceed far (little N_{2}O_{4} at 100 °C).","g":"(a)"},{"id":"23m2p2-2.a.ii","l":"(a)(ii)","m":1,"y":146,"h":58,"a":"This is the reverse reaction, so K_{c} = 1 / 0.0665 = **15.0**","g":"(a)"}],"c":{"y":0,"h":44},"ps":{"(a)":{"y":44,"h":59}},"split":true},{"id":"23np2-2-7.1","t":"Nov 2023 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23np2-2.webp","W":973,"H":976,"p":[{"id":"23np2-2.b","l":"(b)","m":1,"y":101,"h":58,"a":"K_{c} = [HCOOH] / ([CO_{2}][H_{2}])"},{"id":"23np2-2.d","l":"(d)","m":1,"y":305,"h":21,"a":"ΔH is (slightly) positive, so the forward reaction is **endothermic**: increasing the temperature shifts the equilibrium to the right and **K_{c} increases**."}],"c":{"y":0,"h":81},"split":true},{"id":"24m1p2-3-7.1","t":"May 2024 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24m1p2-3.webp","W":973,"H":570,"p":[{"id":"24m1p2-3.a","l":"(a)","m":1,"y":61,"h":20,"a":"K_{c} = [CO][H_{2}]³ / ([CH_{4}][H_{2}O])"},{"id":"24m1p2-3.b","l":"(b)","m":1,"y":81,"h":43,"a":"The position shifts to the **right** (towards CO and H_{2}), because the forward reaction is **endothermic** (ΔH = +206 kJ mol^{−1}): increasing the temperature favours the endothermic direction."}],"c":{"y":0,"h":61},"split":true},{"id":"24m2p2-3-7.1","t":"May 2024 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24m2p2-3.webp","W":973,"H":378,"p":[{"id":"24m2p2-3.c.i","l":"(c)(i)","m":1,"y":267,"h":21,"a":"K_{c} = [H_{3}O^{+}][H_{2}PO_{4}^{−}] / [H_{3}PO_{4}]\n(Water is the solvent, so it is usually left out; including [H_{2}O] in the denominator is also accepted.)","g":"(c)"},{"id":"24m2p2-3.c.ii","l":"(c)(ii)","m":1,"y":288,"h":44,"a":"The equilibrium shifts to the **left**: the forward reaction is exothermic (ΔH < 0), so increasing the temperature favours the endothermic (reverse) reaction.","g":"(c)"}],"c":{"y":0,"h":19},"ps":{"(c)":{"y":205,"h":62}},"split":true},{"id":"24np2-3-7.1","t":"Nov 2024 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24np2-3.webp","W":973,"H":1634,"p":[{"id":"24np2-3.d.v","l":"(d)(v)","m":1,"y":1531,"h":60,"a":"K_{c} = [SO_{3}]² / ([SO_{2}]²[O_{2}])","g":"(d)"},{"id":"24np2-3.d.vi","l":"(d)(vi)","m":1,"y":1591,"h":43,"a":"The equilibrium shifts to the **right** (towards SO_{3}): there are 3 mol of gas on the left and 2 mol on the right, and increasing pressure favours the side with **fewer gas molecules**.","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":645,"h":64}},"split":true},{"id":"25m1p2-2-7.1","t":"May 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m1p2-2.webp","W":973,"H":708,"p":[{"id":"25m1p2-2.b.i","l":"(b)(i)","m":1,"y":163,"h":20,"a":"K = [CoCl_{4}^{2−}] / ([Co^{2+}][Cl^{−}]^{4})","g":"(b)"},{"id":"25m1p2-2.b.ii","l":"(b)(ii)","m":1,"y":183,"h":82,"a":"**K does not change** (temperature is constant). Adding NaCl increases [Cl^{−}], so the **equilibrium position shifts to the right** (the mixture becomes more blue).","g":"(b)"},{"id":"25m1p2-2.b.iii","l":"(b)(iii)","m":1,"y":265,"h":67,"a":"**Endothermic.** Heating shifts the equilibrium to the right (more blue CoCl_{4}^{2−}), and an increase in temperature favours the endothermic direction.","g":"(b)"}],"c":{"y":0,"h":19},"ps":{"(b)":{"y":42,"h":121}},"split":true},{"id":"25m2p2-1-7.1","t":"May 2025 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m2p2-1.webp","W":973,"H":1065,"p":[{"id":"25m2p2-1.c.i","l":"(c)(i)","m":1,"y":894,"h":20,"a":"K = [CH_{3}NH_{2}] / ([HCN][H_{2}]²)","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(c)":{"y":835,"h":59}},"split":true},{"id":"25m3p2-3-7.1","t":"May 2025 TZ3 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m3p2-3.webp","W":973,"H":871,"p":[{"id":"25m3p2-3.a","l":"(a)","m":3,"y":59,"h":42,"a":"Concentrations: [N_{2}] = 30.0 / 55.0 = 0.545; [H_{2}] = 40.0 / 55.0 = 0.727; [NH_{3}] = 6.17 / 55.0 = 0.112 mol dm^{−3}\nK = [NH_{3}]² / ([N_{2}][H_{2}]³) = 0.112² / (0.545 × 0.727³) = **0.0600**"},{"id":"25m3p2-3.b","l":"(b)","m":3,"y":101,"h":770,"a":"- At the moment the volume is decreased, [N_{2}] **jumps up suddenly** (a vertical line), because the same amount of N_{2} is in a smaller volume.\n- Then [N_{2}] **gradually decreases** as the equilibrium shifts to the right (fewer gas molecules).\n- It then becomes **constant** (horizontal line) at a value that is **higher than the original** level but below the peak."}],"c":{"y":0,"h":59},"split":false},{"id":"25n1p2-3-7.1","t":"Nov 2025 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25n1p2-3.webp","W":973,"H":873,"p":[{"id":"25n1p2-3.a.i","l":"(a)(i)","m":1,"y":61,"h":20,"a":"K = [CH_{3}COOC_{2}H_{5}][H_{2}O] / ([C_{2}H_{5}OH][CH_{3}COOH])\n(i.e. [C_{4}H_{8}O_{2}][H_{2}O] / ([C_{2}H_{6}O][C_{2}H_{4}O_{2}]))"},{"id":"25n1p2-3.a.ii","l":"(a)(ii)","m":2,"y":81,"h":102,"a":"Ethanoic acid reacted = 0.6 − 0.2 = 0.4 mol, and everything reacts 1 : 1 : 1 : 1.\nEthanol: 0.6 − 0.4 = **0.2 mol**\nEthyl ethanoate: **0.4 mol**\nWater: **0.4 mol**"},{"id":"25n1p2-3.a.iii","l":"(a)(iii)","m":1,"y":183,"h":43,"a":"The forward reaction is **exothermic** (ΔH = −4 kJ mol^{−1}), so lowering the temperature shifts the equilibrium to the right and **K increases** (only slightly, as ΔH is small)."}],"c":{"y":0,"h":61},"split":true},{"id":"25n3p2-3-7.1","t":"Nov 2025 TZ3 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25n3p2-3.webp","W":973,"H":3347,"p":[{"id":"25n3p2-3.c.iv","l":"(c)(iv)","m":1,"y":1615,"h":43,"a":"The equilibrium shifts to the **left**: there is 1 mol of gas on the left and 2 mol on the right, and higher pressure favours the side with **fewer gas molecules**."},{"id":"25n3p2-3.c.v","l":"(c)(v)","m":1,"y":1658,"h":20,"a":"The forward reaction is endothermic, so decreasing the temperature shifts the equilibrium to the **left** (towards ethylbenzene), favouring the exothermic direction."},{"id":"25n3p2-3.f.i","l":"(f)(i)","m":1,"y":3235,"h":45,"a":"K = [C_{6}H_{5}COO^{−}][H^{+}] / [C_{6}H_{5}COOH]\n(or [C_{6}H_{5}COO^{−}][H_{3}O^{+}] / [C_{6}H_{5}COOH])","g":"(f)"}],"c":{"y":0,"h":165},"ps":{"(f)":{"y":2700,"h":535}},"split":true}]}]},{"k":"8","n":"Acids and bases","units":[{"k":"8.1","n":"Theories of acids and bases","q":[{"id":"22m1-19","t":"May 2022 TZ1 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u8-1.webp","W":973,"H":219,"p":[{"id":"22m1-19","l":"","m":1,"y":0,"h":219,"a":"**B**\nBrønsted–Lowry acids donate H^{+.}\nForward: H_{2}O gives H^{+} to CH_{3}NH_{2}, so H_{2}O is the acid.\nReverse: CH_{3}NH_{3}^{+} gives H^{+} to OH^{−}, so CH_{3}NH_{3}^{+} is the acid."}]},{"id":"23n-19","t":"Nov 2023 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u8-1.webp","W":973,"H":176,"p":[{"id":"23n-19","l":"","m":1,"y":0,"h":176,"a":"**B**\nRemoving H^{+} from CH_{3}COOH gives the ethanoate ion. The charge is written as a superscript at the end: **CH_{3}COO^{−}**."}]},{"id":"24m2-20","t":"May 2024 TZ2 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u8-1.webp","W":973,"H":169,"p":[{"id":"24m2-20","l":"","m":1,"y":0,"h":169,"a":"**A**\nA conjugate base has one H^{+} fewer than its acid. Removing H^{+} from OH^{−} leaves **O^{2−}**.\n(H_{2}O is the conjugate acid of OH^{−.})"}]},{"id":"25m1a-25","t":"May 2025 TZ1 Paper 1A · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u8-1.webp","W":973,"H":186,"p":[{"id":"25m1a-25","l":"","m":1,"y":0,"h":186,"a":"**B**\nAn amphiprotic species must be able to both donate H^{+} (have an H to lose) and accept H^{+.}\nHPO_{4}^{2−} can give H^{+} (forming PO_{4}^{3−}) or take H^{+} (forming H_{2}PO_{4}^{−}).\nH_{2}PO_{4}^{−} can give H^{+} (forming HPO_{4}^{2−}) or take H^{+} (forming H_{3}PO_{4}).\nPO_{4}^{3−} has no H to donate; H_{3}PO_{4} cannot really accept another H^{+.}"}]},{"id":"25m2a-24","t":"May 2025 TZ2 Paper 1A · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u8-1.webp","W":973,"H":170,"p":[{"id":"25m2a-24","l":"","m":1,"y":0,"h":170,"a":"**D**\nA base is a proton acceptor. When it gains a **proton (H^{+})** it becomes its conjugate acid, e.g. NH_{3} + H^{+} → NH_{4}^{+.}"}]},{"id":"25m3a-30","t":"May 2025 TZ3 Paper 1A · Q30","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u8-1.webp","W":973,"H":201,"p":[{"id":"25m3a-30","l":"","m":1,"y":0,"h":201,"a":"**C**\nA conjugate acid–base pair differs by **exactly one H^{+}**: H_{2}O / OH^{−.}\nA differs by 2 H^{+} (H_{3}PO_{4} / HPO_{4}^{2−}), B by 2 (H_{3}O^{+} / OH^{−}), D by 2 (NH_{4}^{+} / NH_{2}^{−})."}]},{"id":"25n1a-25","t":"Nov 2025 TZ1 Paper 1A · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u8-1.webp","W":973,"H":177,"p":[{"id":"25n1a-25","l":"","m":1,"y":0,"h":177,"a":"**B**\nA Brønsted–Lowry base **accepts H^{+}**. In B, NH_{3} gains H^{+} (from H_{2}CO_{3} formed by CO_{2} + H_{2}O) to become NH_{4}^{+} in (NH_{4})HCO_{3}.\nIn D, NH_{3} loses H^{+} (acts as an acid) to form NH_{2}^{−}; A is combustion; in C it acts as a nucleophile."}]},{"id":"22m1p2-2-8.1","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.e.i","l":"(e)(i)","m":1,"y":1153,"h":23,"a":"They are a **conjugate acid–base pair**: NH_{4}^{+} is the conjugate acid of NH_{3} (they differ by one H^{+}).","g":"(e)"}],"c":{"y":0,"h":21},"ps":{"(e)":{"y":1092,"h":61}},"split":true},{"id":"22np2-1-8.1","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.b","l":"(b)","m":1,"y":63,"h":20,"a":"**Acid**: NH_{4}^{+} can **donate a proton** (H^{+}), forming NH_{3}: NH_{4}^{+} ⇌ NH_{3} + H^{+.}"}],"c":{"y":0,"h":21},"split":true},{"id":"24m1p2-1-8.1","t":"May 2024 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24m1p2-1.webp","W":973,"H":839,"p":[{"id":"24m1p2-1.b.i","l":"(b)(i)","m":1,"y":415,"h":174,"a":"**3** (the H atoms of the three –COOH groups; the H on the C–OH group is not acidic)."},{"id":"24m1p2-1.b.ii","l":"(b)(ii)","m":1,"y":589,"h":187,"a":"The same structure with **one –COOH changed to –COO^{−}** (one H^{+} removed), e.g. ^{−}OOC–CH_{2}–C(OH)(COOH)–CH_{2}–COOH."}],"c":{"y":0,"h":238},"split":true},{"id":"25m2p2-4-8.1","t":"May 2025 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m2p2-4.webp","W":973,"H":829,"p":[{"id":"25m2p2-4.a.iii","l":"(a)(iii)","m":1,"y":474,"h":151,"a":"Direction: **pH increases** (the solution becomes basic).\nReason: the lone pair on N1 **accepts a proton** from water, forming OH^{−} ions (the amine acts as a Brønsted–Lowry base).","g":"(a)"}],"c":{"y":0,"h":21},"ps":{"(a)":{"y":21,"h":413}},"split":true},{"id":"25m3p2-1-8.1","t":"May 2025 TZ3 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m3p2-1.webp","W":973,"H":789,"p":[{"id":"25m3p2-1.b","l":"(b)","m":1,"y":516,"h":273,"a":"**C_{6}H_{5}OH(aq) ⇌ C_{6}H_{5}O^{−}(aq) + H^{+}(aq)** (or C_{6}H_{5}OH + H_{2}O ⇌ C_{6}H_{5}O^{−} + H_{3}O^{+})\nPhenol donates a proton, acting as a (weak) Brønsted–Lowry acid."}],"c":{"y":0,"h":358},"split":true},{"id":"25n1p2-2-8.1","t":"Nov 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n1p2-2.webp","W":973,"H":1858,"p":[{"id":"25n1p2-2.a.iii","l":"(a)(iii)","m":2,"y":129,"h":189,"a":"Conjugate acid: **HNO_{2}**; conjugate base: **NO_{2}^{−}**\nConjugate acid: **H_{3}O^{+}**; conjugate base: **H_{2}O**\n(HNO_{2} + H_{2}O ⇌ H_{3}O^{+} + NO_{2}^{−})","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":45}},"split":true}]},{"k":"8.2","n":"Properties of acids and bases","q":[{"id":"23m1-19","t":"May 2023 TZ1 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u8-2.webp","W":973,"H":160,"p":[{"id":"23m1-19","l":"","m":1,"y":0,"h":160,"a":"**B**\nAcid + base (hydroxide) → salt + water\n2HNO_{3} + Ca(OH)_{2} → Ca(NO_{3})_{2} + 2H_{2}O"}]},{"id":"23m2-19","t":"May 2023 TZ2 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u8-2.webp","W":973,"H":175,"p":[{"id":"23m2-19","l":"","m":1,"y":0,"h":175,"a":"**B**\nZnO is a base (metal oxide): it accepts H^{+} (O^{2−} + 2H^{+} → H_{2}O).\nAcid + metal oxide → salt + water.\nA is a metal plus acid (redox), C is combustion, D is hydrogenation."}]},{"id":"24m1-19","t":"May 2024 TZ1 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u8-2.webp","W":973,"H":173,"p":[{"id":"24m1-19","l":"","m":1,"y":0,"h":173,"a":"**B**\nAcid + hydrogencarbonate → salt + water + carbon dioxide\nH_{2}SO_{4} + 2NaHCO_{3} → **Na_{2}SO_{4} + 2H_{2}O + 2CO_{2}**\nSodium sulfate is Na_{2}SO_{4} (SO_{4}^{2−} needs two Na^{+})."}]},{"id":"25m3a-26","t":"May 2025 TZ3 Paper 1A · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u8-2.webp","W":973,"H":175,"p":[{"id":"25m3a-26","l":"","m":1,"y":0,"h":175,"a":"**A**\nAcid + carbonate → salt + carbon dioxide + water:\n2HCl + Na_{2}CO_{3} → 2NaCl + CO_{2} + H_{2}O (balanced)\nCu does not react with HCl; NaOH + HCl gives water, not H_{2}; D is missing the CO_{2} from the hydrogencarbonate."}]},{"id":"23m2p2-5-8.2","t":"May 2023 TZ2 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/23m2p2-5.webp","W":973,"H":193,"p":[{"id":"23m2p2-5.b","l":"(b)","m":1,"y":127,"h":20,"a":"**HCOOH(aq) + NaOH(aq) → HCOONa(aq) + H_{2}O(l)**"}],"c":{"y":0,"h":19},"split":true},{"id":"25m2p2-2-8.2","t":"May 2025 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25m2p2-2.webp","W":973,"H":745,"p":[{"id":"25m2p2-2.b.iii","l":"(b)(iii)","m":2,"y":567,"h":44,"a":"**2TlOH(s) + H_{2}SO_{4}(aq) → Tl_{2}SO_{4}(aq) + 2H_{2}O(l)**","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":342,"h":20}},"split":true},{"id":"25n3p2-2-8.2","t":"Nov 2025 TZ3 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n3p2-2.webp","W":973,"H":542,"p":[{"id":"25n3p2-2.a.ii","l":"(a)(ii)","m":1,"y":241,"h":20,"a":"**2HNO_{3}(aq) + Na_{2}CO_{3}(s) → 2NaNO_{3}(aq) + H_{2}O(l) + CO_{2}(g)**"}],"c":{"y":0,"h":21},"split":true}]},{"k":"8.3","n":"The pH scale","q":[{"id":"22m2-19","t":"May 2022 TZ2 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u8-3.webp","W":973,"H":177,"p":[{"id":"22m2-19","l":"","m":1,"y":0,"h":177,"a":"**A**\npH 11.3 means pOH = 14 − 11.3 = 2.7, so [OH^{−}] = 10^{−2.7} = 2 × 10^{−3} mol dm^{−3.}\n0.001 mol dm^{−3} Ca(OH)_{2} gives 2 × 0.001 = 0.002 mol dm^{−3} OH^{−} (two OH^{−} per formula unit).\nNaOH would give pH 11.0 and NH_{4}OH (weak) lower still; H_{3}PO_{4} is an acid."}]},{"id":"23m2-20","t":"May 2023 TZ2 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u8-3.webp","W":973,"H":161,"p":[{"id":"23m2-20","l":"","m":1,"y":0,"h":161,"a":"**D**\npH + pOH = 14 at 298 K, so pOH = 14 − 4 = 10.\n[OH^{−}] = 10^{−10} mol dm^{−3}\n(Check: [H^{+}][OH^{−}] = 10^{−4} × 10^{−10} = 10^{−14.})"}]},{"id":"24m1-20","t":"May 2024 TZ1 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u8-3.webp","W":973,"H":175,"p":[{"id":"24m1-20","l":"","m":1,"y":0,"h":175,"a":"**A**\nHCl is a strong acid, so [H^{+}] = [HCl].\n0.100 mol dm^{−3}: pH = 1. 0.00100 mol dm^{−3}: pH = 3.\nThe concentration falls by a factor of 100, so the pH **increases by 2**."}]},{"id":"24m2-21","t":"May 2024 TZ2 Paper 1 · Q21","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u8-3.webp","W":973,"H":163,"p":[{"id":"24m2-21","l":"","m":1,"y":0,"h":163,"a":"**D**\nHCl is a strong acid: [H^{+}] = 0.010 = 10^{−2} mol dm^{−3}\npH = −log(10^{−2}) = **2.00**"}]},{"id":"24n-19","t":"Nov 2024 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u8-3.webp","W":973,"H":211,"p":[{"id":"24n-19","l":"","m":1,"y":0,"h":211,"a":"**D**\nEach pH unit is a factor of 10 in [H_{3}O^{+}]. pH 5 to pH 10 is a difference of 5 units, so [H_{3}O^{+}] in X is **10^{5} times lower** than in Z."}]},{"id":"25m1a-26","t":"May 2025 TZ1 Paper 1A · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m1a-u8-3.webp","W":973,"H":170,"p":[{"id":"25m1a-26","l":"","m":1,"y":0,"h":170,"a":"**B**\n[H^{+}] = 10^{−}pH = 10^{−3.0} = **1.0 × 10^{−3} mol dm^{−3}**"}]},{"id":"25m2a-25","t":"May 2025 TZ2 Paper 1A · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u8-3.webp","W":973,"H":185,"p":[{"id":"25m2a-25","l":"","m":1,"y":0,"h":185,"a":"**D**\npH 9.0 means pOH = 14 − 9 = 5.0, so [OH^{−}] = 1.0 × 10^{−5} mol dm^{−3.}\nNaOH is a strong base, so 10^{−5} mol dm^{−3} NaOH gives exactly this. 10^{−5} mol dm^{−3} NH_{3} is a weak base and ionizes only partly, so its pH would be lower."}]},{"id":"25m3a-24","t":"May 2025 TZ3 Paper 1A · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u8-3.webp","W":973,"H":349,"p":[{"id":"25m3a-24","l":"","m":1,"y":0,"h":159,"a":"**C**\nHCl is a strong acid, so [H^{+}] = 0.0010 = 10^{−3} mol dm^{−3.}\npH = −log(10^{−3}) = **3.0**"}]},{"id":"25m3a-25","t":"May 2025 TZ3 Paper 1A · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u8-3.webp","W":973,"H":349,"p":[{"id":"25m3a-25","l":"","m":1,"y":171,"h":178,"a":"**B**\nA solution is acidic when [H^{+}] > 1 × 10^{−7} mol dm^{−3} at 25 °C.\nB: [OH^{−}] = 10^{−13}, so [H^{+}] = 10^{−14} / 10^{−13} = **0.1 mol dm^{−3}** (pH 1): acidic.\nA and D have [H^{+}] = 10^{−9} and 10^{−13} (basic); C has [H^{+}] = 10^{−8} (basic)."}]},{"id":"25n3a-24","t":"Nov 2025 TZ3 Paper 1A · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u8-3.webp","W":973,"H":211,"p":[{"id":"25n3a-24","l":"","m":1,"y":0,"h":211,"a":"**A**\n[H^{+}] = 10^{−4.50} = 3.16 × 10^{−5} mol dm^{−3}\n[OH^{−}] = Kw / [H^{+}] = 1.00 × 10^{−14} / 3.16 × 10^{−5} = **3.16 × 10^{−10} mol dm^{−3}**\n(Or pOH = 14 − 4.50 = 9.50.)"}]},{"id":"22m1p2-2-8.3","t":"May 2022 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22m1p2-2.webp","W":973,"H":1289,"p":[{"id":"22m1p2-2.e.iii","l":"(e)(iii)","m":1,"y":1246,"h":43,"a":"pOH = 14 − 9.3 = 4.7\n[OH^{−}] = 10^{−4.7} = **2.0 × 10^{−5} mol dm^{−3}**","g":"(e)"}],"c":{"y":0,"h":21},"ps":{"(e)":{"y":1092,"h":61}},"split":true},{"id":"22np2-1-8.3","t":"Nov 2022 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/22np2-1.webp","W":973,"H":1705,"p":[{"id":"22np2-1.d","l":"(d)","m":1,"y":403,"h":45,"a":"pH = −log[H_{3}O^{+}] = −log(1.07 × 10^{−5}) = **4.97**"}],"c":{"y":0,"h":21},"split":true},{"id":"23m1p2-1-8.3","t":"May 2023 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23m1p2-1.webp","W":973,"H":239,"p":[{"id":"23m1p2-1.b","l":"(b)","m":1,"y":62,"h":23,"a":"HCl is strong, so [H^{+}] = 0.50 mol dm^{−3}\npH = −log(0.50) = **0.30**"}],"c":{"y":0,"h":19},"split":true},{"id":"23m2p2-5-8.3","t":"May 2023 TZ2 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/23m2p2-5.webp","W":973,"H":193,"p":[{"id":"23m2p2-5.a","l":"(a)","m":2,"y":19,"h":108,"a":"NaOH is a strong base: [OH^{−}] = 0.200 mol dm^{−3}\npOH = −log(0.200) = 0.70, so pH = 14.00 − 0.70 = **13.30**\n(or [H^{+}] = 1.0 × 10^{−14} / 0.200 = 5.0 × 10^{−14}, pH = 13.30)"}],"c":{"y":0,"h":19},"split":true},{"id":"24m1p2-1-8.3","t":"May 2024 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24m1p2-1.webp","W":973,"H":839,"p":[{"id":"24m1p2-1.c","l":"(c)","m":1,"y":796,"h":43,"a":"pH = −log(0.0025) = **2.60**"}],"c":{"y":0,"h":238},"split":true},{"id":"24m2p2-3-8.3","t":"May 2024 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24m2p2-3.webp","W":973,"H":378,"p":[{"id":"24m2p2-3.b.ii","l":"(b)(ii)","m":2,"y":147,"h":58,"a":"0.100 mol Na_{2}O gives 0.200 mol NaOH in 1.00 dm³: [OH^{−}] = 0.200 mol dm^{−3}\npOH = −log(0.200) = 0.70, so pH = 14.00 − 0.70 = **13.30**","g":"(b)"}],"c":{"y":0,"h":19},"ps":{"(b)":{"y":83,"h":44}},"split":true},{"id":"25m2p2-1-8.3","t":"May 2025 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m2p2-1.webp","W":973,"H":1065,"p":[{"id":"25m2p2-1.b.iii","l":"(b)(iii)","m":1,"y":812,"h":23,"a":"pH = −log(7.00 × 10^{−6}) = **5.15**","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":658,"h":20}},"split":true}]},{"k":"8.4","n":"Strong and weak acids and bases","q":[{"id":"22m1-20","t":"May 2022 TZ1 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u8-4.webp","W":973,"H":169,"p":[{"id":"22m1-20","l":"","m":1,"y":0,"h":169,"a":"**C**\nHCl and H_{2}SO_{4} are acids (pH below 7). NaOH and NH_{3} are bases, but NaOH is a strong base that fully dissociates, giving [OH^{−}] = 0.01 mol dm^{−3} (pH 12). NH_{3} is a weak base and only partly ionizes, so its pH is lower."}]},{"id":"22m2-20","t":"May 2022 TZ2 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u8-4.webp","W":973,"H":218,"p":[{"id":"22m2-20","l":"","m":1,"y":0,"h":218,"a":"**D**\nK_{c} = 4.5 × 10^{−4} is much less than 1, so the equilibrium lies to the left: the reverse reaction is favoured.\nThat means H_{3}O^{+} donates H^{+} to H_{2}AsO_{4}^{−} more readily than H_{3}AsO_{4} donates to water, so **H_{3}O^{+}** is the stronger acid."}]},{"id":"22n-19","t":"Nov 2022 Paper 1 · Q19","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u8-4.webp","W":973,"H":371,"p":[{"id":"22n-19","l":"","m":1,"y":0,"h":188,"a":"**C**\nBoth acids are monoprotic with the same concentration and volume, so they contain the same amount of acid and need the **same volume of NaOH**.\nThe weak acid has a higher initial pH, lower conductivity, and gives out slightly less heat (energy is used to ionize it)."}]},{"id":"22n-20","t":"Nov 2022 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u8-4.webp","W":973,"H":371,"p":[{"id":"22n-20","l":"","m":1,"y":200,"h":171,"a":"**A**\nThe stronger the acid, the weaker its conjugate base. HCl is a strong acid (fully dissociates), so its conjugate base Cl^{−} is the weakest base."}]},{"id":"23m1-20","t":"May 2023 TZ1 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u8-4.webp","W":973,"H":239,"p":[{"id":"23m1-20","l":"","m":1,"y":0,"h":239,"a":"**B**\nA strong acid is a **good proton donor** (it dissociates completely). The stronger the acid, the **weaker its conjugate base**."}]},{"id":"24n-20","t":"Nov 2024 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u8-4.webp","W":973,"H":161,"p":[{"id":"24n-20","l":"","m":1,"y":0,"h":161,"a":"**A**\nThe strongest acid has the weakest conjugate base. **HCl** is a strong acid (fully dissociated), so Cl^{−} is a very weak base."}]},{"id":"25m2a-26","t":"May 2025 TZ2 Paper 1A · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u8-4.webp","W":973,"H":183,"p":[{"id":"25m2a-26","l":"","m":1,"y":0,"h":183,"a":"**B**\nSulfuric acid is a **strong** acid that is fully ionized (first ionization), while methanoic acid is a **weak** acid that only partly ionizes. The much higher [H^{+}] is the main reason for the lower pH."}]},{"id":"25n3a-25","t":"Nov 2025 TZ3 Paper 1A · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u8-4.webp","W":973,"H":177,"p":[{"id":"25n3a-25","l":"","m":1,"y":0,"h":177,"a":"**B**\nHCl and HNO_{3} are strong acids; 2.0 mol dm^{−3} HCl has the highest [H^{+}], so the lowest pH.\nCH_{3}COOH is a weak acid (partly ionized) and NaOH is a base."}]},{"id":"22m2p2-3-8.4","t":"May 2022 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m2p2-3.webp","W":973,"H":992,"p":[{"id":"22m2p2-3.c.ii","l":"(c)(ii)","m":2,"y":680,"h":20,"a":"A Brønsted–Lowry acid is a **proton (H^{+}) donor**. A **strong** acid **dissociates (ionizes) completely** in water."}],"c":{"y":0,"h":62},"split":true},{"id":"23m1p2-1-8.4","t":"May 2023 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23m1p2-1.webp","W":973,"H":239,"p":[{"id":"23m1p2-1.a","l":"(a)","m":2,"y":19,"h":43,"a":"**HCl(g) + H_{2}O(l) → H_{3}O^{+}(aq) + Cl^{−}(aq)**\n(HCl is a strong acid, so a single arrow; H^{+}(aq) instead of H_{3}O^{+} is also acceptable.)"},{"id":"23m1p2-1.c","l":"(c)","m":1,"y":85,"h":43,"a":"Ethanoic acid is a **weak acid**: it only **partially dissociates** in water, so [H^{+}] is much lower than in HCl of the same concentration (which dissociates completely), giving a higher pH."},{"id":"23m1p2-1.d","l":"(d)","m":1,"y":128,"h":67,"a":"A **conductivity meter** (electrical conductivity measurement)."},{"id":"23m1p2-1.e","l":"(e)","m":1,"y":195,"h":44,"a":"The ethanoic acid solution has **lower conductivity**, because it contains fewer ions (it is only partly ionized), while HCl is fully ionized."}],"c":{"y":0,"h":19},"split":true},{"id":"23np2-1-8.4","t":"Nov 2023 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23np2-1.webp","W":973,"H":597,"p":[{"id":"23np2-1.d.iii","l":"(d)(iii)","m":3,"y":445,"h":152,"a":"**ethanal < methanoic acid < hydrochloric acid**\nEthanal does not ionize, so there are (almost) no ions.\nMethanoic acid is a **weak acid**: it only partially dissociates, giving a few ions.\nHCl is a **strong acid**: it dissociates completely, giving the highest concentration of ions.","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":341,"h":40}},"split":true},{"id":"24m1p2-1-8.4","t":"May 2024 TZ1 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24m1p2-1.webp","W":973,"H":839,"p":[{"id":"24m1p2-1.b.iii","l":"(b)(iii)","m":1,"y":776,"h":20,"a":"**Weak acid**: it is a carboxylic acid, which only **partially dissociates** in water."}],"c":{"y":0,"h":238},"split":true},{"id":"24np2-4-8.4","t":"Nov 2024 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24np2-4.webp","W":973,"H":1656,"p":[{"id":"24np2-4.d","l":"(d)","m":2,"y":1453,"h":203,"a":"Method (any one): measure the **pH**; measure the **electrical conductivity**; or add the same mass of **Mg / CaCO_{3}** to each.\nObservation: propanoic acid has a **higher pH** / **lower conductivity** / **slower effervescence**, because it is a weak acid that only partially dissociates, giving a lower [H^{+}]."}],"c":{"y":0,"h":19},"split":true},{"id":"25m2p2-1-8.4","t":"May 2025 TZ2 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25m2p2-1.webp","W":973,"H":1065,"p":[{"id":"25m2p2-1.b.i","l":"(b)(i)","m":1,"y":678,"h":20,"a":"**HCN(aq) ⇌ H^{+}(aq) + CN^{−}(aq)** (or HCN + H_{2}O ⇌ H_{3}O^{+} + CN^{−}), with an equilibrium arrow because it only partially dissociates.","g":"(b)"},{"id":"25m2p2-1.b.ii","l":"(b)(ii)","m":2,"y":698,"h":114,"a":"Any two:\n- measure the **pH**: HCN has a **higher pH** than HCl of the same concentration;\n- measure the **electrical conductivity**: HCN conducts **less** (fewer ions);\n- add Mg or CaCO_{3}: HCN reacts **more slowly** (less vigorous effervescence).","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":658,"h":20}},"split":true},{"id":"25n1p2-2-8.4","t":"Nov 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n1p2-2.webp","W":973,"H":1858,"p":[{"id":"25n1p2-2.a.i","l":"(a)(i)","m":2,"y":65,"h":20,"a":"HNO_{2} is a **weak acid**: it only **partially dissociates**, so [H^{+}] is lower than 0.01 mol dm^{−3} and the pH is higher (2.63).\nHCl is a **strong acid**: it **dissociates completely**, so [H^{+}] = 0.01 mol dm^{−3} and pH = 2.00.","g":"(a)"},{"id":"25n1p2-2.a.ii","l":"(a)(ii)","m":2,"y":85,"h":44,"a":"Both: **bubbles of gas (H_{2})** form and the magnesium dissolves.\nHCl reacts **faster / more vigorously** (higher [H^{+}]), but since equal amounts of acid are present both eventually give the **same volume** of hydrogen.","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":45}},"split":true}]},{"k":"8.5","n":"Acid deposition","q":[{"id":"23n-20","t":"Nov 2023 Paper 1 · Q20","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u8-5.webp","W":973,"H":300,"p":[{"id":"23n-20","l":"","m":1,"y":0,"h":300,"a":"**C**\nPre combustion methods remove sulfur from the fuel **before** burning: crushing and washing coal (II), or dissolving sulfur out with a solvent (III).\nWashing flue gases with limestone (I) is post combustion (scrubbing)."}]},{"id":"25n1a-18","t":"Nov 2025 TZ1 Paper 1A · Q18","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u8-5.webp","W":973,"H":192,"p":[{"id":"25n1a-18","l":"","m":1,"y":0,"h":192,"a":"**D**\nBurning fossil fuels releases SO_{2} (from sulfur in the fuel) and NOx (from N_{2} at high temperature), which form H_{2}SO_{4} and HNO_{3} in the air: **acid rain**."}]},{"id":"22m2p2-3-8.5","t":"May 2022 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m2p2-3.webp","W":973,"H":992,"p":[{"id":"22m2p2-3.c.i","l":"(c)(i)","m":1,"y":659,"h":21,"a":"**Sulfuric acid, H_{2}SO_{4}**: SO_{3} + H_{2}O → H_{2}SO_{4}"}],"c":{"y":0,"h":62},"split":true},{"id":"22np2-5-8.5","t":"Nov 2022 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/22np2-5.webp","W":973,"H":794,"p":[{"id":"22np2-5.b","l":"(b)","m":1,"y":103,"h":58,"a":"**SO_{2}(g) + H_{2}O(l) → H_{2}SO_{3}(aq)**\n(or 2SO_{2} + O_{2} + 2H_{2}O → 2H_{2}SO_{4})"},{"id":"22np2-5.d","l":"(d)","m":2,"y":731,"h":63,"a":"Any two:\n- remove sulfur from the coal **before** burning (crushing and washing, or using low sulfur coal);\n- remove SO_{2} from the flue gases **after** burning (scrubbing with CaO / CaCO_{3} / alkaline slurry);\n- reduce CO_{2} by **carbon capture and storage**, or by burning less coal (more efficient plants, switching to renewables)."}],"c":{"y":0,"h":20},"split":true},{"id":"23m1p2-6-8.5","t":"May 2023 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m1p2-6.webp","W":973,"H":1377,"p":[{"id":"23m1p2-6.a.ii","l":"(a)(ii)","m":1,"y":210,"h":151,"a":"SO_{2}: **SO_{2}(g) + H_{2}O(l) → H_{2}SO_{3}(aq)**\nSO_{3}: **SO_{3}(g) + H_{2}O(l) → H_{2}SO_{4}(aq)**"}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-2-8.5","t":"May 2023 TZ2 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/23m2p2-2.webp","W":973,"H":1011,"p":[{"id":"23m2p2-2.d","l":"(d)","m":1,"y":967,"h":44,"a":"**2NO_{2}(g) + H_{2}O(l) → HNO_{3}(aq) + HNO_{2}(aq)**"}],"c":{"y":0,"h":44},"split":true},{"id":"24m1p2-5-8.5","t":"May 2024 TZ1 Paper 2 · Q5","s":"Structured questions (Paper 2)","img":"q/24m1p2-5.webp","W":973,"H":83,"p":[{"id":"24m1p2-5.c","l":"(c)","m":1,"y":63,"h":20,"a":"**SO_{2} + H_{2}O → H_{2}SO_{3}** (or SO_{3} + H_{2}O → H_{2}SO_{4})"}],"split":true},{"id":"24m2p2-3-8.5","t":"May 2024 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24m2p2-3.webp","W":973,"H":378,"p":[{"id":"24m2p2-3.a.i","l":"(a)(i)","m":1,"y":19,"h":20,"a":"**Acid rain / acid deposition** (e.g. damage to limestone buildings, lakes and forests); SO_{2} also causes respiratory problems."},{"id":"24m2p2-3.a.ii","l":"(a)(ii)","m":1,"y":39,"h":44,"a":"**2SO_{2}(g) + O_{2}(g) → 2SO_{3}(g)** (SO_{3} is a secondary pollutant)\nor SO_{2} + H_{2}O → H_{2}SO_{3}"}],"c":{"y":0,"h":19},"split":true},{"id":"24np2-3-8.5","t":"Nov 2024 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/24np2-3.webp","W":973,"H":1634,"p":[{"id":"24np2-3.b","l":"(b)","m":1,"y":581,"h":21,"a":"SO_{3} dissolves in water to form **sulfuric acid**, causing **acid rain / acid deposition**."},{"id":"24np2-3.c","l":"(c)","m":1,"y":602,"h":43,"a":"**Flue gas desulfurization** (alkaline scrubbing of the waste gases with CaO / CaCO_{3} slurry)."}],"c":{"y":0,"h":20},"split":true},{"id":"25m3p2-7-8.5","t":"May 2025 TZ3 Paper 2 · Q7","s":"Structured questions (Paper 2)","img":"q/25m3p2-7.webp","W":973,"H":1327,"p":[{"id":"25m3p2-7.b.i","l":"(b)(i)","m":2,"y":463,"h":20,"a":"**2SO_{2}(g) + O_{2}(g) + 2H_{2}O(l) → 2H_{2}SO_{4}(aq)**","g":"(b)"},{"id":"25m3p2-7.b.iii","l":"(b)(iii)","m":2,"y":526,"h":82,"a":"The acid reacts with the calcium carbonate, so the limestone is slowly **dissolved / eroded** (details are lost, surfaces crumble):\n**CaCO_{3}(s) + H_{2}SO_{4}(aq) → CaSO_{4}(aq) + H_{2}O(l) + CO_{2}(g)**","g":"(b)"}],"c":{"y":0,"h":22},"ps":{"(b)":{"y":443,"h":20}},"split":true},{"id":"25n3p2-1-8.5","t":"Nov 2025 TZ3 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/25n3p2-1.webp","W":973,"H":459,"p":[{"id":"25n3p2-1.a","l":"(a)","m":1,"y":20,"h":20,"a":"Any one: NO is oxidized to NO_{2}, which dissolves in water to form **nitric acid (acid rain / acid deposition)**; it contributes to **photochemical smog**; it is toxic / irritates the respiratory system."}],"c":{"y":0,"h":20},"split":true}]}]},{"k":"9","n":"Organic chemistry","units":[{"k":"10.1","n":"Fundamentals of organic chemistry","q":[{"id":"22m1-24","t":"May 2022 TZ1 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u10-1.webp","W":973,"H":443,"p":[{"id":"22m1-24","l":"","m":1,"y":0,"h":263,"a":"**D**\nH_{2}N– is an **amino** group, –COOH a **carboxyl** group and –CH_{2}OH contains a **hydroxyl** group. There is no C=O on its own (carbonyl) and no –NO_{2} (nitro)."}]},{"id":"22m1-25","t":"May 2022 TZ1 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m1-u10-1.webp","W":973,"H":443,"p":[{"id":"22m1-25","l":"","m":1,"y":275,"h":168,"a":"**D**\nMembers of a homologous series have the same functional group and differ by CH_{2}.\nEthanol, propan-1-ol and butan-1-ol are all primary alcohols, each one CH_{2} longer than the last.\nA has three different functional groups, B are alkane, alkene and alkyne, C are isomers (same formula)."}]},{"id":"22m2-26","t":"May 2022 TZ2 Paper 1 · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u10-1.webp","W":973,"H":177,"p":[{"id":"22m2-26","l":"","m":1,"y":0,"h":177,"a":"**B**\nC_{2}H_{2}, C_{3}H_{4}, C_{4}H_{6} all fit C_{n}H_{2n−2} (alkynes) and differ by CH_{2} each time.\nA and D do not differ by CH_{2}; C are ethyne, ethene and ethane (different series)."}]},{"id":"22n-24","t":"Nov 2022 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u10-1.webp","W":973,"H":538,"p":[{"id":"22n-24","l":"","m":1,"y":0,"h":366,"a":"*
