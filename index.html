*D**\nAll three have 5 carbons and 12 hydrogens:\nI is 2-methylbutane, II is 2,2-dimethylpropane, III is pentane.\nSame molecular formula, different structures: **all are isomers**."}]},{"id":"22n-25","t":"Nov 2022 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/22n-u10-1.webp","W":973,"H":538,"p":[{"id":"22n-25","l":"","m":1,"y":378,"h":160,"a":"**D**\nKetones have the general formula C_{n}H_{2n}O. The smallest ketone, propanone, has 3 carbons, which is why n > 2.\n(Aldehydes also fit C_{n}H_{2n}O but start at n = 1.) Alcohols and ethers are C_{n}H_{2n+2}O, carboxylic acids C_{n}H_{2n}O_{2}."}]},{"id":"23m1-24","t":"May 2023 TZ1 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u10-1.webp","W":973,"H":383,"p":[{"id":"23m1-24","l":"","m":1,"y":0,"h":175,"a":"**D**\nAn ether has the C–O–C functional group: **CH_{3}OCH_{3}** (methoxymethane).\nA is phenol, B (CH_{3}CHO) is an aldehyde, C (CH_{3}COCH_{3}) is a ketone."}]},{"id":"23m1-25","t":"May 2023 TZ1 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u10-1.webp","W":973,"H":383,"p":[{"id":"23m1-25","l":"","m":1,"y":187,"h":196,"a":"**A**\nEach member has one more CH_{2} than the last. Larger molecules have more electrons and a bigger surface area, so **London dispersion forces get stronger** and the boiling point rises.\nThe hydrogen bonding from the single –OH group stays roughly the same."}]},{"id":"23m2-24","t":"May 2023 TZ2 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u10-1.webp","W":973,"H":887,"p":[{"id":"23m2-24","l":"","m":1,"y":0,"h":573,"a":"**B**\nAn ester contains –COO– (a C=O with an O attached to another carbon). Aromatic means it contains a benzene ring.\nB is methyl benzoate: benzene ring + ester group.\nA is a carboxylic acid (benzoic acid), C is an ester but not aromatic, D's ring is not a benzene ring."}]},{"id":"23m2-26","t":"May 2023 TZ2 Paper 1 · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m2-u10-1.webp","W":973,"H":887,"p":[{"id":"23m2-26","l":"","m":1,"y":585,"h":302,"a":"**B**\nThe longest chain containing the C–OH carbon has 4 carbons: butan-ol.\nNumber from the end nearest the OH: OH on C2, methyl groups on C2 and C3.\n**2,3-dimethylbutan-2-ol**"}]},{"id":"23n-25","t":"Nov 2023 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u10-1.webp","W":973,"H":654,"p":[{"id":"23n-25","l":"","m":1,"y":0,"h":238,"a":"**C**\nStructural isomers have the same molecular formula but different structures.\nCH_{3}CH_{2}OH (ethanol) and CH_{3}OCH_{3} (methoxymethane) are both C_{2}H_{6}O.\nA: C_{2}H_{5}NO_{2} vs C_{2}H_{7}NO; B: C_{2}H_{6}O vs C_{3}H_{6}O; D: different number of carbons."}]},{"id":"23n-26","t":"Nov 2023 Paper 1 · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u10-1.webp","W":973,"H":654,"p":[{"id":"23n-26","l":"","m":1,"y":250,"h":404,"a":"**D**\nAmines are classified by how many carbons are bonded to the **nitrogen**: this N is bonded to one C, so it is a **primary** amine.\nAlcohols are classified by how many carbons are bonded to the **carbon carrying the OH**: here that carbon is bonded to three other carbons, so it is a **tertiary** alcohol."}]},{"id":"24m1-24","t":"May 2024 TZ1 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u10-1.webp","W":973,"H":443,"p":[{"id":"24m1-24","l":"","m":1,"y":0,"h":176,"a":"**B**\nAll three in B contain one C=C double bond: they are **alkenes** (C_{n}H_{2n}), differing by CH_{2}.\nA mixes alkanes with an alkene, C has an alcohol, an aldehyde and an acid, D has aldehydes and a ketone."}]},{"id":"24m1-25","t":"May 2024 TZ1 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u10-1.webp","W":973,"H":443,"p":[{"id":"24m1-25","l":"","m":1,"y":188,"h":255,"a":"**B**\nThe longest chain includes the CH_{2}Cl carbon and the propyl group: 5 carbons (pentane).\nNumber from the Cl end: Cl on C1, a CH_{3} branch on C2.\n**1-chloro-2-methylpentane**"}]},{"id":"24m2-24","t":"May 2024 TZ2 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u10-1.webp","W":973,"H":1099,"p":[{"id":"24m2-24","l":"","m":1,"y":0,"h":490,"a":"**C**\nThe model shows CH_{3}CH_{2}–COO–CH_{3}: an ester.\nThe acid part (with the C=O) has 3 carbons: propanoate. The alkyl group on the single bonded O is methyl.\n**Methyl propanoate**"}]},{"id":"24m2-26","t":"May 2024 TZ2 Paper 1 · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u10-1.webp","W":973,"H":1099,"p":[{"id":"24m2-26","l":"","m":1,"y":502,"h":304,"a":"**C**\nPropanone C_{3}H_{6}O and butanone C_{4}H_{8}O:\nII: they differ by CH_{2} (true for any homologous series).\nIII: both fit C_{n}H_{2n}O.\nI is false: the empirical formulas are C_{3}H_{6}O and C_{4}H_{8}O (these cannot be simplified and are different)."}]},{"id":"24m2-27","t":"May 2024 TZ2 Paper 1 · Q27","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u10-1.webp","W":973,"H":1099,"p":[{"id":"24m2-27","l":"","m":1,"y":818,"h":281,"a":"**C**\nII: (CH_{3})_{2}CHCH_{2}CH_{3} and pentane are both C_{5}H_{12}.\nIII: CH_{3}OCH_{3} and CH_{3}CH_{2}OH are both C_{2}H_{6}O.\nI: CH_{3}CH=CHCH_{2}Br is C_{4}H_{7}Br but CH_{3}CHBrCH_{2}CH_{3} is C_{4}H_{9}Br, so they are not isomers."}]},{"id":"24n-26","t":"Nov 2024 Paper 1 · Q26","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u10-1.webp","W":973,"H":1149,"p":[{"id":"24n-26","l":"","m":1,"y":0,"h":156,"a":"**C**\nC_{4}H_{9}OH alcohols:\nbutan-1-ol, butan-2-ol, 2-methylpropan-1-ol, 2-methylpropan-2-ol\nThat is **4** structural isomers."}]},{"id":"24n-27","t":"Nov 2024 Paper 1 · Q27","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u10-1.webp","W":973,"H":1149,"p":[{"id":"24n-27","l":"","m":1,"y":168,"h":573,"a":"**A**\nThe longest chain including the CHO carbon has 5 carbons: pentanal (the CHO carbon is C1).\nThere are methyl groups on C2 and C3: **2,3-dimethylpentanal**."}]},{"id":"24n-28","t":"Nov 2024 Paper 1 · Q28","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u10-1.webp","W":973,"H":1149,"p":[{"id":"24n-28","l":"","m":1,"y":753,"h":396,"a":"**D**\n–COOH on the left is a **carboxyl** group, –NH_{2} is a **primary amino** group, and –COOCH_{3} on the right is an **ester** group.\n(The –CONH– in the middle is an amide, also called amido.)"}]},{"id":"25m2a-14","t":"May 2025 TZ2 Paper 1A · Q14","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u10-1.webp","W":973,"H":503,"p":[{"id":"25m2a-14","l":"","m":1,"y":0,"h":503,"a":"**D**\nPropanone is CH_{3}COCH_{3}, C_{3}H_{6}O. An isomer has the same molecular formula but a different structure.\nD is **propanal**, CH_{3}CH_{2}CHO, also C_{3}H_{6}O.\nA is butanone (C_{4}H_{8}O), B is propan-2-ol (C_{3}H_{8}O), C is an ether (C_{3}H_{8}O)."}]},{"id":"25m3a-15","t":"May 2025 TZ3 Paper 1A · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u10-1.webp","W":973,"H":537,"p":[{"id":"25m3a-15","l":"","m":1,"y":0,"h":537,"a":"**D**\nBoth molecules contain a nitrogen bonded only to carbons and H (an **amino** group, here amines) and a **benzene ring**.\nOnly the second has an amide C=O; only the first has an ether O."}]},{"id":"25n1a-13","t":"Nov 2025 TZ1 Paper 1A · Q13","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u10-1.webp","W":973,"H":521,"p":[{"id":"25n1a-13","l":"","m":1,"y":0,"h":334,"a":"**C**\nThe longest carbon chain has **6** carbons (the branch on the right is an ethyl that extends the chain).\nThe C=O is on C3 (number to give it the lowest locant) and there are methyl groups on C2 and C4.\n**2,4-dimethylhexan-3-one**"}]},{"id":"25n1a-15","t":"Nov 2025 TZ1 Paper 1A · Q15","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u10-1.webp","W":973,"H":521,"p":[{"id":"25n1a-15","l":"","m":1,"y":346,"h":175,"a":"**B**\nThe amide (amido) group is –CONH_{2}: **CH_{3}CONH_{2}** (ethanamide).\nA is an amine (aniline), C is a secondary amine, D is an amino acid (amino + carboxyl)."}]},{"id":"22m1p2-3-10.1","t":"May 2022 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m1p2-3.webp","W":973,"H":1211,"p":[{"id":"22m1p2-3.c.i","l":"(c)(i)","m":1,"y":334,"h":44,"a":"**Propanone**","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(c)":{"y":107,"h":227}},"split":true},{"id":"22m2p2-4-10.1","t":"May 2022 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22m2p2-4.webp","W":973,"H":1461,"p":[{"id":"22m2p2-4.b.i","l":"(b)(i)","m":2,"y":83,"h":44,"a":"Any two:\n- the same **general formula**, C_{n}H_{2n+2};\n- successive members **differ by CH_{2}**;\n- similar chemical properties (same functional group);\n- a gradual trend in physical properties such as boiling point."}],"c":{"y":0,"h":20},"split":true},{"id":"22np2-2-10.1","t":"Nov 2022 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/22np2-2.webp","W":973,"H":1733,"p":[{"id":"22np2-2.a","l":"(a)","m":1,"y":375,"h":20,"a":"Circle the **N–H** group joining the ring to the side chain (HN). This N is bonded to two carbon atoms and one H, so it is a secondary amine. (N1 is tertiary; the ring N is part of the aromatic ring.)"},{"id":"22np2-2.e.i","l":"(e)(i)","m":2,"y":763,"h":300,"a":"The Cl at position 4 of the ring is replaced by the NH of the side chain, so B is the side chain amine with an NH_{2} group (HCl is the other product):\n**H_{2}N–CH(CH_{3})–CH_{2}–CH_{2}–CH_{2}–N(CH_{2}CH_{3})_{2}**","g":"(e)"}],"c":{"y":0,"h":375},"ps":{"(e)":{"y":479,"h":284}},"split":true},{"id":"23m1p2-3-10.1","t":"May 2023 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/23m1p2-3.webp","W":973,"H":805,"p":[{"id":"23m1p2-3.a.i","l":"(a)(i)","m":1,"y":20,"h":20,"a":"A family of compounds with the **same general formula** and the **same functional group**, in which successive members **differ by CH_{2}**, so they have similar chemical properties and a gradual change in physical properties."},{"id":"23m1p2-3.a.ii","l":"(a)(ii)","m":2,"y":40,"h":293,"a":"First compound: **2-chlorobutane** (4 carbon chain, Cl on C2)\nSecond compound: **1-chloro-2-methylpropane** (3 carbon chain, Cl on C1, methyl on C2)"}],"c":{"y":0,"h":20},"split":true},{"id":"23np2-1-10.1","t":"Nov 2023 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/23np2-1.webp","W":973,"H":597,"p":[{"id":"23np2-1.a","l":"(a)","m":1,"y":20,"h":20,"a":"A series of compounds with the **same functional group** and **same general formula**, in which each member **differs from the next by CH_{2}**, giving similar chemical properties and a gradual change in physical properties."}],"c":{"y":0,"h":20},"split":true},{"id":"23np2-3-10.1","t":"Nov 2023 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/23np2-3.webp","W":973,"H":938,"p":[{"id":"23np2-3.d","l":"(d)","m":1,"y":631,"h":20,"a":"**Esters**"},{"id":"23np2-3.e","l":"(e)","m":1,"y":651,"h":243,"a":"**Ethanoic acid**, CH_{3}COOH, drawn in full: a CH_{3} group (C with three H) bonded to a C that has a **C=O** and an **O–H**.\n(It has the same formula, C_{2}H_{4}O_{2}, as methyl methanoate.)"}],"c":{"y":0,"h":21},"split":true},{"id":"24m1p2-2-10.1","t":"May 2024 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/24m1p2-2.webp","W":973,"H":1323,"p":[{"id":"24m1p2-2.c.i","l":"(c)(i)","m":2,"y":1109,"h":151,"a":"Class: **alcohols**\nFunctional group: **hydroxyl** (–OH)","g":"(c)"}],"c":{"y":0,"h":697},"ps":{"(c)":{"y":1089,"h":20}},"split":true},{"id":"24m2p2-4-10.1","t":"May 2024 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m2p2-4.webp","W":973,"H":2256,"p":[{"id":"24m2p2-4.a","l":"(a)","m":2,"y":131,"h":20,"a":"**eth-**: the molecule has **two carbon atoms**.\n**-en-**: it contains a **C=C double bond**.\n**-one**: it contains a **carbonyl (C=O)** group (like a ketone)."}],"c":{"y":0,"h":131},"split":true},{"id":"25m1p2-6-10.1","t":"May 2025 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/25m1p2-6.webp","W":973,"H":1705,"p":[{"id":"25m1p2-6.b.i","l":"(b)(i)","m":1,"y":612,"h":20,"a":"**Aldehyde** (carbonyl group, –CHO).","g":"(b)"},{"id":"25m1p2-6.b.ii","l":"(b)(ii)","m":1,"y":632,"h":20,"a":"The longest chain containing the CHO carbon has 6 carbons (hexanal, CHO = C1). There is one methyl on C3 and two on C5:\n**3,5,5-trimethylhexanal**","g":"(b)"},{"id":"25m1p2-6.b.iii","l":"(b)(iii)","m":1,"y":652,"h":409,"a":"Any **ketone** with the same formula, C_{9}H_{18}O, e.g. **nonan-2-one**, CH_{3}CO(CH_{2})_{6}CH_{3} (or an unsaturated alcohol / ether with formula C_{9}H_{18}O).","g":"(b)"},{"id":"25m1p2-6.c.iii","l":"(c)(iii)","m":1,"y":1305,"h":20,"a":"**C_{n}H_{2n}**","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":512,"h":100},"(c)":{"y":1222,"h":20}},"split":true},{"id":"25m2p2-4-10.1","t":"May 2025 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m2p2-4.webp","W":973,"H":829,"p":[{"id":"25m2p2-4.a.i","l":"(a)(i)","m":1,"y":434,"h":20,"a":"**Skeletal** formula.","g":"(a)"},{"id":"25m2p2-4.a.ii","l":"(a)(ii)","m":1,"y":454,"h":20,"a":"**Amino** group (here a tertiary amine).","g":"(a)"},{"id":"25m2p2-4.a.v","l":"(a)(v)","m":1,"y":669,"h":20,"a":"**7** rings.","g":"(a)"}],"c":{"y":0,"h":21},"ps":{"(a)":{"y":21,"h":413}},"split":true},{"id":"25m3p2-4-10.1","t":"May 2025 TZ3 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m3p2-4.webp","W":973,"H":815,"p":[{"id":"25m3p2-4.a","l":"(a)","m":1,"y":20,"h":45,"a":"**2-bromo-3,3-dimethylbutane** (4 carbon chain, Br on C2, two methyls on C3)"},{"id":"25m3p2-4.c","l":"(c)","m":1,"y":109,"h":224,"a":"Any other C_{6}H_{13}Br structure, e.g. **1-bromohexane**, CH_{2}BrCH_{2}CH_{2}CH_{2}CH_{2}CH_{3} (or 2-bromohexane, 1-bromo-3,3-dimethylbutane, etc.)."}],"c":{"y":0,"h":20},"split":true},{"id":"25n1p2-2-10.1","t":"Nov 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n1p2-2.webp","W":973,"H":1858,"p":[{"id":"25n1p2-2.b.i","l":"(b)(i)","m":2,"y":396,"h":43,"a":"Chemists use the **IUPAC system** of nomenclature: a set of internationally agreed rules, so each substance has one **systematic name** that describes its structure and is understood the same way everywhere.","g":"(b)"},{"id":"25n1p2-2.b.ii","l":"(b)(ii)","m":2,"y":439,"h":324,"a":"**Carboxyl** (carboxylic acid, –COOH) and **phenyl** (benzene ring).","g":"(b)"},{"id":"25n1p2-2.b.iii","l":"(b)(iii)","m":2,"y":763,"h":373,"a":"A carboxylic acid with formula C_{4}H_{8}O_{2}, e.g. **butanoic acid**, CH_{3}CH_{2}CH_{2}COOH (or 2-methylpropanoic acid, (CH_{3})_{2}CHCOOH).","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":338,"h":58}},"split":true},{"id":"25n3p2-3-10.1","t":"Nov 2025 TZ3 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25n3p2-3.webp","W":973,"H":3347,"p":[{"id":"25n3p2-3.e.i","l":"(e)(i)","m":1,"y":2327,"h":20,"a":"Reactant A (1,4-dimethylbenzene, C_{8}H_{10}) has the **same molecular formula** as ethylbenzene but a different structure: they are **structural isomers**.","g":"(e)"},{"id":"25n3p2-3.e.ii","l":"(e)(ii)","m":2,"y":2347,"h":173,"a":"Structural formula: a C with a **double bond to O** and a single bond to **H** (–CHO), attached to the rest of the molecule.\nFunctional group name: **carbonyl** (aldehyde group)\nHomologous series: **aldehydes**","g":"(e)"}],"c":{"y":0,"h":165},"ps":{"(e)":{"y":2018,"h":309}},"split":true}]},{"k":"10.2","n":"Alkanes, alkenes and addition polymers","q":[{"id":"22m2-24","t":"May 2022 TZ2 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u10-2.webp","W":973,"H":366,"p":[{"id":"22m2-24","l":"","m":1,"y":0,"h":180,"a":"**B**\nTwo Cl atoms can be placed on butane's four carbons as: 1,1; 1,2; 1,3; 1,4; 2,2; 2,3 dichlorobutane.\nThat is **6** structural isomers (2,1 and 3,4 positions are the same as 1,2 by symmetry)."}]},{"id":"22m2-25","t":"May 2022 TZ2 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/22m2-u10-2.webp","W":973,"H":366,"p":[{"id":"22m2-25","l":"","m":1,"y":192,"h":174,"a":"**A**\nPropene is CH_{2}=CHCH_{3}. Opening the double bond gives the repeating unit **–CH_{2}–CH(CH_{3})–**, with the CH_{3} as a side group, not in the chain."}]},{"id":"23m1-27","t":"May 2023 TZ1 Paper 1 · Q27","s":"Multiple choice (Paper 1 and 1A)","img":"q/23m1-u10-2.webp","W":973,"H":193,"p":[{"id":"23m1-27","l":"","m":1,"y":0,"h":193,"a":"**A**\nBromine water is decolorized by an **alkene** in an addition reaction (C=C), even in the dark.\nEthane only reacts with bromine in UV light (free radical substitution); ethanol and ethanoic acid do not react."}]},{"id":"23n-24","t":"Nov 2023 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/23n-u10-2.webp","W":973,"H":162,"p":[{"id":"23n-24","l":"","m":1,"y":0,"h":162,"a":"**A**\nAlkanes are unreactive towards ions and molecules but react with **free radicals**. A Br atom has an unpaired electron, so it can remove an H from propane (propagation step).\nBr_{2} only reacts after UV light splits it into Br• radicals."}]},{"id":"24m1-27","t":"May 2024 TZ1 Paper 1 · Q27","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m1-u10-2.webp","W":973,"H":173,"p":[{"id":"24m1-27","l":"","m":1,"y":0,"h":173,"a":"**C**\nWith limited oxygen, hydrocarbons burn to give **carbon monoxide** (and/or soot, C) **and water**. Hydrogen gas is not a product of combustion."}]},{"id":"24m2-25","t":"May 2024 TZ2 Paper 1 · Q25","s":"Multiple choice (Paper 1 and 1A)","img":"q/24m2-u10-2.webp","W":973,"H":168,"p":[{"id":"24m2-25","l":"","m":1,"y":0,"h":168,"a":"**B**\nChlorine adds across the C=C double bond, one Cl on each carbon:\nCH_{2}=CHCH_{3} + Cl_{2} → CH_{2}ClCHClCH_{3}, **1,2-dichloropropane**"}]},{"id":"24n-24","t":"Nov 2024 Paper 1 · Q24","s":"Multiple choice (Paper 1 and 1A)","img":"q/24n-u10-2.webp","W":973,"H":456,"p":[{"id":"24n-24","l":"","m":1,"y":0,"h":456,"a":"**A**\nX: HBr adds across the C=C: CH_{3}CH=CHCH_{3} + HBr → **CH_{3}CH_{2}CHBrCH_{3}** (2-bromobutane).\nY: Br_{2} adds one Br to each carbon of the double bond: **CH_{3}CHBrCHBrCH_{3}** (2,3-dibromobutane).\nAddition reactions give one product with no H_{2} or HBr given off."}]},{"id":"25m2a-10","t":"May 2025 TZ2 Paper 1A · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u10-2.webp","W":973,"H":674,"p":[{"id":"25m2a-10","l":"","m":1,"y":0,"h":467,"a":"**C**\nThe repeating unit has two carbons in the chain: one carrying a CH_{3} group and an H, the other two H atoms. Putting the double bond back between these two carbons gives **CH_{2}=CH–CH_{3}, propene**.\nA is but-2-ene, B is but-1-ene and D is buta-1,3-diene."}]},{"id":"25m2a-30","t":"May 2025 TZ2 Paper 1A · Q30","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m2a-u10-2.webp","W":973,"H":674,"p":[{"id":"25m2a-30","l":"","m":1,"y":479,"h":195,"a":"**A**\nPropagation steps use up one radical and produce another, keeping the chain going:\nCH_{4} + Cl• → •CH_{3} + HCl\nB is termination (two radicals join), C is initiation (homolytic fission in UV light), D is wrong (H• is not formed in chlorination)."}]},{"id":"25m3a-10","t":"May 2025 TZ3 Paper 1A · Q10","s":"Multiple choice (Paper 1 and 1A)","img":"q/25m3a-u10-2.webp","W":973,"H":407,"p":[{"id":"25m3a-10","l":"","m":1,"y":0,"h":407,"a":"**C**\nThe chain alternates CH_{2} and CH carrying a benzene ring (C_{6}H_{5}). Reforming the double bond gives **C_{6}H_{5}CH=CH_{2}** (phenylethene, styrene).\nA phenyl group is C_{6}H_{5} (benzene minus one H), so A and B are wrong; D has no C=C and cannot polymerize by addition."}]},{"id":"25n1a-11","t":"Nov 2025 TZ1 Paper 1A · Q11","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u10-2.webp","W":973,"H":918,"p":[{"id":"25n1a-11","l":"","m":1,"y":0,"h":404,"a":"**D**\nThe chain alternates CH(CH_{3}) and CH_{2}, so the repeating unit is –CH(CH_{3})–CH_{2}–, which comes from CH_{2}=CH–CH_{3}: **propene**."}]},{"id":"25n1a-29","t":"Nov 2025 TZ1 Paper 1A · Q29","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u10-2.webp","W":973,"H":918,"p":[{"id":"25n1a-29","l":"","m":1,"y":416,"h":193,"a":"**A**\nIn the upper atmosphere UV light breaks the **weakest** bond by homolytic fission. The C–Cl bond is weaker than C–H or C–F, so a Cl atom is removed:\nCHCl_{2}F → •CHClF + Cl•"}]},{"id":"25n1a-30","t":"Nov 2025 TZ1 Paper 1A · Q30","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n1a-u10-2.webp","W":973,"H":918,"p":[{"id":"25n1a-30","l":"","m":1,"y":621,"h":297,"a":"**C**\nBut-2-ene is symmetrical, CH_{3}CH=CHCH_{3}. Adding HBr across the double bond puts Br on C2: **2-bromobutane**.\nH_{2} would give butane, H_{2}O would give butan-2-ol and Br_{2} would give 2,3-dibromobutane."}]},{"id":"25n3a-29","t":"Nov 2025 TZ3 Paper 1A · Q29","s":"Multiple choice (Paper 1 and 1A)","img":"q/25n3a-u10-2.webp","W":973,"H":175,"p":[{"id":"25n3a-29","l":"","m":1,"y":0,"h":175,"a":"**D**\nHomolytic fission splits the bond so that **each atom keeps one electron** of the shared pair, forming two radicals: Br_{2} → 2Br•."}]},{"id":"22m1p2-3-10.2","t":"May 2022 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/22m1p2-3.webp","W":973,"H":1211,"p":[{"id":"22m1p2-3.d.i","l":"(d)(i)","m":1,"y":418,"h":294,"a":"**2-methylpropene**: CH_{2}=C(CH_{3})_{2}, i.e. a C=C double bond with two H atoms on one carbon and two CH_{3} groups on the other.\nAdding H–OH across the double bond puts the OH on the carbon carrying the two methyl groups.","g":"(d)"},{"id":"22m1p2-3.d.ii","l":"(d)(ii)","m":1,"y":712,"h":291,"a":"**–[CH_{2}–C(CH_{3})_{2}]–**\nTwo carbons in the chain, one with two H atoms and one with two CH_{3} groups, with open bonds at each end (continuation bonds).","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":398,"h":20}},"split":true},{"id":"22m2p2-4-10.2","t":"May 2022 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22m2p2-4.webp","W":973,"H":1461,"p":[{"id":"22m2p2-4.c","l":"(c)","m":2,"y":236,"h":215,"a":"Test: add **bromine water** (shake in the dark).\nResult: it changes from **orange/brown to colourless** (decolorized) if C=C is present."},{"id":"22m2p2-4.d.i","l":"(d)(i)","m":1,"y":471,"h":261,"a":"H_{3}C–CH=CH–CH_{3} drawn with every bond shown: a C=C double bond between C2 and C3, each of these carbons with one H, and each end carbon (C1 and C4) with three H atoms.","g":"(d)"},{"id":"22m2p2-4.d.ii","l":"(d)(ii)","m":1,"y":732,"h":20,"a":"**CH_{3}CH=CHCH_{3} + HBr → CH_{3}CH_{2}CHBrCH_{3}** (2-bromobutane)","g":"(d)"},{"id":"22m2p2-4.d.iii","l":"(d)(iii)","m":1,"y":752,"h":20,"a":"**(Electrophilic) addition**","g":"(d)"}],"c":{"y":0,"h":20},"ps":{"(d)":{"y":451,"h":20}},"split":true},{"id":"22np2-4-10.2","t":"Nov 2022 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/22np2-4.webp","W":973,"H":715,"p":[{"id":"22np2-4.b","l":"(b)","m":1,"y":672,"h":43,"a":"A contains a C=C double bond, so the **orange/brown bromine is decolorized** (becomes colourless) as bromine adds across the double bond."}],"c":{"y":0,"h":227},"split":true},{"id":"23m1p2-3-10.2","t":"May 2023 TZ1 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/23m1p2-3.webp","W":973,"H":805,"p":[{"id":"23m1p2-3.a.iii","l":"(a)(iii)","m":1,"y":333,"h":472,"a":"Each repeating unit is –CH(CH_{3})–CH(CH_{3})–, so two units:\n**–CH(CH_{3})–CH(CH_{3})–CH(CH_{3})–CH(CH_{3})–**\n(4 carbons in the main chain, each with one H and one CH_{3} branch, and continuation bonds at both ends.)"}],"c":{"y":0,"h":20},"split":true},{"id":"23m2p2-6-10.2","t":"May 2023 TZ2 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/23m2p2-6.webp","W":973,"H":1170,"p":[{"id":"23m2p2-6.e.i","l":"(e)(i)","m":1,"y":589,"h":20,"a":"**(Electrophilic) addition**","g":"(e)"},{"id":"23m2p2-6.e.ii","l":"(e)(ii)","m":1,"y":609,"h":20,"a":"**CH_{3}CHBrCHBrCH_{3}** (2,3-dibromobutane)","g":"(e)"},{"id":"23m2p2-6.e.iii","l":"(e)(iii)","m":1,"y":629,"h":541,"a":"Three repeating units joined in a chain:\n**–CH(CH_{3})–CH(CH_{3})–CH(CH_{3})–CH(CH_{3})–CH(CH_{3})–CH(CH_{3})–**\n(6 main chain carbons, each with one H and one CH_{3}, with open bonds at each end.)","g":"(e)"}],"c":{"y":0,"h":59},"ps":{"(e)":{"y":569,"h":20}},"split":true},{"id":"24m2p2-4-10.2","t":"May 2024 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/24m2p2-4.webp","W":973,"H":2256,"p":[{"id":"24m2p2-4.g","l":"(g)","m":2,"y":1762,"h":494,"a":"H: **propene**, CH_{2}=CH–CH_{3} (adding H_{2}O across the C=C gives propan-2-ol).\nG: a **2-halopropane**, e.g. **2-bromopropane** (or 2-chloropropane), CH_{3}CHBrCH_{3}; substitution of the halogen by OH gives propan-2-ol."}],"c":{"y":0,"h":131},"split":true},{"id":"24np2-1-10.2","t":"Nov 2024 Paper 2 · Q1","s":"Structured questions (Paper 2)","img":"q/24np2-1.webp","W":973,"H":1074,"p":[{"id":"24np2-1.b.i","l":"(b)(i)","m":1,"y":662,"h":20,"a":"**Substitution**, by a **free radical substitution** mechanism.","g":"(b)"},{"id":"24np2-1.b.ii","l":"(b)(ii)","m":4,"y":682,"h":217,"a":"Initiation (UV light, homolytic fission): **Cl_{2} → 2Cl•**\nPropagation: **C_{2}H_{6} + Cl• → •C_{2}H_{5} + HCl**\nPropagation: **•C_{2}H_{5} + Cl_{2} → C_{2}H_{5}Cl + Cl•**\nTermination (any one): **•C_{2}H_{5} + Cl• → C_{2}H_{5}Cl**, or Cl• + Cl• → Cl_{2}, or •C_{2}H_{5} + •C_{2}H_{5} → C_{4}H_{10}","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":618,"h":44}},"split":true},{"id":"25m1p2-6-10.2","t":"May 2025 TZ1 Paper 2 · Q6","s":"Structured questions (Paper 2)","img":"q/25m1p2-6.webp","W":973,"H":1705,"p":[{"id":"25m1p2-6.a.i","l":"(a)(i)","m":1,"y":157,"h":297,"a":"The repeating unit is –CH(CH_{3})–CH_{2}–, so the monomer is **propene, CH_{2}=CH–CH_{3}** (a C=C double bond with three H atoms and one CH_{3} group).","g":"(a)"},{"id":"25m1p2-6.a.ii","l":"(a)(ii)","m":1,"y":454,"h":58,"a":"It is **chemically unreactive (inert)**: the strong, non polar C–C and C–H bonds are not attacked by acids, bases or water, so the polymer is durable (for example for containers).","g":"(a)"},{"id":"25m1p2-6.c.i","l":"(c)(i)","m":1,"y":1242,"h":20,"a":"**1,2-dibromoethane**, CH_{2}BrCH_{2}Br","g":"(c)"},{"id":"25m1p2-6.c.ii","l":"(c)(ii)","m":1,"y":1262,"h":43,"a":"They contain a **C=C double bond**: one of its two bonds (the π bond) is relatively weak and electron rich, so it breaks easily and atoms can **add** across it.","g":"(c)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":137},"(c)":{"y":1222,"h":20}},"split":true},{"id":"25m2p2-3-10.2","t":"May 2025 TZ2 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25m2p2-3.webp","W":973,"H":1520,"p":[{"id":"25m2p2-3.a.i","l":"(a)(i)","m":1,"y":64,"h":20,"a":"**Cl_{2} → 2Cl•** (in UV light)","g":"(a)"},{"id":"25m2p2-3.a.ii","l":"(a)(ii)","m":1,"y":84,"h":20,"a":"**Homolytic fission** (each Cl atom keeps one electron of the bonding pair).","g":"(a)"}],"c":{"y":0,"h":20},"ps":{"(a)":{"y":20,"h":44}},"split":true},{"id":"25m2p2-4-10.2","t":"May 2025 TZ2 Paper 2 · Q4","s":"Structured questions (Paper 2)","img":"q/25m2p2-4.webp","W":973,"H":829,"p":[{"id":"25m2p2-4.a.iv","l":"(a)(iv)","m":1,"y":625,"h":44,"a":"Circle the **C=C double bond** (in the seven membered ring on the right): bromine adds across it in the dark. (The benzene ring does not react this way.)","g":"(a)"}],"c":{"y":0,"h":21},"ps":{"(a)":{"y":21,"h":413}},"split":true},{"id":"25n1p2-2-10.2","t":"Nov 2025 TZ1 Paper 2 · Q2","s":"Structured questions (Paper 2)","img":"q/25n1p2-2.webp","W":973,"H":1858,"p":[{"id":"25n1p2-2.b.v","l":"(b)(v)","m":1,"y":1213,"h":216,"a":"**UV light** (ultraviolet radiation / sunlight), to cause homolytic fission of Cl_{2}.","g":"(b)"},{"id":"25n1p2-2.b.vi","l":"(b)(vi)","m":3,"y":1429,"h":20,"a":"Propagation: **C_{2}H_{6} + Cl• → •C_{2}H_{5} + HCl**\nPropagation: **•C_{2}H_{5} + Cl_{2} → C_{2}H_{5}Cl + Cl•**\nTermination (any one): **•C_{2}H_{5} + Cl• → C_{2}H_{5}Cl**, or 2Cl• → Cl_{2}, or 2•C_{2}H_{5} → C_{4}H_{10}","g":"(b)"}],"c":{"y":0,"h":20},"ps":{"(b)":{"y":338,"h":58}},"split":true},{"id":"25n3p2-3-10.2","t":"Nov 2025 TZ3 Paper 2 · Q3","s":"Structured questions (Paper 2)","img":"q/25n3p2-3.webp","W":973,"H":3347,"p":[{"id":"25n3p2-3.d.i","l":"(d)(i)","m":2,"y":1678,"h":320,"a":"Inside the brackets: **–CH_{2}–CH(C_{6}H_{5})–**: a two carbon chain, one carbon with two H atoms, the other with one H and a **benzene ring** (phenyl group), with continuation bonds through the brackets and n outside."},{"id":"25n3p2-3.d.ii","l":"(d)(ii)","m":1,"y":1998,"h":20,"a":"**Addition** polymerization"}],"c":{"y":0,"h":165},"split":true}]}]}],"total":735};
const NOTES={
'1.1':[
{h:'Elements, compounds and mixtures',b:['An **element** contains only one type of atom. A **compound** contains two or more elements chemically combined in a fixed ratio, with properties different from its elements.','A **mixture** contains two or more substances physically combined in no fixed ratio; each keeps its own properties and they can be separated by physical methods.','**Homogeneous** mixtures have uniform composition and one phase (salt water, air, alloys). **Heterogeneous** mixtures are not uniform and have visible boundaries (sand in water, oil and water).','Separation methods: filtration (insoluble solid from liquid), evaporation/crystallization (dissolved solid from solution), distillation (liquids with different boiling points), magnet (iron), paper chromatography (dissolved components).'],t:'A compound has a fixed composition by mass; a mixture does not. Air is a mixture, water is a compound.'},
{h:'States of matter and changes of state',b:['Solid: particles closely packed in fixed positions, vibrate only; fixed shape and volume.','Liquid: particles close together but can move past each other; fixed volume, takes the shape of its container.','Gas: particles far apart, moving fast and randomly; fills its container, easily compressed.','Melting (s→l), freezing (l→s), vaporization/boiling/evaporation (l→g), condensation (g→l), **sublimation (s→g)**, **deposition (g→s)**.','During a change of state the temperature stays constant: the energy goes into overcoming (or forming) the forces between particles, not into kinetic energy.'],t:'Melting, vaporization and sublimation are endothermic; freezing, condensation and deposition are exothermic.'},
{h:'Temperature and kinetic energy',b:['The absolute (Kelvin) scale starts at absolute zero: T/K = T/°C + 273.15.','The **average kinetic energy** of particles is directly proportional to the absolute temperature in kelvin.','A temperature **change** is the same size in K and °C, so ΔT needs no 273.'],t:'Doubling the temperature in °C does not double the kinetic energy; doubling it in kelvin does.'},
{h:'Chemical equations',b:['Balance by changing **coefficients** only, never subscripts. Atoms of each element must be equal on both sides (conservation of mass).','State symbols: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.','Coefficients give the mole ratio of reactants and products.','Fractions are allowed when the question fixes 1 mol of one substance (e.g. combustion per mole of fuel).'],t:'Check the oxygen count last in combustion equations: CxHy + (x + y/4) O_{2} → x CO_{2} + y/2 H_{2}O.'}
],
'1.2':[
{h:'The mole and Avogadro’s constant',b:['One **mole** is the amount of substance containing 6.02 × 10^{23} particles (N_{A}, Avogadro’s constant).','Number of particles = n × N_{A}. Read carefully whether atoms, molecules or ions are asked for: 1 mol H_{2}O contains 3 mol atoms.','**Relative atomic mass, A_{r}**: weighted average mass of an atom compared with 1/12 of a carbon-12 atom (no units).','**Molar mass, M**: mass of one mole, in g mol^{−1}; numerically equal to M_{r}.'],t:'For hydrated salts include the water: CuSO_{4}•5H_{2}O has 9 O atoms per formula unit.'},
{h:'Moles and mass',b:['n = m / M (n in mol, m in g, M in g mol^{−1}).','Percentage by mass of an element = (number of atoms × A_{r}) / M_{r} × 100.'],t:'Keep at least 3 or 4 significant figures in intermediate steps and round only at the end.'},
{h:'Empirical and molecular formulas',b:['**Empirical formula**: simplest whole number ratio of atoms. **Molecular formula**: actual number of each atom in a molecule; a whole number multiple of the empirical formula.','Method: mass or % of each element → divide by A_{r} → divide by the smallest → multiply to remove fractions (×2 for .5, ×3 for .33).','Molecular formula: n = M_{r}(compound) / M(empirical formula).','From combustion data: all C ends up in CO_{2} and all H in H_{2}O; find O by difference.'],t:'Ionic compounds (e.g. ZnO, MgO) only have empirical formulas (formula units), not molecular formulas.'}
],
'1.3':[
{h:'Reacting masses',b:['Use the mole ratio from the balanced equation: mass → moles → ratio → moles → mass.','**Limiting reactant**: the reactant that is used up first; it decides the amount of product. Compare moles available with moles required by the ratio.','The **excess** reactant is left over; once the limiting reactant is used up, adding more of the excess does not make more product.','**Percentage yield** = actual yield / theoretical yield × 100.'],t:'Always check which reactant is limiting before using the ratio, even if the question does not ask.'},
{h:'Gases',b:['**Avogadro’s law**: equal volumes of gases at the same temperature and pressure contain equal numbers of particles, so gas volumes react in the mole ratio.','Molar volume of an ideal gas at STP (273 K, 100 kPa) = 22.7 dm^{3} mol^{−1}. V = n × V_{m}.','Ideal gas equation pV = nRT with R = 8.31 J K^{−1} mol^{−1}: use Pa and m^{3}, or kPa and dm^{3}; T must be in kelvin.','Boyle: pV constant (fixed n, T). Charles: V ∝ T (fixed n, p). Gay-Lussac: p ∝ T (fixed n, V). Combined: p_{1}V_{1}/T_{1} = p_{2}V_{2}/T_{2}.','M can be found from gas data: M = mRT / pV, or M = ρRT / p.'],t:'Ideal gas assumptions: particles have negligible volume and no intermolecular forces. Real gases deviate most at **high pressure** and **low temperature**.'},
{h:'Solutions and titrations',b:['Concentration c = n / V (mol dm^{−3}); V in dm^{3} (divide cm^{3} by 1000).','Concentration can also be in g dm^{−3} or ppm.','Dilution: c_{1}V_{1} = c_{2}V_{2} (the moles of solute do not change).','**Standard solution**: weigh accurately, dissolve in a little distilled water, transfer to a volumetric flask with rinsings, make up to the mark (bottom of the meniscus), invert to mix.','Titration: n of the known solution from c × V, use the ratio, then c = n / V of the unknown.'],t:'Use a pipette to measure the fixed volume and a burette to add the titrant. Burette readings are recorded to ±0.05 cm^{3}.'}
],
'2.1':[
{h:'Subatomic particles',b:['Proton: relative mass 1, charge +1. Neutron: relative mass 1, charge 0. Electron: relative mass about 1/2000 (0.0005), charge −1.','Nucleus contains protons and neutrons (nearly all the mass); electrons occupy the space around it.','In an electric field, protons bend towards the negative plate, electrons (lighter) bend more strongly towards the positive plate, neutrons go straight.'],t:'Atoms are not indivisible: they contain subatomic particles, can be split in nuclear reactions, and can be isotopes.'},
{h:'Nuclear symbol',b:['^{A}_{Z}X: A = mass number (protons + neutrons), Z = atomic number (protons).','Neutrons = A − Z. Electrons = Z − charge (a 2− ion has 2 extra electrons, a 3+ ion 3 fewer).','**Isoelectronic** species have the same number of electrons (e.g. N^{3−}, O^{2−}, F^{−}, Na^{+}, Mg^{2+}).'],t:'For ions, only the number of electrons changes; protons and neutrons stay the same.'},
{h:'Isotopes',b:['Isotopes: atoms of the same element with the same number of protons but different numbers of neutrons.','Same chemical properties (same electron arrangement); different physical properties that depend on mass (density, rate of diffusion, boiling point).','Uses of radioisotopes: ^{14}C dating, ^{131}I medical tracer, ^{60}Co radiotherapy.'],t:'Isotopic water molecules (with ^{3}H) have the same dipole moment but different density and boiling point.'},
{h:'Mass spectrometry and A_{r}',b:['A mass spectrometer separates ions by mass/charge ratio; peak height gives relative abundance.','A_{r} = Σ(isotope mass × % abundance) / 100.','For two isotopes, let x be the fraction of one: A_{r} = m_{1}x + m_{2}(1 − x); solve for x.'],t:'Quick check: A_{r} always lies closer to the more abundant isotope.'}
],
'2.2':[
{h:'Electromagnetic spectrum',b:['Order of increasing energy/frequency: radio < microwave < infrared < visible < ultraviolet < X-ray < gamma.','c = νλ: higher frequency means shorter wavelength. E = hν: higher frequency means higher energy.','Continuous spectrum: all wavelengths. Line spectrum: only certain wavelengths.'],t:'UV has shorter wavelength and higher energy than visible light; red light has the lowest energy of the visible colours.'},
{h:'Hydrogen emission spectrum',b:['Electrons absorb energy and jump to higher levels; when they fall back they emit photons of energy equal to the difference between levels, giving a **line emission spectrum**.','This shows electrons exist in **discrete energy levels**.','Transitions to n = 1 are in the UV, to n = 2 in the visible (red line = n = 3 → 2), to n = 3 in the IR.','The lines **converge** at higher energy because the energy levels get closer together further from the nucleus.','Ionization from the ground state is the transition n = 1 → n = ∞.','Absorption spectrum: dark lines on a continuous background (cold gas absorbs certain frequencies).'],t:'Arrow down = emission; arrow up = absorption. The limit of convergence corresponds to ionization.'},
{h:'Orbitals and sub levels',b:['Main energy level n holds a maximum of 2n^{2} electrons (2, 8, 18, 32).','Sub levels: s (1 orbital, 2 e^{−}), p (3 orbitals, 6 e^{−}), d (5 orbitals, 10 e^{−}), f (7 orbitals, 14 e^{−}).','An s orbital is spherical; a p orbital is dumbbell shaped (p_{x}, p_{y}, p_{z} along the three axes).','Each orbital holds at most two electrons with opposite spins.'],t:'Level n contains n sub levels: n = 3 has 3s, 3p and 3d.'},
{h:'Electron configurations',b:['**Aufbau**: fill orbitals in order of increasing energy: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p.','**Pauli exclusion principle**: an orbital holds a maximum of 2 electrons, which must have opposite spins.','**Hund’s rule**: electrons fill orbitals of a sub level singly, with parallel spins, before pairing.','Exceptions: Cr is [Ar] 3d^{5} 4s^{1} and Cu is [Ar] 3d^{10} 4s^{1} (half full and full d sub levels are more stable).','For transition metal ions remove the **4s electrons first**: Fe^{2+} is [Ar] 3d^{6}, Co^{2+} is [Ar] 3d^{7}, Ni^{2+} is [Ar] 3d^{8}.','Condensed form uses the previous noble gas: [Ne] 3s^{2} 3p^{4} for S.'],t:'In orbital box diagrams check both rules: no two same-spin arrows in one box, and unpaired electrons in a sub level must point the same way.'}
],
'3.1':[
{h:'Structure of the periodic table',b:['Elements are arranged in order of increasing atomic number.','Rows are **periods** (number of occupied energy levels); columns are **groups** (1 to 18; same number of valence electrons in groups 1, 2 and 13 to 18).','Blocks: s (groups 1 and 2), p (groups 13 to 18), d (transition elements), f (lanthanoids and actinoids).','Group 1 alkali metals, group 2 alkaline earth metals, group 17 halogens, group 18 noble gases.'],t:'Period number = highest occupied main energy level. Group 13 to 18: valence electrons = group number − 10.'},
{h:'Metals, metalloids and non-metals',b:['Metals are on the left and centre; non-metals on the upper right.','**Metalloids** lie along the staircase: B, Si, Ge, As, Sb, Te. They have intermediate properties (e.g. semiconductors).','Metals: shiny, malleable, conduct; lose electrons to form positive ions. Non-metals: dull, brittle, poor conductors; gain or share electrons.'],t:'Gallium is a metal, germanium and arsenic are metalloids.'},
{h:'Reading position from configuration',b:['Last electron in s: s block; in p: p block; in d: d block.','Example: [Kr] 5s^{2} 4d^{2} is group 4, period 5 (zirconium).','Element 119 would start period 8 in group 1 (like the alkali metals).'],t:'For transition metals (groups 3 to 12), group number = s electrons + d electrons.'}
],
'3.2':[
{h:'Key terms',b:['**Effective nuclear charge**: nuclear charge felt by the outer electrons (protons − shielding inner electrons). It increases across a period and stays roughly constant down a group.','**First ionization energy**: energy needed to remove one mole of electrons from one mole of gaseous atoms: X(g) → X^{+}(g) + e^{−}.','**Electron affinity**: energy change when one mole of electrons is added to one mole of gaseous atoms.','**Electronegativity**: the ability of an atom to attract a bonding pair of electrons.'],t:'Explain trends using three ideas: nuclear charge, distance (number of shells) and shielding.'},
{h:'Trends across a period (left to right)',b:['Nuclear charge increases, shielding stays about the same, electrons are in the same shell, so outer electrons are held more strongly.','Atomic radius **decreases**; first ionization energy **increases** (generally); electronegativity **increases**.','Metallic character decreases; oxides change from **basic** (Na_{2}O, MgO) through **amphoteric** (Al_{2}O_{3}) to **acidic** (P_{4}O_{10}, SO_{3}, Cl_{2}O_{7}).','Small dips in IE: group 13 (electron removed from a p sub level, higher in energy and shielded by the s electrons) and group 16 (removing a paired p electron, extra repulsion).'],t:'SiO_{2} and Al_{2}O_{3} are insoluble in water; for pH questions use Na_{2}O / MgO (alkaline) and the non-metal oxides (acidic).'},
{h:'Trends down a group',b:['More occupied shells and more shielding, so outer electrons are further from the nucleus and held less strongly.','Atomic radius **increases**; first ionization energy and electronegativity **decrease**.','Group 1: reactivity increases down the group (outer electron lost more easily); melting point decreases (weaker metallic bonding as the ions get larger).','Group 17: reactivity decreases down the group (less able to gain an electron); melting and boiling points increase (stronger London forces, more electrons): Cl_{2} gas, Br_{2} liquid, I_{2} solid.'],t:'Most vigorous reaction: the metal lowest in group 1 with the halogen highest in group 17 (e.g. K + Cl_{2}).'},
{h:'Ionic radii',b:['Positive ions are **smaller** than their atoms (lose the outer shell); negative ions are **larger** (extra electron repulsion, same nuclear charge).','For isoelectronic ions, more protons means a smaller ion: P^{3−} > S^{2−} > Cl^{−} > K^{+} > Ca^{2+}.','For the same element: Ge^{4+} < Ge^{2+} < Ge < Ge^{4−}.'],t:'Ionic radius does not simply decrease across a period: it jumps up from the cations to the anions.'},
{h:'Reactions of groups 1 and 17',b:['Group 1 + water: 2M + 2H_{2}O → 2MOH + H_{2} (alkaline solution, fizzing; K is more vigorous than Na, which is more vigorous than Li).','Group 1 + halogens: 2M + X_{2} → 2MX (ionic halides).','Halogen displacement: a more reactive halogen displaces a less reactive halide from solution: Cl_{2} + 2Br^{−} → 2Cl^{−} + Br_{2}; Br_{2} + 2I^{−} → 2Br^{−} + I_{2} (orange/yellow to brown).','Metal oxides + water give alkalis: Na_{2}O + H_{2}O → 2NaOH. Non-metal oxides give acids: SO_{3} + H_{2}O → H_{2}SO_{4}.'],t:'Bromine cannot displace chlorine from chloride: it is the weaker oxidizing agent.'}
],
'4.1':[
{h:'Ionic bonding',b:['Metals lose electrons to form cations; non-metals gain electrons to form anions, both reaching a noble gas configuration.','**Ionic bond**: electrostatic attraction between oppositely charged ions.','Ionic bonding usually needs a large electronegativity difference (about 1.8 or more).','Charges: groups 1, 2, 13 give 1+, 2+, 3+; groups 15, 16, 17 give 3−, 2−, 1−. Transition metals can have several charges, shown by Roman numerals: iron(II), copper(I).'],t:'Strength of attraction increases with **higher ion charge** and **smaller ions**: MgO > CaS, LiF > KI.'},
{h:'Polyatomic ions to learn',b:['NH_{4}^{+} ammonium, OH^{−} hydroxide, NO_{3}^{−} nitrate, NO_{2}^{−} nitrite, HCO_{3}^{−} hydrogencarbonate, CO_{3}^{2−} carbonate, SO_{4}^{2−} sulfate, SO_{3}^{2−} sulfite, PO_{4}^{3−} phosphate, CH_{3}COO^{−} ethanoate.','Write formulas by balancing charges: Ca^{2+} and PO_{4}^{3−} give Ca_{3}(PO_{4})_{2}; Al^{3+} and SO_{4}^{2−} give Al_{2}(SO_{4})_{3}.'],t:'Work out a metal’s charge from the anion: Ti_{3}(PO_{4})_{2} has 6− from phosphate, so each Ti is 2+, titanium(II) phosphate.'},
{h:'Ionic lattices and properties',b:['Ions form a giant 3D **lattice**; in NaCl each ion is surrounded by 6 ions of opposite charge.','High melting and boiling points: many strong electrostatic attractions must be overcome.','Conduct electricity only when **molten or dissolved** (ions free to move), not as solids (ions fixed).','Often soluble in water (polar water molecules surround and separate the ions); brittle (layers shift, like charges line up and repel).','Compounds containing polyatomic ions have both ionic bonds (between ions) and covalent bonds (within the polyatomic ion).'],t:'Exam phrasing: "electrostatic attraction between oppositely charged ions throughout a lattice".'}
],
'4.2':[
{h:'Covalent bonds',b:['**Covalent bond**: electrostatic attraction between a shared pair of electrons and the positively charged nuclei.','Single bond: 1 shared pair; double bond: 2 pairs; triple bond: 3 pairs.','More shared pairs means a **shorter and stronger** bond: C–C (154 pm) > C=C (134 pm) > C≡C (120 pm) in length; the order of strength is the reverse.','**Coordinate (dative) bond**: both shared electrons come from the same atom, e.g. NH_{4}^{+} (lone pair of N given to H^{+}), H_{3}O^{+}, CO.'],t:'Within a group, bonds to larger atoms are longer and weaker: C–F > C–Cl > C–Br > C–I in strength.'},
{h:'Bond polarity',b:['When atoms with different electronegativities bond, the shared pair is pulled towards the more electronegative atom: **polar bond** with δ+ and δ−.','Electronegativity difference: 0 (non polar covalent), small to about 1.8 (polar covalent), large (ionic).','Bond polarity of C–X decreases down group 17 (halogen electronegativity decreases).'],t:'F is the most electronegative element: F–H is the most polar bond with H; C–H is almost non polar.'},
{h:'Lewis (electron dot) structures',b:['Count valence electrons (add one per negative charge, remove one per positive charge).','Join atoms with single bonds, complete octets of outer atoms with lone pairs, then use multiple bonds if the central atom lacks an octet.','Show all lone pairs; put ions in square brackets with the charge.','Incomplete octets: Be in BeCl_{2} (4 electrons), B in BF_{3} and Al in AlCl_{3} (6 electrons).','Common structures: H_{2}O (2 lone pairs on O), NH_{3} (1 lone pair on N), CO_{2} (O=C=O), HCN (H–C≡N:), N_{2} (:N≡N:).'],t:'Lewis marks are often lost for missing lone pairs on the outer atoms. Draw every pair.'}
],
'4.3':[
{h:'VSEPR theory',b:['Electron domains (bonding pairs, lone pairs, double or triple bonds each count as one) repel and arrange themselves as far apart as possible.','Lone pairs repel more than bonding pairs and squeeze bond angles.','2 domains: linear, 180° (CO_{2}, HCN, BeCl_{2}).','3 domains: trigonal planar, 120° (BF_{3}, SO_{3}, NO_{3}^{−}, CO_{3}^{2−}, C_{2}H_{4}); with 1 lone pair: bent, about 117° (SO_{2}, O_{3}, NO_{2}^{−}).','4 domains: tetrahedral, 109.5° (CH_{4}, NH_{4}^{+}); 1 lone pair: trigonal pyramidal, about 107° (NH_{3}, PH_{3}); 2 lone pairs: bent, about 104.5° (H_{2}O, H_{2}S, SCl_{2}).'],t:'Name both: the **electron domain geometry** counts lone pairs, the **molecular geometry** describes only the atoms.'},
{h:'Molecular polarity',b:['A molecule is polar if it has polar bonds **and** the bond dipoles do not cancel because of its shape.','Symmetrical shapes with identical outer atoms are non polar: CO_{2}, BF_{3}, CH_{4}, CCl_{4}, C_{6}H_{6}.','Polar: H_{2}O, NH_{3}, SO_{2}, CHCl_{3}, HCN, CH_{3}Cl.','Dipole arrows point to the δ− end with a cross at the δ+ end.'],t:'NH_{3} is more polar than NBr_{3}: the N–Br bonds hardly differ in electronegativity.'},
{h:'Resonance',b:['When more than one valid Lewis structure can be drawn by moving a double bond, the real structure is a **resonance hybrid** with delocalized electrons.','All the bonds are identical and intermediate between single and double: bond order 1.5 in O_{3}, 1.33 in NO_{3}^{−} and CO_{3}^{2−}.','Examples: O_{3}, NO_{3}^{−}, NO_{2}^{−}, CO_{3}^{2−}, HCOO^{−} / RCOO^{−}, SO_{2}, HNO_{3}, benzene.','Benzene: all C–C bonds 140 pm, between C–C (154) and C=C (134); stronger than single but weaker than double.'],t:'O_{2} has a stronger bond than O_{3}, so breaking O_{2} needs higher frequency UV.'},
{h:'Giant covalent structures (allotropes of carbon)',b:['**Diamond**: each C bonded tetrahedrally to 4 others; very hard, very high melting point, does not conduct.','**Graphite**: layers of hexagons, each C bonded to 3 others (trigonal planar); one delocalized electron per C, so it conducts along the layers; weak London forces between layers make it soft and slippery.','**Graphene**: a single layer of graphite; very strong, conducts electricity.','**Fullerene C_{60}**: a molecular cage of 60 C atoms (hexagons and pentagons), each C bonded to 3 others; weak forces between molecules, low sublimation temperature, poor conductor.','**Silicon** and **silicon dioxide (SiO_{2})**: giant covalent networks with tetrahedral Si; very high melting points.'],t:'C_{60} sublimes at a lower temperature than diamond: only London forces between molecules must be overcome, not covalent bonds.'}
],
'4.4':[
{h:'Types of intermolecular forces',b:['**London (dispersion) forces**: temporary instantaneous dipoles induce dipoles in neighbouring molecules. Present in all molecules; increase with **number of electrons** (molar mass) and **surface area of contact**.','**Dipole–dipole forces**: between permanent dipoles of polar molecules.','**Hydrogen bonding**: H bonded to N, O or F is attracted to a lone pair on N, O or F of another molecule. The strongest of the three.','Order of strength (for similar sized molecules): London < dipole–dipole < hydrogen bonding < covalent bonds.'],t:'Say which molecules can hydrogen bond **and why**: H attached to a small, very electronegative atom with a lone pair.'},
{h:'Boiling points and volatility',b:['Stronger intermolecular forces mean higher boiling points and lower volatility.','Homologous series: boiling point increases with chain length (more electrons, stronger London forces).','Branched isomers have lower boiling points than straight chains (smaller surface area of contact).','NH_{3}, H_{2}O and HF have unusually high boiling points because of hydrogen bonding (NH_{3} vs PH_{3}).','Compare similar molar masses: CH_{3}OH (H bonding) > CH_{3}Cl (dipole–dipole) > C_{2}H_{6} (London only).'],t:'When a question gives similar molar masses, the answer is almost always about the **type** of intermolecular force.'},
{h:'Solubility',b:['"Like dissolves like": polar and ionic substances dissolve in water; non polar substances dissolve in non polar solvents.','Small alcohols, carboxylic acids, ammonia and HCl dissolve well in water (hydrogen bonding with water).','Solubility in water falls as the non polar hydrocarbon chain gets longer (hexan-1-ol is nearly immiscible with water).','Covalent molecular substances do not conduct electricity unless they react with water to form ions (HCl, CH_{3}COOH).'],t:'Ethanal and propanone mix with water: their C=O oxygen accepts hydrogen bonds from water.'},
{h:'Physical properties by structure',b:['Simple molecular: low melting point, do not conduct, often volatile.','Giant covalent: very high melting point, insoluble, usually non conducting (graphite is the exception).','Ionic: high melting point, conduct when molten or aqueous.','Metallic: conduct as solids and liquids, malleable, usually high melting point.'],t:'Polymers like poly(ethene) melt at a relatively low temperature: only London forces between the chains are overcome.'}
],
'4.5':[
{h:'Metallic bonding',b:['A lattice of **positive metal ions (cations)** surrounded by a "sea" of **delocalized electrons**.','**Metallic bond**: electrostatic attraction between the cations and the delocalized electrons.','The bonding is **non directional**.'],t:'Metals contain cations, never anions.'},
{h:'Strength of metallic bonding',b:['Stronger with **more delocalized electrons per atom** (higher ion charge) and **smaller ions**.','Across a period: Na < Mg < Al (melting points rise).','Down a group: Li > Na > K (melting points fall as the ions get larger).','Al > Ga: same charge but Ga^{3+} is larger.'],t:'Order of metallic bond strength: Al > Mg > Na > K.'},
{h:'Properties of metals',b:['**Electrical conductivity**: delocalized electrons move through the lattice (also as liquids).','**Thermal conductivity**: delocalized electrons and vibrating ions pass on energy.','**Malleable and ductile**: layers of cations can slide over each other while the delocalized electrons keep holding them together.','High melting points and lustre (shiny).'],t:'Malleability answer: "non directional bonding, layers of cations slide without the bond breaking".'},
{h:'Alloys',b:['An alloy is a **homogeneous mixture** of a metal with other metals or with a non-metal (e.g. steel: iron + carbon; brass: copper + zinc; bronze: copper + tin).','Atoms of different sizes disrupt the regular layers, so they cannot slide easily: alloys are **harder and stronger** but less malleable than the pure metal.','Alloys can also be more resistant to corrosion (stainless steel).'],t:'Adding carbon to iron produces steel, which is stronger than pure iron.'}
],
'5.1':[
{h:'Heat and temperature',b:['**Heat** is energy transferred because of a temperature difference. **Temperature** is a measure of the average kinetic energy of the particles.','**System**: the reactants and products; **surroundings**: everything else (the water, the container, the air).','Enthalpy H is the heat content of a system; only changes, ΔH, can be measured.'],t:'"Heat is energy transferred between particles"; temperature is not energy.'},
{h:'Exothermic and endothermic',b:['**Exothermic**: heat released to the surroundings, temperature of the surroundings rises, ΔH negative, products lower in enthalpy and **more stable**.','**Endothermic**: heat absorbed from the surroundings, temperature falls, ΔH positive, products higher and less stable.','Examples exothermic: combustion, neutralization, metals with acids, condensation, forming bonds.','Examples endothermic: thermal decomposition, dissolving NH_{4}NO_{3} or NH_{4}Cl, N_{2} + O_{2} → 2NO, melting, breaking bonds.','Energy profile: reactants and products as lines, a hump for the activation energy Ea, and ΔH as the vertical difference from reactants to products.'],t:'If a mixture gets colder, the reaction is endothermic: the system gains energy while the surroundings lose it.'},
{h:'Standard enthalpy changes',b:['Standard conditions: 100 kPa, 298 K, concentrations of 1 mol dm^{−3}, substances in their standard states.','**Standard enthalpy of combustion, ΔH_{c}**: one mole of a substance burnt completely in oxygen (always negative).','**Standard enthalpy of formation, ΔH_{f}**: one mole of a compound formed from its elements in their standard states. ΔH_{f} of an element is zero.','Enthalpy of neutralization: one mole of water formed from an acid and a base.'],t:'For ΔH_{f} equations use elements in standard states (O_{2}(g), not O or O_{3}) and fractions to make exactly 1 mol of product.'},
{h:'Calorimetry',b:['q = mcΔT, where m is the mass of **water (or solution)** that is heated, c = 4.18 J g^{−1} K^{−1}, ΔT the temperature change.','ΔH = −q / n (kJ mol^{−1}): divide q in J by 1000; n is moles of the limiting reactant (or of the fuel burned).','Assume the density of solutions is 1.00 g cm^{−3} and their c equals that of water.','Main error: **heat loss** to the surroundings, so experimental values are less exothermic than literature. Improve with insulation, a lid, a draught shield, placing the flame close; for solutions use a polystyrene cup and extrapolate the cooling curve.','Incomplete combustion (soot) also makes values too small.'],t:'Check the sign: exothermic answers must be negative. ΔT in K equals ΔT in °C, so never add 273 to a temperature change.'}
],
'5.2':[
{h:'Hess’s law',b:['The enthalpy change of a reaction depends only on the initial and final states, not on the route taken (conservation of energy).','Manipulating equations: reversing a reaction reverses the sign of ΔH; multiplying the equation multiplies ΔH by the same factor.','Add the equations so that unwanted species cancel and the target equation remains.'],t:'Write the target equation first, then pick each given equation for the species it supplies, reversing or scaling as needed.'},
{h:'Using enthalpies of formation',b:['ΔH_{reaction} = ΣΔH_{f}(products) − ΣΔH_{f}(reactants).','Multiply each ΔH_{f} by its coefficient; elements in standard states contribute zero.','Watch the state: H_{2}O(l) −285.8 and H_{2}O(g) −241.8 kJ mol^{−1}.'],t:'Products minus reactants for formation; reactants minus products for combustion.'},
{h:'Using enthalpies of combustion',b:['ΔH_{reaction} = ΣΔH_{c}(reactants) − ΣΔH_{c}(products).','Typical use: finding ΔH_{f} of a compound from the ΔH_{c} of carbon, hydrogen and the compound.','Example: ΔH_{f}(CH_{4}) = ΔH_{c}(C) + 2ΔH_{c}(H_{2}) − ΔH_{c}(CH_{4}).'],t:'Energy cycle diagrams: going against an arrow means using −ΔH for that step.'}
],
'5.3':[
{h:'Bond breaking and making',b:['Breaking bonds **absorbs** energy (endothermic, ΔH positive).','Forming bonds **releases** energy (exothermic, ΔH negative).','A reaction is exothermic if the bonds formed in the products are stronger (release more energy) than the bonds broken in the reactants.'],t:'Never say "bond breaking releases energy".'},
{h:'Average bond enthalpies',b:['**Bond enthalpy**: energy needed to break one mole of a bond in gaseous molecules, averaged over many compounds.','ΔH = Σ(bond enthalpies of bonds broken) − Σ(bond enthalpies of bonds formed).','Only bonds that change need to be counted; unchanged bonds cancel.','Data booklet values (kJ mol^{−1}): C–H 414, C–C 346, C=C 614, C–O 358, C=O 804, O–H 463, O=O 498, H–H 436, N≡N 945, N–H 391, Cl–Cl 242, C–Cl 324, H–Cl 431.'],t:'Bond enthalpy answers differ from Hess’s law answers because the values are **averages** and only apply to **gases**.'},
{h:'Ozone and oxygen',b:['O_{2} has a double bond (bond order 2); O_{3} bonds have bond order 1.5 (resonance), so they are weaker and longer.','Breaking O=O needs higher energy (shorter wavelength) UV than breaking a bond in O_{3}.'],t:'Weakest bond breaks first in UV light: in CFCs the C–Cl bond breaks, not C–F.'}
],
'6.1':[
{h:'Rate of reaction',b:['Rate = change in concentration (of a reactant or product) per unit time; units mol dm^{−3} s^{−1}.','From a graph: average rate = Δy/Δx between two points; rate at an instant (or initial rate) = gradient of the **tangent**.','Rates are fastest at the start and decrease as reactants are used up (fewer collisions per unit time).','Methods: gas volume (gas syringe), mass loss (gas escaping), colour change (colorimeter), pH change, conductivity change, time for a precipitate to obscure a mark.'],t:'Pick a method that matches a property that **changes**: no gas means no mass loss; all colourless means no colorimeter.'},
{h:'Collision theory',b:['Particles must **collide**, with energy **≥ activation energy (Ea)**, and with the **correct orientation**.','Activation energy: the minimum energy needed for a collision to lead to reaction.','Rate depends on the frequency of **successful** collisions.'],t:'Two reasons a collision fails: not enough energy or wrong orientation.'},
{h:'Factors affecting rate',b:['**Concentration / pressure** (gases): more particles per unit volume, more frequent collisions.','**Surface area**: smaller pieces or powder expose more particles, more frequent collisions.','**Temperature**: particles have more kinetic energy, so a **greater proportion have E ≥ Ea** (main effect) and collisions are more frequent.','**Catalyst**: provides an **alternative pathway with a lower Ea**, so a greater proportion of collisions are successful. It is not used up, does not change ΔH or the position of equilibrium, and speeds up forward and reverse reactions equally.','Pressure has no effect on reactions with no gaseous reactants.'],t:'If the limiting reactant is unchanged, the final amount of product is the same: only the curve’s steepness changes.'},
{h:'Maxwell–Boltzmann distribution',b:['Shows the number (fraction) of particles with each kinetic energy. Starts at the origin, never touches the energy axis; the area under the curve is the total number of particles.','At a higher temperature the curve is **flatter, the peak is lower and shifts to the right**; the same area.','Mark Ea on the energy axis: the area to the right of Ea is the fraction able to react; it is much larger at higher temperature.','A catalyst does not change the curve; mark a **lower Ea** to the left of the original.'],t:'Ea itself does not change with temperature.'}
],
'7.1':[
{h:'Dynamic equilibrium',b:['Reached in a **closed system** when the rate of the forward reaction equals the rate of the reverse reaction.','Concentrations of reactants and products stay **constant** (not equal), while both reactions continue: **dynamic**.','Equilibrium can be approached from either side.','Physical equilibria exist too, e.g. a saturated solution with undissolved crystals (crystal shape can slowly change).'],t:'"Dynamic" means the forward and reverse reactions are still happening.'},
{h:'Equilibrium constant expression',b:['For aA + bB ⇌ cC + dD: K_{c} = [C]^{c}[D]^{d} / ([A]^{a}[B]^{b}).','Concentrations are equilibrium values in mol dm^{−3}. Pure solids (and the solvent water in dilute solution) are left out.','**Large K** (>> 1): equilibrium lies to the right, mostly products. **Small K** (<< 1): mostly reactants.','Reverse reaction: K’ = 1/K. Double the coefficients: K’ = K^{2}. Halve them: K’ = √K.','K changes **only with temperature**.'],t:'To find K from equilibrium amounts, divide each by the volume first (if the volume is 1 dm^{3} the amounts equal the concentrations).'},
{h:'Reaction quotient Q',b:['Q has the same expression as K but uses concentrations at any moment.','Q < K: reaction proceeds to the right (forward). Q > K: proceeds to the left. Q = K: at equilibrium.','The instant the temperature changes, Q is unchanged but K changes.'],t:'Exothermic reaction heated: K decreases, so Q > K and the equilibrium shifts left.'},
{h:'Le Châtelier’s principle',b:['A system at equilibrium responds to a change so as to partly oppose the change.','**Concentration**: adding a substance shifts the equilibrium away from it; removing one shifts towards it. K unchanged.','**Pressure** (gases): increasing pressure shifts towards **fewer moles of gas**. No effect if gas moles are equal. K unchanged.','**Temperature**: increasing T favours the **endothermic** direction. K increases for endothermic, decreases for exothermic forward reactions.','**Catalyst**: no effect on position or K; equilibrium is reached faster.','Haber process N_{2} + 3H_{2} ⇌ 2NH_{3} (exothermic): high pressure and low temperature favour NH_{3}; a compromise temperature and an iron catalyst are used. Contact process: 2SO_{2} + O_{2} ⇌ 2SO_{3} (exothermic), V_{2}O_{5} catalyst.'],t:'Decreasing volume suddenly raises every gas concentration; then the system shifts to reduce it partly.'}
],
'8.1':[
{h:'Brønsted–Lowry theory',b:['**Acid**: proton (H^{+}) donor. **Base**: proton acceptor.','A **conjugate acid–base pair** differs by exactly one H^{+}: CH_{3}COOH / CH_{3}COO^{−}, NH_{4}^{+} / NH_{3}, H_{3}O^{+} / H_{2}O, H_{2}O / OH^{−}.','In HA + H_{2}O ⇌ H_{3}O^{+} + A^{−}: HA and H_{3}O^{+} are acids; H_{2}O and A^{−} are bases.','A base needs a lone pair to accept H^{+} (e.g. NH_{3}, amines, OH^{−}).'],t:'Conjugate base = acid minus one H^{+}. The conjugate base of OH^{−} is O^{2−}.'},
{h:'Amphiprotic species',b:['Can act as both an acid and a base: H_{2}O, HCO_{3}^{−}, HSO_{4}^{−}, H_{2}PO_{4}^{−}, HPO_{4}^{2−}, amino acids.','They must contain an H that can be donated **and** a lone pair to accept H^{+}.','Amphoteric is the wider term (e.g. Al_{2}O_{3} reacts with acids and bases).'],t:'PO_{4}^{3−} has no H to give, so it is not amphiprotic.'}
],
'8.2':[
{h:'Typical reactions of acids',b:['Acid + metal → salt + hydrogen: Mg + 2HCl → MgCl_{2} + H_{2} (fizzing).','Acid + base (metal oxide or hydroxide) → salt + water: ZnO + 2HCl → ZnCl_{2} + H_{2}O.','Acid + carbonate → salt + water + carbon dioxide: CaCO_{3} + 2HCl → CaCl_{2} + H_{2}O + CO_{2}.','Acid + hydrogencarbonate → salt + water + carbon dioxide: H_{2}SO_{4} + 2NaHCO_{3} → Na_{2}SO_{4} + 2H_{2}O + 2CO_{2}.','Acid + ammonia → ammonium salt.'],t:'Cu does not react with dilute HCl; neutralization of NaOH with HCl gives water, not H_{2}.'},
{h:'Neutralization',b:['Neutralization: H^{+}(aq) + OH^{−}(aq) → H_{2}O(l); it is exothermic.','Salt naming: metal + anion from the acid (HCl → chloride, H_{2}SO_{4} → sulfate, HNO_{3} → nitrate, CH_{3}COOH → ethanoate).','Alkalis are soluble bases (NaOH, KOH, NH_{3}(aq)).','Indicators change colour at the end point; a pH meter or conductivity probe can also follow a titration.'],t:'Thermometric titration: the maximum temperature occurs at the equivalence point.'}
],
'8.3':[
{h:'The pH scale',b:['pH = −log_{10}[H^{+}] (or [H_{3}O^{+}]); [H^{+}] = 10^{−pH}.','Each pH unit is a **tenfold** change in [H^{+}]: pH 5 to pH 10 means [H^{+}] is 10^{5} times lower.','Diluting a strong acid by a factor of 10 raises the pH by 1.','pH < 7 acidic, 7 neutral, > 7 basic (at 298 K).'],t:'pH has no units. Give it to 2 decimal places when the data are 2 or 3 significant figures.'},
{h:'Ionic product of water',b:['H_{2}O ⇌ H^{+} + OH^{−}; K_{w} = [H^{+}][OH^{−}] = 1.00 × 10^{−14} at 298 K.','In pure water [H^{+}] = [OH^{−}] = 1.0 × 10^{−7}: pH 7.','pOH = −log[OH^{−}] and pH + pOH = 14.00 at 298 K.','For strong bases: [OH^{−}] = concentration × number of OH^{−} per formula (Ca(OH)_{2} gives 2).'],t:'Find pH of a base: [OH^{−}] → pOH → 14 − pOH. Or [H^{+}] = 10^{−14} / [OH^{−}].'},
{h:'Measuring pH',b:['Universal indicator (colour) or a pH meter / probe (more precise).','A solution is acidic if [H^{+}] > 1 × 10^{−7} mol dm^{−3} at 298 K, even if the value is given as [OH^{−}].'],t:'[OH^{−}] = 10^{−13} means [H^{+}] = 0.1 mol dm^{−3}: strongly acidic.'}
],
'8.4':[
{h:'Strong and weak',b:['**Strong acids** dissociate (ionize) completely in water: HCl, HNO_{3}, H_{2}SO_{4} (first H). **Weak acids** only partially dissociate: CH_{3}COOH, HCOOH, H_{2}CO_{3}, HCN, HNO_{2}.','**Strong bases**: group 1 hydroxides and Ba(OH)_{2}. **Weak bases**: NH_{3}, amines.','Weak acid equilibrium: CH_{3}COOH ⇌ CH_{3}COO^{−} + H^{+} (equilibrium lies to the left).','The stronger the acid, the weaker its conjugate base (Cl^{−} is a very weak base).'],t:'Strong/weak is about the **degree of dissociation**; concentrated/dilute is about the **amount** of acid per volume.'},
{h:'Distinguishing strong and weak acids (same concentration)',b:['**pH**: weak acid has a higher pH.','**Electrical conductivity**: weak acid conducts less (fewer ions).','**Rate of reaction** with Mg, CaCO_{3} or Na_{2}CO_{3}: weak acid reacts more slowly (less vigorous fizzing).','Same for both: the volume of base needed to neutralize them and the total amount of gas produced with excess metal or carbonate.'],t:'Do not use "neutralization volume" to tell them apart: it is the same for equal amounts of monoprotic acids.'},
{h:'Equilibrium position and K',b:['For HA + H_{2}O ⇌ H_{3}O^{+} + A^{−}, a K value less than 1 means the reverse reaction is favoured: H_{3}O^{+} is the stronger acid.','Carboxylic acids are weak because their equilibrium lies mostly to the left.'],t:'Order of conductivity at the same concentration: non electrolyte < weak acid < strong acid.'}
],
'8.5':[
{h:'Acid rain and acid deposition',b:['Normal rain is weakly acidic (pH about 5.6) because CO_{2} dissolves: CO_{2} + H_{2}O ⇌ H_{2}CO_{3}.','**Acid deposition** (pH below 5.6) is caused by sulfur and nitrogen oxides; it can be wet (rain, snow, fog) or dry (particles, gases).','Sulfur oxides come from burning sulfur-containing fossil fuels (coal) and smelting: S + O_{2} → SO_{2}.','Nitrogen oxides form at high temperatures in engines: N_{2} + O_{2} → 2NO; 2NO + O_{2} → 2NO_{2}.'],t:'All non-metal oxides here are acidic gases: NO_{2}, CO_{2}, SO_{2}.'},
{h:'Equations to learn',b:['SO_{2} + H_{2}O → H_{2}SO_{3} (sulfurous acid).','2SO_{2} + O_{2} → 2SO_{3}; SO_{3} + H_{2}O → H_{2}SO_{4} (sulfuric acid).','2NO_{2} + H_{2}O → HNO_{3} + HNO_{2}.','4NO_{2} + O_{2} + 2H_{2}O → 4HNO_{3}.'],t:'Learn one sulfur and one nitrogen route to an acid; questions often ask for "an equation" for either.'},
{h:'Effects',b:['Buildings and statues of limestone/marble erode: CaCO_{3} + H_{2}SO_{4} → CaSO_{4} + H_{2}O + CO_{2}.','Metals corrode faster.','Lakes become acidic (fish die; Al^{3+} leached from soils is toxic).','Forests: nutrients (Mg^{2+}, Ca^{2+}) leached from soil; leaves damaged.','Human health: respiratory problems.'],t:'Name the specific chemical damage, not just "harms the environment".'},
{h:'Reducing acid deposition',b:['**Pre combustion**: remove sulfur from fuels (crushing and washing coal, solvent extraction, hydrodesulfurization of oil).','**Post combustion**: flue gas desulfurization (scrubbing with CaO or CaCO_{3} slurry): CaO + SO_{2} → CaSO_{3}.','Catalytic converters reduce NOx: 2CO + 2NO → 2CO_{2} + N_{2}.','Lower engine temperatures, renewable energy, public transport, liming acidified lakes (CaO / Ca(OH)_{2}).'],t:'Scrubbing flue gases is post combustion, not pre combustion.'}
],
'10.1':[
{h:'Homologous series',b:['Same **general formula** and **functional group**; successive members differ by **CH_{2}**.','Similar chemical properties; **gradation** of physical properties (boiling point rises with chain length).','Alkanes C_{n}H_{2n+2}, alkenes C_{n}H_{2n}, alkynes C_{n}H_{2n−2}, alcohols C_{n}H_{2n+1}OH, aldehydes and ketones C_{n}H_{2n}O, carboxylic acids C_{n}H_{2n+1}COOH.','Saturated: only single C–C bonds. Unsaturated: contains C=C or C≡C.'],t:'Propanone (C_{3}H_{6}O) and butanone (C_{4}H_{8}O) differ by CH_{2} but do not share an empirical formula.'},

function fmt(a){
  const L=a.split('\n'); let h='',ul=false,i=0;
  const m=L[0].match(/^\*\*([A-D])\*\*$/);
  if(m){h+='<div class="letter"><span>Answer</span>'+m[1]+'</div>';i=1}
  for(;i<L.length;i++){const l=L[i].trim(); if(!l)continue;
    if(l.startsWith('- ')){if(!ul){h+='<ul>';ul=true} h+='<li>'+inline(l.slice(2))+'</li>'}
    else{if(ul){h+='</ul>';ul=false} h+='<p>'+inline(l)+'</p>'}}
  if(ul)h+='</ul>'; return h}
function fm(s){let i=0;
  function grp(stop){let h='';while(i<s.length){const c=s[i];
      if(stop.includes(c))return h;
      if(c=='{'){i++;const a=grp('|}');if(s[i]=='|'){i++;const b=grp('}');i++;h+='<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'}else{i++;h+=a}continue}
      if(c=='√'&&s[i+1]=='{'){i+=2;const a=grp('}');i++;h+='<span class="rt"><span class="rs">√</span><span class="rad">'+a+'</span></span>';continue}
      if((c=='_'||c=='^')&&s[i+1]=='{'){i+=2;const a=grp('}');i++;h+=(c=='_'?'<sub>':'<sup>')+a+(c=='_'?'</sub>':'</sup>');continue}
      if(c==' '&&s[i+1]==' '){while(s[i]==' ')i++;h+='<span class="gap"></span>';continue}
      h+=c=='<'?'&lt;':c=='&'?'&amp;':c;i++}
    return h}
  return grp('')}

  $('#tBar').style.width=(100*d/DATA.total)+'%'; $('#tRev').textContent=DATA.themes.reduce((n,t)=>n+t.units.reduce((m,u)=>m+count(unitParts(u),S.rev),0),0);
  $('#tRows').innerHTML=DATA.themes.map(t=>{const ps=t.units.flatMap(unitParts),n=count(ps,S.done);
    return '<div class="row"><span class="tile">'+t.k+'</span><div class="bar"><i style="width:'+(ps.length?100*n/ps.length:0)+'%"></i></div><span class="n">'+n+'/'+ps.length+'</span></div>'}).join('');
  const c=$('#ucnt'); if(c&&view.unit){const ps=unitParts(UNITS[view.unit]);c.textContent=count(ps,S.done)+' / '+ps.length+' done'}}
function tick(){let s=Math.max(0,Math.floor((EXAM-Date.now())/1000));
  const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60],n=['days','hours','min','sec'];
  $('#clock').innerHTML=s?v.map((x,i)=>'<div><b>'+String(x).padStart(2,'0')+'</b><span>'+n[i]+'</span></div>').join(''):'<div style="grid-column:1/-1"><b>Exam time</b><span>good luck</span></div>'}
function cropHTML(q,y,h,alt){const w=q.W;return '<div class="scroll"><div class="crop" style="width:'+Math.round(w*SC)+'px;min-width:min('+Math.round(w*SC)+'px,max(100%,'+Math.round(w*0.56)+'px));max-width:100%;aspect-ratio:'+w+'/'+h+'"><img loading="lazy" decoding="async" alt="'+esc(alt)+'" src="'+q.img+'" style="width:100%;top:'+(-100*y/h)+'%"></div></div>'}
function partHTML(p,q){
  const d=!!S.done[p.id],f=!!S.rev[p.id];
  return '<div class="part'+(d?' is-done':'')+(f?' is-flag':'')+'" data-id="'+p.id+'">'
   +cropHTML(q,p.y,p.h,q.t+' '+p.l)
   +'<div class="ctl"><span class="lab">'+(p.l?esc(p.l)+' · ':'')+(p.m?p.m+(p.m==1?' mark':' marks'):'')+'</span>'
   +'<button type="button" class="b done" data-act="done" aria-pressed="'+d+'"><span class="box">'+(d?'✓':'')+'</span>Done</button>'
   +'<button type="button" class="b flag" data-act="flag" aria-pressed="'+f+'"><span>⚑</span>Review</button>'
   +'<button type="button" class="b show" data-act="show" aria-expanded="false">Show answer</button></div>'
   +'<div class="ans" hidden></div></div>'}
function qHTML(q,ps,full){const m=q.p.reduce((a,p)=>a+p.m,0);
  return '<section class="q"><header><h3>'+esc(q.t)+'</h3><span>'+(q.p.length>1?q.p.length+' parts · ':'')+m+(m==1?' mark':' marks')+'</span></header>'+(q.c?'<div class="ctx">'+cropHTML(q,q.c.y,q.c.h,q.t+' introduction')+'</div>':'')+(()=>{const seen={};return ps.map(p=>{let h='';if(p.g&&q.ps&&q.ps[p.g]&&!seen[p.g]){seen[p.g]=1;h='<div class="ctx">'+cropHTML(q,q.ps[p.g].y,q.ps[p.g].h,q.t+' '+p.g)+'</div>'}return h+partHTML(p,q)}).join('')})()+(q.split||(full&&(q.p.length>1||q.c))?'<div class="qfull"><button type="button" class="b whole" data-whole="'+q.id+'" aria-expanded="false">Show complete question</button><div class="wholeq" hidden></div></div>':'')+'</section>'}
const keep=p=>view.filter=='todo'?!S.done[p.id]:view.filter=='rev'?!!S.rev[p.id]:true;
function render(){
  $('#wrap').classList.toggle('in-unit',view.name!='home'); if(view.tab!='ws')return renderStudy(); let h=tabsHTML();
  if(view.name=='home'){
    h+='<h1>IBDP Chemistry By Sanjith Chellamuthu</h1><p class="lede">Every SL past paper question from 2022 to 2025 that fits the old syllabus, sorted by topic and sub topic. Tick parts off as you finish them and flag anything to come back to.</p>';
    h+=DATA.themes.map(t=>'<section class="theme"><h2><span class="tile">'+t.k+'</span>Topic '+t.k+' <span class="sub">'+t.n+'</span></h2><div class="units">'+t.units.map(u=>{
      const ps=unitParts(u),n=count(ps,S.done),r=count(ps,S.rev);
      return ps.length?'<button type="button" class="unit" data-unit="'+u.k+'"><span class="code">'+u.k+'</span><span class="name">'+u.n+'</span><span class="meta"><span>'+n+' / '+ps.length+' done</span><span>'+(r?'⚑ '+r:'')+'</span></span><div class="bar"><i style="width:'+(100*n/ps.length)+'%"></i></div></button>'
        :'<button type="button" class="unit" disabled><span class="code">'+u.k+'</span><span class="name">'+u.n+'</span><span class="meta"><span>No questions yet</span></span></button>'}).join('')+'</div></section>').join('');
    h+='<p class="foot">Left out because they are not in your exam: redox and electrochemistry, measurement and data processing (uncertainties, errors, spectroscopy), and organic reactions beyond addition polymers. Paper 1B and new syllabus Paper 2 parts are included only where they test the old syllabus.</p>';
  } else if(view.name=='unit'){
    const u=UNITS[view.unit]; const chip=(k,l)=>'<button type="button" class="chip" data-filter="'+k+'" aria-pressed="'+(view.filter==k)+'">'+l+'</button>';
    h+='<div class="top"><button type="button" class="back" data-home>← All topics</button><div class="ttl"><small>'+u.k+'</small>'+u.n+'</div><span class="cnt" id="ucnt"></span><div class="chips">'+chip('all','All')+chip('todo','To do')+chip('rev','Review')+'</div></div>';
    let sec=null,any=false;
    u.q.forEach(q=>{const ps=q.p.filter(keep); if(!ps.length)return; any=true;
      if(q.s!==sec){sec=q.s; if(sec)h+='<h2 class="sec">'+esc(sec)+'</h2>'} h+=qHTML(q,ps,view.filter=='rev')});
    if(!any)h+='<p class="empty">'+(view.filter=='todo'?'Everything in this sub topic is done.':'Nothing in this sub topic is marked for review.')+'</p>';
  } else {
    h+='<div class="top"><button type="button" class="back" data-home>← All topics</button><div class="ttl">Marked for review</div></div>'; let any=false;
    DATA.themes.forEach(t=>t.units.forEach(u=>{const qs=u.q.map(q=>[q,q.p.filter(p=>S.rev[p.id])]).filter(x=>x[1].length); if(!qs.length)return; any=true;
      h+='<h2 class="sec">'+u.k+' '+u.n+'</h2>'+qs.map(x=>qHTML(x[0],x[1],true)).join('')}));
    if(!any)h+='<p class="empty">Nothing is marked for review yet. Use the ⚑ Review button on any question part.</p>';
  }
  main.innerHTML=h; tracker()}
function go(v){Object.assign(view,v); try{localStorage.setItem(LS+'-view',JSON.stringify(view))}catch(e){} render(); window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.tab)return go({tab:b.dataset.tab,name:'home',unit:null});
  if(b.dataset.nunit)return go({tab:'notes',name:'unit',unit:b.dataset.nunit});
  if(b.dataset.funit)return go({tab:'formulas',name:'unit',unit:b.dataset.funit});
  if('fall' in b.dataset)return go({tab:'formulas',name:'all',unit:null});
  if('si' in b.dataset)return go({tab:'formulas',name:'si',unit:null});
  if(b.dataset.unit)return go({tab:'ws',name:'unit',unit:b.dataset.unit,filter:'all'});
  if('home' in b.dataset)return go({name:'home',unit:null});
  if(b.id=='revBtn')return go({tab:'ws',name:'review',unit:null});
  if(b.dataset.filter){view.filter=b.dataset.filter;return render()}
  if(b.dataset.whole){const q=QBY[b.dataset.whole],box=b.nextElementSibling,open=box.hidden;
    if(open&&!box.innerHTML)box.innerHTML='<p class="eyebrow">Complete question</p>'+cropHTML(q,0,q.H,q.t);
    box.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'Hide complete question':'Show complete question';return}
  const el=b.closest('.part'); if(!el)return; const id=el.dataset.id,act=b.dataset.act;
  if(act=='show'){const a=el.querySelector('.ans'),open=a.hidden;
    if(open&&!a.innerHTML)a.innerHTML='<p class="eyebrow">'+(PARTS[id].q.s.startsWith('Multiple')?'Answer and working':'Model answer')+'</p>'+fmt(PARTS[id].p.a);
    a.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'Hide answer':'Show answer';return}
  const map=act=='done'?S.done:S.rev; if(map[id])delete map[id];else map[id]=1; const on=!!map[id];
  b.setAttribute('aria-pressed',on); el.classList.toggle(act=='done'?'is-done':'is-flag',on);
  if(act=='done')b.querySelector('.box').textContent=on?'✓':'';
  save(); tracker()});
load();
try{const v=JSON.parse(localStorage.getItem(LS+'-view')||'null'); if(v){v.tab=v.tab||'ws'; const ok=v.tab=='ws'?(v.name=='home'||v.name=='review'||UNITS[v.unit]):(v.name=='home'||v.name=='all'||v.name=='si'||NOTES[v.unit]); if(ok)Object.assign(view,v)}}catch(e){}
render(); tick(); setInterval(tick,1000); connect();

</script>
